the InfluxDB image&rsquo;s entrypoint starts as root, takes ownership of its own data directory and only then drops to the unprivileged user it runs as. That is also why the <code>storage</code> step refuses NFS and CIFS outright &mdash; a network filesystem is where that <code>chown</code> fails, and it fails after the disk looked fine.</p>\n  <p><b>Ordering, and the price of <code>nofail</code>.</b> A mount generated from <code>/etc/fstab</code> is normally part of <code>local-fs.target</code>, and every ordinary service is ordered after that &mdash; so the disk would be mounted before Docker started, for free. <code>nofail</code> takes that away. It is what stops a missing disk from ending the boot at a maintenance shell, and it buys that by making the mount merely <em>wanted</em> rather than required, <b>and by dropping its ordering against <code>local-fs.target</code> as well</b>. Docker is then free to start while an old drive is still spinning up, find no directory to bind, and leave InfluxDB down until somebody notices &mdash; on every cold boot, on exactly the kind of drive <a href=\"#s03\">section 03</a> recommends.</p>\n  <p>So the ordering is put back by hand, against the one unit that cares. The line <code>--prepare-disk</code> writes carries <code>x-systemd.before=docker.service</code> alongside <code>nofail</code>, which orders the mount ahead of Docker without making Docker depend on it: a disk that never appears still lets the boot, evcc and the car&rsquo;s Bluetooth link carry on. The full options are <code>defaults,noatime,nofail,x-systemd.device-timeout=30,x-systemd.before=docker.service</code>, and the <code>storage</code> step reads them back out of <code>/etc/fstab</code> on every run and says so if either half is missing.</p>\n</div>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Compose file</span><span class=\"path\">~/telegraf/docker-compose.yml</span></div>\n<pre>services:\n  telegraf:\n    image: telegraf:1.35\n    container_name: telegraf\n    restart: unless-stopped\n    network_mode: host\n    user: \"telegraf:CHANGE_ME_DOCKER_GID\"    <span class=\"c\">…the docker group's numeric id…</span>\n    environment:\n      - HOST_ETC=/hostfs/etc\n      - HOST_PROC=/hostfs/proc\n      - HOST_SYS=/hostfs/sys\n      - HOST_VAR=/hostfs/var\n      - HOST_RUN=/hostfs/run\n      - HOST_MOUNT_PREFIX=/hostfs\n    volumes:\n      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro\n      - /:/hostfs:ro\n      - /dev:/dev:ro\n      - /run/udev:/run/udev:ro\n      - /var/run/docker.sock:/var/run/docker.sock:ro</pre>\n</div>\n\n<p data-lvl=\"3\">The Pi&rsquo;s own vitals: processor, memory and swap, temperature, disks and disk I/O, network, the containers, and four health checks against the same ports the boot report knocks on. Everything it reads it reads read-only &mdash; the host&rsquo;s <code>/</code> is mounted at <code>/hostfs</code> with the <code>HOST_*</code> variables pointing every collector there, and the docker socket is mounted <code>:ro</code> because Telegraf only ever queries it. <code>network_mode: host</code> is what makes <code>eth0</code> and <code>wlan0</code> the interfaces it measures rather than a container&rsquo;s own virtual pair, and what makes <code>localhost</code> the address of InfluxDB and of everything it health-checks. It runs as the <code>telegraf</code> user plus the docker group&rsquo;s numeric id, which the installer reads off the docker group and writes in: membership of that group is what lets it read the socket without running as root. Its output goes to the <code>system</code> bucket &mdash; ninety days rather than for ever &mdash; with a token scoped to write there and nowhere else. The two read-only peeks at <code>/dev</code> and <code>/run/udev</code> exist only so the disk collector can name devices; without them the numbers still flow, but every gather logs a warning, and a log that cries wolf every thirty seconds hides a real one.</p>\n\n<div data-lvl=\"4\" class=\"note blue\">\n  <span class=\"h\">Every image is pinned, and two of the pins can raise themselves</span>\n  <p>A Docker tag is a mutable pointer, not a version, so every image in this build names something narrower than <code>latest</code>. The two monitoring images name a MAJOR.MINOR track through a variable with a default &mdash; <code>grafana/grafana:${GRAFANA_PIN:-13.2}</code> and <code>influxdb:${INFLUXDB_PIN:-2.9}</code> &mdash; Telegraf names the <code>1.35</code> track outright, and the BLE proxy names a whole version through the same variable form &mdash; <code>wimaha/tesla-ble-http-proxy:${BLE_PIN:-2.3.0}</code> &mdash; because its registry publishes whole versions and no minor track at all.</p>\n  <p>The variable form is what lets a pin move without editing a file the next release would write over. Compose resolves <code>${GRAFANA_PIN:-13.2}</code> against the <code>.env</code> sitting beside the compose file: absent, the shipped default answers; present, the recorded word wins. So when the runner takes a minor past the track, or when a <code>-raise</code> instance answers a major, it writes one line into that <code>.env</code> &mdash; a file no release ships and no converge overwrites &mdash; and mirrors the same line into <code>/etc/solar-surplus/pins</code>, which rides the answers archive: the one archive a restore puts back <em>before</em> <code>install.py</code> runs. A reinstall therefore re-materialises the raised pin, instead of starting a default-pin container over data a newer one wrote.</p>\n  <p>A raise is proved before it is recorded. <code>docker manifest inspect</code> has to find the registry actually serving the new track, or the run records <code>current</code> and says the pin waits for the first night the tag exists &mdash; a pin raised toward something that does not pull yet would fail every later night, and nothing ever lowers a recorded pin back. When the runner finally pulls, it drops <code>GRAFANA_PIN</code>, <code>INFLUXDB_PIN</code> and <code>BLE_PIN</code> out of its own environment first, so the <code>.env</code> the gate read is by construction the <code>.env</code> compose resolves; a stray export elsewhere could otherwise steer the tag sideways past a gate that had approved something quite different.</p>\n  <p>The BLE proxy&rsquo;s pin is exact rather than a track, because there is no <code>2.3</code> tag on Docker Hub to sit inside &mdash; the registry serves whole versions and nothing else &mdash; so every release moves the pin. That could make it the one component the runner refuses and the ladder skips, its tag moved by hand instead. It rides the evening ladder, under exactly the policy the other two follow: the window takes anything below a MAJOR and raises the pin as it goes, writing the whole new version rather than a track the registry would not serve, and a MAJOR waits for a <code>-raise</code>. It is still the component most likely to need attention when Tesla changes something in the car, so its release notes are worth reading when the car stops answering. Telegraf is not one of the runner&rsquo;s components at all &mdash; nothing but a new release ever moves it.</p>\n</div>", "cmds": ["services:", "tesla-ble-http-proxy:", "image: wimaha/tesla-ble-http-proxy:2.3.0", "container_name: tesla-ble-http-proxy", "volumes:", "- /home/USERNAME/TeslaBleHttpProxy/key:/key …written in by the installer…", "- /var/run/dbus:/var/run/dbus", "restart: always", "privileged: true", "network_mode: host", "cap_add:", "- NET_ADMIN", "- SYS_ADMIN", "services:", "influxdb:", "image: influxdb:${INFLUXDB_PIN:-2.9}", "container_name: influxdb", "restart: unless-stopped", "ports:", "- \"8086:8086\"", "volumes:", "- influxdb-data:/var/lib/influxdb2", "- influxdb-config:/etc/influxdb2", "environment:", "- DOCKER_INFLUXDB_INIT_MODE=setup", "- DOCKER_INFLUXDB_INIT_USERNAME=admin", "- DOCKER_INFLUXDB_INIT_PASSWORD=…generated…", "- DOCKER_INFLUXDB_INIT_ORG=home", "- DOCKER_INFLUXDB_INIT_BUCKET=evcc", "- DOCKER_INFLUXDB_INIT_RETENTION=0", "- DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=…generated…", "healthcheck:", "test: [\"CMD\", \"influx\", \"ping\"]", "interval: 10s", "timeout: 5s", "retries: 12", "start_period: 30s", "grafana:", "image: grafana/grafana:${GRAFANA_PIN:-13.2}", "container_name: grafana", "restart: unless-stopped", "ports:", "- \"3000:3000\"", "environment:", "- GF_INSTALL_PLUGINS=lehmannch-flow-panel", "- GF_SECURITY_ADMIN_PASSWORD=…generated…", "volumes:", "- grafana-data:/var/lib/grafana", "depends_on:", "influxdb:", "condition: service_healthy", "volumes:", "influxdb-data:", "driver: local", "driver_opts:", "type: none", "o: bind", "device: /mnt/influxdb/data …written in by the installer…", "influxdb-config:", "driver: local", "driver_opts:", "type: none", "o: bind", "device: /mnt/influxdb/config", "grafana-data:", "docker compose -f ~/monitoring/docker-compose.yml down", "sudo cp -a /mnt/influxdb/. /mnt/newdisk/", "docker volume rm monitoring_influxdb-data monitoring_influxdb-config", "docker compose -f ~/monitoring/docker-compose.yml up -d", "services:", "telegraf:", "image: telegraf:1.35", "container_name: telegraf", "restart: unless-stopped", "network_mode: host", "user: \"telegraf:CHANGE_ME_DOCKER_GID\" …the docker group's numeric id…", "environment:", "- HOST_ETC=/hostfs/etc", "- HOST_PROC=/hostfs/proc", "- HOST_SYS=/hostfs/sys", "- HOST_VAR=/hostfs/var", "- HOST_RUN=/hostfs/run", "- HOST_MOUNT_PREFIX=/hostfs", "volumes:", "- ./telegraf.conf:/etc/telegraf/telegraf.conf:ro", "- /:/hostfs:ro", "- /dev:/dev:ro", "- /run/udev:/run/udev:ro", "- /var/run/docker.sock:/var/run/docker.sock:ro"]}, {"id": "s44", "title": "13.5 · evcc’s own configuration", "html": "<p data-lvl=\"3\">There is no file to read here, which is itself the design. evcc keeps the two meters, the charger, the vehicle and the loadpoint in <b><code>/var/lib/evcc/evcc.db</code></b>, written by the web interface as you fill in the dialogs in <a href=\"#s11\">section 11</a>. The installer does not generate it and does not read it: it describes your house rather than the software, so no release can reproduce it. What it is no longer is unprotected. The 22:30 backup archives it every night as the <code>evcc-db</code> family, proves the copy on the share by fetching it back, and <code>maintenance-backup.py --restore</code> puts it where it belongs &mdash; which is what turns a reinstall from an evening of retyping those dialogs into a run that ends with them already filled in. The pairing key under <code>~/TeslaBleHttpProxy/key/</code> is the other thing this build cannot regenerate, and it rides the same nightly run as an archive of its own.</p>", "cmds": []}]}, {"num": "14", "title": "The dashboard", "steps": [{"id": "s45", "title": "Overview", "html": "<p class=\"lede\">One board, two halves: how the Pi itself is bearing up and whether anything needs updating, then where the power is going and what it did all day.</p>\n\n<p>One Grafana page shows the whole system. The top half is the Pi &mdash; its vitals, what the evening window did, and one line per piece of software saying whether it is current. The bottom half is the charging: the live power flow, the day&rsquo;s energy, and every trace with a time axis stacked at the foot. The installer imports it ready-made.</p>\n\n<p data-lvl=\"2\">The board is generated rather than drawn by hand, and it arrives complete. The two data sources it reads are named inside it by fixed identifier &mdash; <code>influxdb-evcc</code> for the charging bucket, <code>influxdb-system</code> for the Pi&rsquo;s own &mdash; and the installer created both under exactly those identifiers earlier in the run, so there is nothing to pick from a dropdown and nothing to paste. Three things are filled in at import, and only three: the hidden constants the two maintenance buttons read &mdash; the endpoints <code>window-agent</code> answers on, written as the browser reaches the Pi, and the one token the installer minted with this install&rsquo;s other secrets. Everything else goes to Grafana exactly as generated.</p>\n\n<p data-lvl=\"3\">The import is a single POST to <code>/api/dashboards/db</code> with <code>overwrite</code> set, and the overwrite is deliberate: this file is generated from the repository, so the copy Grafana happens to be holding is never the version worth protecting. The polite form was tried and cost a release &mdash; Grafana answered &ldquo;already exists&rdquo;, the installer counted that as success, and the previous board kept its seat on the wall with its buttons POSTing at a port that no longer answered. If the POST fails for any other reason the installer says so and writes the finished file into your home directory: Dashboards &rarr; New &rarr; Import &rarr; Upload JSON file.</p>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Data source. Flux against InfluxDB on the same Pi, bucket-scoped token, 10-second minimum interval. The installer creates it and selects it in the dashboard, so this is a record of the settings rather than a step.</div>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>The board, top to bottom</caption>\n<thead><tr><th scope=\"col\" style=\"width:26%\">Band</th><th scope=\"col\">What it answers</th></tr></thead>\n<tbody>\n<tr><td><b>Right now</b><br><span class=\"small\">the left zone, sixteen of the twenty-four columns</span></td><td>How the Pi itself is bearing up this second: temperature, CPU, memory and both disks as gauges, with the one-minute load beside them as a figure; uptime, the age of the version reading and the age of the voltage reading; the power-supply and throttling tiles &mdash; and under them what the evening window did, which containers are up, and the update half</td></tr>\n<tr><td><b>Right now</b><br><span class=\"small\">the right rail, the other eight, alongside</span></td><td>The same Pi values as history: service availability at the top, then thirteen traces of equal height &mdash; response time, the network pair, temperature, load, then each per-container trace beside its whole-machine twin for CPU and for memory, swap, the two disk traces and the filesystem &mdash; drawn narrow on purpose, because on these the shape is the reading and the number is not</td></tr>\n<tr><td><b>evcc</b><br><span class=\"small\">the second half</span></td><td>Where the power is going this second: the charging-state banner, then the live flow panel with the day&rsquo;s six energy totals beside it and fourteen days of the two that earn a history &mdash; what the panels made and what the car drank. Under them one tile per phase for house voltage, charger voltage and charge current; the session row, which is what the grid is doing, the solar share now and over the session, range added and the car&rsquo;s state of charge; and one full-width tile carrying the BLE proxy&rsquo;s door beside the charging fact</td></tr>\n<tr><td><b>The window</b><br><span class=\"small\">at the foot, full width</span></td><td>Every remaining charging trace with a time axis, stacked in one column so a single moment can be read down all of it: charging state, power, energy, state of charge, voltage, and then the three phases one at a time</td></tr>\n</tbody>\n</table>\n</div>\n\n<p data-lvl=\"2\">The captures below are one board on one afternoon, split where it splits: the live tiles and the charging history above, everything with a time axis below. The window is 24&nbsp;hours, so a full charge and the night either side of it fit on one screen.</p>\n\n<div data-lvl=\"2\" class=\"note blue\">\n  <span class=\"h\">The pictures are of an older board</span>\n  <p>The two stills and the recording predate the update panels&rsquo; move off the foot of the page and onto the Pi&rsquo;s surface &mdash; the caption below still calls the foot of the board the update desk, which is what dates them. The arrangement they show is not the one the table above walks.</p>\n  <p>They are kept because what they show best has not changed &mdash; the live tiles, the traces, the shared crosshair, the shape of a charging afternoon on 24&nbsp;hours of axis. Read the pictures for the panels, and the text around them for the arrangement.</p>\n</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Live, and the day’s charging history. The tiles that move, and the three lanes that say what happened.</div>\n\n<p data-lvl=\"3\">Two things are worth knowing about the live tiles. <b>Only they move</b> &mdash; the whole page re-queries on the 30-second refresh, but everything below them is the whole 24-hour window, and half a minute added to the end of a day changes nothing an eye can catch. And <b>blank is not zero</b>: when nothing is charging the charger tiles do not fall to zero, they say <i>not charging</i>. The charger keeps reporting while idle &mdash; a few tenths of an amp of standby current, and between nought and three volts of residual across the three phases &mdash; so the queries are gated above that noise, at 50&nbsp;V and 0.5&nbsp;A, and the charger&rsquo;s two tiles in a phase column fall away together. A zero would assert a reading nobody took; the voltage and the current disagreeing about whether the car is plugged in would be worse. The house voltage at the top of each column is measured at the feed-in point and never falls away &mdash; it is the one instrument in the column that is not about the car. In the capture above the car is charging on surplus alone, so all three carry volts and amps.</p>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Everything with a time axis — the day behind the tiles, and the update desk at the foot.</div>\n\n<p data-lvl=\"2\">The voltage panel is the one to read. Three phase traces and five reference lines &mdash; the floors at 195.5 and 207&nbsp;V, the ceilings at 241.5 and 253&nbsp;V, and the arrester stamp at 255&nbsp;V. Four of them are 230&nbsp;V nominal read as percentages: minus fifteen and minus ten below, plus five and plus ten above &mdash; and the board&rsquo;s legend now names the 207 and 241.5&nbsp;V pair by that same arithmetic, the 90&nbsp;% floor and the 105&nbsp;% ceiling &mdash; and that top one, 253&nbsp;V, is also where the inverter curtails (<a href=\"#s04\">section 04</a>). The fifth is drawn dotted and grey because it is not a limit anyone regulates to at all &mdash; it is the arrester&rsquo;s U<sub>c</sub> marking, the voltage it can sit at continuously, and it acts at none of these levels. The system is doing its job when the traces stay under the 253&nbsp;V line and nothing had to be disconnected to keep them there.</p>\n\n<p data-lvl=\"3\">The three House Phase tiles higher up carry the same five numbers as colour bands &mdash; green between 207 and 241.5&nbsp;V, amber outside that in either direction, red below 195.5 and at 253 &mdash; so a phase is the same colour in the tile as it is a position on the trace, and the two cannot tell you different things about the same instant.</p>\n\n<p data-lvl=\"3\">A break in a trace is a break in the data. The logger writes every 15&nbsp;seconds, and a silence longer than a minute is drawn as a gap rather than joined up across its own absence &mdash; the half hour missing after 12:30 is the Pi being rebuilt. Nothing was measured there, and the panel says so.</p>\n\n<p data-lvl=\"3\">Under it the same story is told one phase at a time: the current the car is drawing, against the charger&rsquo;s own voltage and against the feed-in voltage. The charger always reads a few volts high, and that difference is the drop across the house wiring &mdash; which is why the regulating decision is taken on the feed-in reading and not on the charger&rsquo;s (<a href=\"#s12\">section 12</a>).</p>\n\n<p data-lvl=\"4\">Every time-series panel shares one cursor, so hovering any of them puts the same marker at the same instant on all the others. It is also why nothing on this board is inside a collapsed row: a collapsed row is a panel the crosshair cannot reach, and the narrow rail of Pi traces exists precisely so that the history it carries could come out of the collapsed row it used to hide in. The charging traces keep the full width in one stack of uniform heights, and their legends are pinned to the same width, so the hour gridlines fall on a single vertical line down the block and the shared marker lands where the eye already is.</p>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> The board, running — fifty-four seconds, top to bottom, on the 30-second refresh.</div>\n\n<p data-lvl=\"4\">The recording is a board rather than a picture of one, and it carries the one thing a still cannot: which parts of the page are alive. The arrangement in it is the older one again, but the thing it is counting has not changed &mdash; the refresh is still 30&nbsp;seconds, and it is still the only clock on the page.</p>", "cmds": []}, {"id": "s46", "title": "The update half", "html": "<p data-lvl=\"3\">At the foot of the Pi&rsquo;s zone the stack answers four questions in order. <b>Vehicle SoC &middot; now</b> stands at its head &mdash; the same tile as the one in the session row further down the board, repeated here so the car&rsquo;s charge is on the surface that is always visible. Under it, <b>BLE proxy</b>: the proxy&rsquo;s HTTP door on the Pi, up or down. That is the owner&rsquo;s ruling on prominence &mdash; it is the command path to the car, and with it down evcc can still see the car but cannot tell it to start, stop or change current, so it is the piece of software whose silence costs the most. The two of them together are &ldquo;where is the car, and can it be reached&rdquo; answered before anything about this Pi. The charge tile&rsquo;s six rows are not free: the region is fixed at thirty-three rows by the lattice, and neither table below could give any up without growing a scrollbar, so the proxy and the panel beneath it dropped from six rows to three to pay for it. They move together on purpose &mdash; the proxy is sized against the headline it stands over, and three rows is the rail&rsquo;s own trace height, so both edges still land on the lattice. Neither loses a reading by it: both say one word. Then the other two questions: am I fine, and what is each component doing. <b>Updates &mdash; am I fine?</b> is a single stat panel that reduces the whole stack to one word on a coloured ground. It takes the last outcome each component recorded and counts the ones that are waiting on a person; nought of them reads <b>Up to date</b> in green, anything from one upward reads <b>Needs you</b> in orange. Nought is the ordinary answer, and a healthy evening leaves the panel green and the rest of this half almost blank &mdash; which is the point of it. Before the first update has ever run it reads <i>no update has run yet</i> rather than a reassuring zero.</p>\n\n<p data-lvl=\"3\">Under it, <b>Software versions &mdash; installed and latest</b> is one line per component, in name order: the six the version logger reads &mdash; evcc, Grafana, InfluxDB, Raspberry&nbsp;Pi&nbsp;OS, solar-surplus itself, and tesla-ble-proxy. <i>Installed</i> is what is on this Pi; the OS row counts pending package upgrades instead of comparing version strings, so it reads <i>0 pending</i> when there is nothing to take, in both columns &mdash; the count is its own comparison. <i>Latest</i> is the version each upstream reports: GitHub&rsquo;s newest release, read every quarter hour; <i>unknown</i> means the lookup had no answer &mdash; network, or the spent hourly budget &mdash; and the runner refuses to upgrade blind on it. <i>State</i> is the word that component&rsquo;s last update run recorded, painted as a coloured cell &mdash; with one exception that outranks the two green words: when the version logger&rsquo;s own verdict says upstream is ahead of this Pi, the row reads <i>Update available</i> in orange until a run takes the update and repaints it. A run that ended well is not the whole truth once a newer release is published, and a green cell beside a visible version mismatch was the last run answering a question nobody asked. A third column once counted the days since a component last actually moved; the owner retired it, and the two questions left are the two the strip is for.</p>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>The words in the State column, and what each one is</caption>\n<thead><tr><th scope=\"col\" style=\"width:26%\">Cell</th><th scope=\"col\">What was recorded, and what it wants from you</th></tr></thead>\n<tbody>\n<tr><td><b>Up to date</b><br><span class=\"small\">green</span></td><td><code>current</code> &mdash; the run looked, found the component already at the newest version its publisher offers, and did nothing. The healthy no-op, and what a quiet night is supposed to look like</td></tr>\n<tr><td><b>Updated</b><br><span class=\"small\">green</span></td><td><code>ok</code> &mdash; the run installed something and it worked. Nothing to do</td></tr>\n<tr><td><b>Update available</b><br><span class=\"small\">orange</span></td><td><code>behind</code> &mdash; the one word in this column the runner never wrote: the version logger&rsquo;s verdict, painted over a green outcome &mdash; or over <i>Not run yet</i> &mdash; when upstream reports a newer release than what is installed. Nothing is asked of you: the evening ladder takes minor updates on its own, and a major will turn this into <i>Needs your yes</i> when its run looks at the pin. Pressing <i>Do the needful</i> takes it now instead of tonight. The words below outrank it &mdash; a run that is asking for a hand is more specific news about the same mismatch</td></tr>\n<tr><td><b>Running now</b><br><span class=\"small\">blue</span></td><td><code>started</code> &mdash; written before the work begins, so a row still saying this long after the window closed is a run that hung or a Pi that rebooted under it</td></tr>\n<tr><td><b>Needs your yes</b><br><span class=\"small\">orange</span></td><td><code>approval</code> &mdash; a major version is waiting. Majors are the one thing this stack asks about, because they are the one change that can alter behaviour you would have to relearn. Answer with <code>sudo systemctl start update-runner@&lt;component&gt;-raise.service</code>, which proves the new track against the registry, raises the pin and takes the update in the same run (<a href=\"#s13\">section 13</a>)</td></tr>\n<tr><td><b>Needs you</b><br><span class=\"small\">orange</span></td><td><code>refused</code> &mdash; a correct outcome rather than a fault, but one only a person can settle: a version that could not be read at one end or the other, so nothing was upgraded blind; or a compose file still carrying an old literal pin, which a converge modernises. A run that arrived while another already held the lock records the same word and needs nothing from you: the next window takes it</td></tr>\n<tr><td><b>Failed</b><br><span class=\"small\">red</span></td><td><code>failed</code> &mdash; the work started and broke. <code>journalctl -u update-runner@&lt;component&gt;.service</code> has the whole run</td></tr>\n<tr><td><b>Not run yet</b><br><span class=\"small\">unpainted</span></td><td>No outcome has ever been recorded for this component &mdash; a fresh install, or one whose first evening window has not come round yet. Named rather than left blank, because a blank cell reads as missing data instead of as a state. Every component is in the ladder, so the blank is temporary</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"3\" class=\"note\">\n  <span class=\"h\">One button, and why it is only one</span>\n  <p>Grafana&rsquo;s table actions fire from the browser rather than from the Grafana server, so any button needs a listener running on the Pi and a shared token written into the dashboard itself &mdash; readable by anyone who can open the board. That is why the per-row Update buttons are gone: nine sudo-adjacent commands behind one LAN door, each pressed on whatever a stale tab happened to show, guarding decisions the nightly window was already making better on the Pi. What came back is deliberately smaller. TWO buttons, at the top of the left column, directly above the Tonight log their presses feed. <i>Do the needful</i> starts the whole evening window &mdash; backup, ladder, guarded reboot, one ordered run &mdash; and decides nothing from what is on screen: the press means &ldquo;run tonight now&rdquo;, every gate on the Pi still asks its own question when the window reaches it, and the listener refuses the press while a window is already running. <i>Clear log</i>, beside it, starts the Tonight view afresh from one marker point &mdash; the history stays in the bucket, nothing deleted. Both presses confirm first, and each dialog says its consequence out loud &mdash; the reboot lands within the hour, a charging session is briefly interrupted and resumes; the cleared rows are hidden, never erased. The token still guards against stray LAN requests, not against people, and the sudoers lines behind the door grant exactly two commands: start the window, write the marker. The decisions still belong where the truth is, on the Pi.</p>\n  <p>An update out of turn is therefore a unit started over SSH: <code>sudo systemctl start update-runner@evcc.service</code> (<a href=\"#s16\">section 16</a>). The runner re-probes before it acts, so starting one that has nothing to do costs an <i>Up to date</i> row and nothing else.</p>\n</div>\n\n<p data-lvl=\"4\">Neither panel is bound to the time picker, and that is on purpose: what is installed on this Pi must not change because you zoomed to an hour of yesterday. The strip reads the newest point per component out of thirty days of version readings and ninety days of outcomes; the headline reads the same ninety days. The two measurements are also tagged differently &mdash; the version logger writes the display name <i>raspberry pi os</i>, the runner writes the slug <code>raspberry-pi-os</code> &mdash; so the query folds spaces to hyphens before the four streams &mdash; installed, latest, the logger&rsquo;s verdict, the runner&rsquo;s outcome &mdash; are stacked and pivoted into one row, or the operating system would arrive as two components that never meet.</p>\n\n<p data-lvl=\"3\">The freshness of all this is a panel of its own, up in the trio under the gauges. <b>Versions last checked</b> says how long ago the version reading last succeeded, in words rather than in hours, because &ldquo;3 hours 50 minutes ago&rdquo; reads as a fact where a fractional hour reads as a quantity to be compared. Green below 25 hours, amber to 48, red beyond, and an empty tile reads <i>never</i>, in red rather than green, because a check that has never succeeded is not an all-clear. The canonical reading rides the boot report at the end of the evening window and every update outcome repaints it on its way out, so a stale tile means the whole evening did not happen.</p>\n\n<div data-lvl=\"4\" class=\"warn\"><b>Value-mapping patterns need their slashes.</b>\nThat tile&rsquo;s value is a sentence rather than a number, so its colour comes from regex value mappings rather than from thresholds &mdash; and Grafana wraps a pattern not written in <code>/&hellip;/</code> form as <code>^pattern$</code>, a whole-string match. A partial regex written bare therefore matches nothing, the colour falls through to the panel&rsquo;s threshold, and the tile reads red for every value of an hour or more &mdash; which is the entire normal life of a reading taken once a night.</div>", "cmds": []}]}, {"num": "15", "title": "Verification", "steps": [{"id": "s47", "title": "Overview", "html": "<p class=\"lede\">The installer checks its own work as it goes. These are the three checks it cannot make for you, and they are the ones that decide whether the installation is trustworthy or merely green.</p>\n\n<p>Three checks decide whether to trust it: the numbers agree with the inverter, the grid meter&rsquo;s sign is right, and everything comes back on its own after a reboot.</p>", "cmds": []}, {"id": "s48", "title": "The one that must not be skipped: cross-check every site figure", "html": "<p data-lvl=\"2\">With the car charging, sample the inverter and evcc in one command. Solar mode decides when to charge by watching grid export, so this is what proves the whole metering chain before the charging policy is trusted.</p>\n\n<div data-lvl=\"2\" class=\"cmd\">\n<div class=\"lbl\"><span>Shell</span><span class=\"path\">on the Raspberry Pi</span></div>\n<pre>{ curl -s \"http://INVERTER_IP/solar_api/v1/GetPowerFlowRealtimeData.fcgi\" \\\n    | jq -c '.Body.Data.Site|{P_PV,P_Grid,P_Load}';\n  curl -s http://localhost:7070/api/state \\\n    | jq -c '{grid:.grid.power, pvPower, homePower, charge:[.loadpoints[].chargePower]}'; }</pre>\n</div>\n\n<div data-lvl=\"2\" class=\"pass\"><b>Pass ·</b> PV agrees within a few per cent, grid agrees in sign, and <code>homePower ≈ P_Load − charge</code>.</div>", "cmds": ["{ curl -s \"http://INVERTER_IP/solar_api/v1/GetPowerFlowRealtimeData.fcgi\" | jq -c '.Body.Data.Site|{P_PV,P_Grid,P_Load}';", "curl -s http://localhost:7070/api/state | jq -c '{grid:.grid.power, pvPower, homePower, charge:[.loadpoints[].chargePower]}'; }"]}, {"id": "s49", "title": "Meter sign", "html": "<p data-lvl=\"2\">Switch on a large load — a kettle or an oven — and watch the grid figure.</p>\n\n<div data-lvl=\"2\" class=\"pass\"><b>Pass ·</b> grid import increases. If it drops, the sign is inverted and the system would charge at exactly the wrong times.</div>", "cmds": []}, {"id": "s50", "title": "The reboot test", "html": "<p data-lvl=\"3\">The step that proves a power cut needs no human. It exercises the <code>After=docker.service</code> ordering, the <code>bt-unblock</code> unit and the <code>/etc/fstab</code> line for the history disk, all for real. The disk is the reason to take this one seriously rather than assume it: a USB drive that mounts when you mount it by hand and does not mount at boot is a common enough failure, and the symptom is InfluxDB refusing to start rather than anything obviously about a disk.</p>\n\n<p data-lvl=\"3\">You are not the only one who runs this test. The evening window&rsquo;s reboot leg takes the same path every night, and rehearsing the cold boot is the whole reason that reboot exists: a power cut is this path taken unrehearsed, and the only difference is who chose the moment. On the far side of it <code>maintenance-report.service</code> starts, waits up to ten minutes for four ports to answer &mdash; evcc on 7070, Grafana on 3000, InfluxDB on 8086, the BLE proxy on 8080 &mdash; and writes a single <code>maintenance,phase=boot</code> point naming what answered, what did not, and how many seconds after boot the stack was ready. InfluxDB is judged on <code>/health</code> returning 200 rather than on 8086 merely accepting a connection, because a cold InfluxDB opens its port well before it can answer anything. The report&rsquo;s last act is to start <code>version-logger.service</code>, which is why the daily reading is taken by a system that has finished booting rather than one racing containers. Running the test once by hand is the only part of it that is yours &mdash; do that at the keyboard, while you are still standing next to the disk you have just plugged in.</p>\n\n<div data-lvl=\"2\" class=\"cmd\">\n<div class=\"lbl\"><span>after <code>sudo reboot</code></span></div>\n<pre>findmnt /mnt/influxdb\nsystemctl is-active evcc grid-voltage-logger pi-throttled\ndocker ps --format '{{.Names}}\\t{{.Status}}'\njournalctl -u maintenance-report.service -b --no-pager\njournalctl -u grid-voltage-logger -n 20\nrfkill list</pre>\n</div>\n\n<div data-lvl=\"2\" class=\"pass\"><b>Pass ·</b> the disk mounted from its own device as <code>ext4</code>, three units active, all four containers up, the boot report saying <code>all four ports answered</code>, the logger writing, Bluetooth unblocked and Wi-Fi still blocked.</div>\n\n<div data-lvl=\"3\" class=\"note\"><b>Three units, and only three.</b> <code>evcc</code>, <code>grid-voltage-logger</code> and <code>pi-throttled</code> are the long-running services this system starts at boot; everything else it owns is a container, a timer, a one-shot, or the mount systemd generates from the <code>/etc/fstab</code> line. <code>bt-unblock</code> and <code>maintenance-report</code> are one-shots, so once their work is done <code>systemctl is-active</code> calls them <code>inactive</code> &mdash; which is success, not failure. That is why neither belongs on that line, and why each is proved by its own evidence instead: <code>rfkill list</code> for the radio, the journal for the report. <code>version-logger.service</code> is a one-shot too &mdash; its <code>[Install]</code> lives on <code>version-logger.timer</code>, which fires it hourly &mdash; so finding the service inactive says nothing either; it is the TIMER you ask about.</div>\n\n<div data-lvl=\"3\" class=\"note red\"><b>If <code>findmnt</code> prints nothing</b> and <code>docker ps -a</code> shows <code>influxdb</code> exited, read <code>docker logs influxdb</code> and expect a message naming <code>/mnt/influxdb/data</code>. That is the guard in <a href=\"#s13\">section 13</a> doing exactly what it is for, and the disk is the thing to fix &mdash; <code>journalctl -b -u mnt-influxdb.mount</code> says why it did not mount, and <code>lsblk -o NAME,SIZE,LABEL,MOUNTPOINTS</code> says whether the kernel saw the disk at all. Once the mount is back, <code>docker compose -f ~/monitoring/docker-compose.yml up -d</code> brings InfluxDB up again — a container that could not be created is not a container Docker&rsquo;s restart policy will retry. Do not work around it by creating <code>/mnt/influxdb/data</code> by hand: that is the card, and InfluxDB will start on it and never tell you.</div>", "cmds": ["findmnt /mnt/influxdb", "systemctl is-active evcc grid-voltage-logger pi-throttled", "docker ps --format '{{.Names}}\\t{{.Status}}'", "journalctl -u maintenance-report.service -b --no-pager", "journalctl -u grid-voltage-logger -n 20", "rfkill list"]}, {"id": "s51", "title": "The rest, as a checklist", "html": "<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Verification checklist</caption>\n<thead><tr><th scope=\"col\" style=\"width:24%\">Check</th><th scope=\"col\" style=\"width:34%\">Command</th><th scope=\"col\">Pass</th></tr></thead>\n<tbody>\n<tr><td>One network path</td><td><code>ip -4 -br addr</code></td><td>Exactly one interface with an address, and it is <code>eth0</code></td></tr>\n<tr><td>Inverter reads the grid</td><td><code>…/GetPowerFlowRealtimeData.fcgi</code></td><td><code>Meter_Location</code> is <code>\"grid\"</code>, <code>P_Load</code> non-zero with the house awake</td></tr>\n<tr><td>Live sockets</td><td><code>sudo ss -tnp | grep -i evcc</code></td><td>Established connections to the inverter, the Wall Connector and the proxy — not just green icons</td></tr>\n<tr><td>The update path, end to end</td><td><code>sudo systemctl start update-runner@tesla-ble-proxy.service</code>, then <code>journalctl -u update-runner@tesla-ble-proxy.service -n 30</code></td><td>One start exercises the template unit, both environment files, the runner&rsquo;s lock, the version probes and the pin gate &mdash; with no HTTP door anywhere in the path. On a proxy already at the newest upstream version the journal reads <code>current</code> and the run stops at the version probe: a healthy answer, and a shorter proof. On one that is behind, the gate proves the tag is served, writes the whole new version into <code>BLE_PIN</code> in the <code>.env</code> beside the compose file, mirrors it into <code>/etc/solar-surplus/pins</code>, pulls, and the journal ends <code>ok</code>. Either way the outcome is recorded like any other and the proxy&rsquo;s row on the board follows it &mdash; that is the check&rsquo;s own footprint rather than a fault</td></tr>\n<tr><td>Logger writing</td><td><code>journalctl -u grid-voltage-logger -f</code></td><td>Silence after “Started”</td></tr>\n<tr><td>Grafana queries</td><td>panel → query inspector</td><td>A frame with rows in it — not an empty result, and not an error</td></tr>\n</tbody>\n</table>\n</div>", "cmds": []}]}, {"num": "16", "title": "Day-to-day operation", "steps": [{"id": "s52", "title": "Day-to-day operation", "html": "<p>On a clear day it needs nothing from you: the car starts on its own mid-morning, follows the sun, and stops when the surplus is gone. The table is what that looks like; the commands are for when you are curious.</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>A clear summer day</caption>\n<thead><tr><th scope=\"col\" style=\"width:24%\">Moment</th><th scope=\"col\">What happens</th></tr></thead>\n<tbody>\n<tr><td>Early morning</td><td>Nothing. Surplus is below 720&nbsp;W, so Solar mode holds off.</td></tr>\n<tr><td>Mid-morning</td><td>Surplus passes the minimum for a full minute and the session starts, at 1–3&nbsp;A.</td></tr>\n<tr><td>Around solar noon</td><td>evcc modulates up to whatever the surplus supports — 3 to 6&nbsp;A with the house busy. The grid tile falls to within a few tens of watts of zero, and the feed-in voltage stops climbing.</td></tr>\n<tr><td>Passing cloud</td><td>Current drops rather than the session ending — the 10-minute disable delay rides it out.</td></tr>\n<tr><td>Late afternoon</td><td>Current tapers with the sun. Charging continues down to 1&nbsp;A.</td></tr>\n<tr><td>Evening</td><td>Surplus stays below the minimum for ten minutes and the session ends. The timeline goes grey.</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"2\" class=\"cmd\">\n<div class=\"lbl\"><span>Useful commands</span></div>\n<pre>journalctl -u grid-voltage-logger -f       <span class=\"c\"># the voltage stream, live</span>\njournalctl -u evcc -n 100 --no-pager       <span class=\"c\"># recent evcc errors</span>\ndocker logs -f tesla-ble-http-proxy        <span class=\"c\"># traffic to the car</span>\ndocker ps                                  <span class=\"c\"># all four containers up</span>\ndf -h /mnt/influxdb                        <span class=\"c\"># the history disk, still mounted and not full</span>\ncurl -s localhost:7070/api/state | jq .    <span class=\"c\"># everything evcc believes</span>\nsystemctl list-timers 'maintenance-*'      <span class=\"c\"># when the window next fires, and when it last did</span>\njournalctl -u 'maintenance-*' -n 200       <span class=\"c\"># tonight&rsquo;s window so far</span>\njournalctl -u 'update-runner@*' -n 100     <span class=\"c\"># every gate, in the runner&rsquo;s own words</span>\nsystemctl list-units 'update-runner@*'     <span class=\"c\"># an update still running</span>\nsudo cat /etc/solar-surplus/install.conf   <span class=\"c\"># every answer and generated secret</span></pre>\n</div>\n\n<p data-lvl=\"3\">Updates are no longer a button, and mostly not a decision either. The evening window does them by itself, one 22:30 timer starting the whole ordered run: the backup, then the ladder &mdash; <code>solar-surplus</code> first, so a new release&rsquo;s pins govern the rest of the night, then <code>evcc</code>, <code>grafana</code>, <code>influxdb</code>, and the OS last because it is the one that can want a reboot &mdash; then the guarded reboot and the boot report on the far side of it, the whole of it finished and on the board before you are asleep. By hand it is one component at a time: <code>sudo systemctl start update-runner@evcc.service</code>, which is the form to reach for the first few times, because the journal shows every gate as it is passed. Exactly one thing waits for you, and it is a MAJOR version of a component whose tag is pinned in a compose file &mdash; Grafana and InfluxDB, the only two the runner has a pin to gate: the runner records <code>approval</code>, the board reads &ldquo;Needs your yes&rdquo;, and your yes is starting the raise instance &mdash; <code>sudo systemctl start update-runner@grafana-raise.service</code> &mdash; which proves the registry really serves the new track, writes the raised pin down where a reinstall will find it again, and takes the update in the same run. Everything else is taken without being asked about, a major of evcc or of the OS included, because they arrive through apt and there is no pin standing in front of them; that is what update by default means, and the gates that decide all of it are in <a href=\"#s13\">section 13</a>. The BLE proxy rides the same ladder as the rest; what is different is its pin&rsquo;s shape &mdash; Docker Hub serves that image at whole <code>x.y.z</code> tags only, so <code>BLE_PIN</code> is exact and the runner moves the whole version as it takes anything below a major, while a major waits for <code>update-runner@tesla-ble-proxy-raise.service</code> like the other pinned two. Starting <code>update-runner@tesla-ble-proxy.service</code> by hand is still how you ask it what it thinks between windows, and on a healthy night the journal answers <code>current</code> &mdash; the check <a href=\"#s15\">section 15</a> uses.</p>", "cmds": ["journalctl -u grid-voltage-logger -f", "journalctl -u evcc -n 100 --no-pager", "docker logs -f tesla-ble-http-proxy", "docker ps", "df -h /mnt/influxdb", "curl -s localhost:7070/api/state | jq .", "systemctl list-timers 'maintenance-*'", "journalctl -u 'maintenance-*' -n 200", "journalctl -u 'update-runner@*' -n 100", "systemctl list-units 'update-runner@*'", "sudo cat /etc/solar-surplus/install.conf"]}]}, {"num": "17", "title": "Reference", "steps": [{"id": "s53", "title": "Overview", "html": "<p>The tables, and the safety net: what runs on boot and what its healthy state actually looks like, what the nightly backup saves and in what order a restore brings it back &mdash; the three verbs of <code>maintenance-backup.py</code>, which <code>backup.py</code> and <code>restore.py</code> retired into &mdash; where every file lives and which of the two roads put it there, and the address worksheet to fill in.</p>", "cmds": []}, {"id": "s54", "title": "What runs, and what healthy looks like", "html": "<p data-lvl=\"2\">Thirteen units ship with this release, and dpkg places every one of them in <code>/usr/lib/systemd/system/</code> &mdash; the vendor directory, so <code>/etc/systemd/system</code> stays yours to override with and nothing the release ships can collide with something you wrote. They come in three shapes, and only the first is what most people picture when they hear &ldquo;service&rdquo;. A <em>daemon</em> runs from boot to shutdown and is healthy while it reads <code>active (running)</code>. A <em>timer</em> sits <code>active (waiting)</code> with a next elapse and does nothing else. A <em>oneshot</em> runs, finishes, and returns to <code>inactive (dead)</code> &mdash; and that is the one to read correctly, because on screen it looks exactly like a service that failed to start. It is not. It is what a finished job looks like, and <code>systemctl status</code> prints <code>status=0/SUCCESS</code> and the time it last ran directly beneath it. Judge a oneshot by its last run, never by whether it is running now.</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Units, containers and their healthy states</caption>\n<thead><tr><th scope=\"col\" style=\"width:32%\">Unit</th><th scope=\"col\">What it does</th><th scope=\"col\" style=\"width:22%\">Healthy state</th></tr></thead>\n<tbody>\n<tr><td><code>evcc</code></td><td>Energy management. evcc&rsquo;s own package, not this release&rsquo;s; the installer&rsquo;s <code>services</code> step enables and starts it</td><td>active (running)</td></tr>\n<tr><td><code>grid-voltage-logger</code></td><td>The three Smart Meter phase voltages, read from the inverter&rsquo;s Solar API every 15&nbsp;s and written to InfluxDB as measurement <code>gridVoltage</code></td><td>active (running)</td></tr>\n<tr><td><code>pi-throttled</code></td><td>The firmware&rsquo;s throttle word into bucket <code>system</code> every 30&nbsp;s &mdash; under-voltage and thermal throttling, now and since boot. A host service, because no container reaches the firmware mailbox</td><td>active (running)</td></tr>\n<tr><td><code>bt-unblock</code></td><td>One <code>rfkill unblock bluetooth</code>, ordered <code>Before=bluetooth.service</code> so the radio is free before anything wants it</td><td>inactive (dead) &mdash; it ran at boot and finished</td></tr>\n<tr><td><code>maintenance-window.timer</code></td><td>Fires the whole evening window at 22:30, <code>Persistent=true</code> &mdash; the one schedule since v2.38, starting the same unit the board&rsquo;s button starts</td><td>active (waiting)</td></tr>\n<tr><td><code>maintenance-backup.service</code></td><td>The window&rsquo;s first leg: five archives staged, pushed to the Samba share and proven. No <code>[Install]</code> section &mdash; the window queues it, or you do</td><td>inactive (dead) between runs</td></tr>\n<tr><td><code>maintenance-update.service</code></td><td>The window&rsquo;s ladder: six runner instances in a fixed order, holding the maintenance lock for the whole ladder</td><td>inactive (dead) between runs</td></tr>\n<tr><td><code>maintenance-reboot.service</code></td><td>The window&rsquo;s reboot, held behind both locks, and deferring itself inside the first quarter hour of a boot</td><td>inactive (dead) between runs</td></tr>\n<tr><td><code>maintenance-report.service</code></td><td>Once per boot: waits up to ten minutes for the four ports, writes the <code>maintenance,phase=boot</code> point naming what answered and what did not, then takes the day&rsquo;s version reading</td><td>inactive (dead) &mdash; it ran at boot and finished</td></tr>\n<tr><td><code>version-logger.service</code></td><td>Installed against released for the five components, plus the OS&rsquo;s pending-upgrade count. Triggered, never scheduled: the boot report starts it once the booted stack can answer, and the update runner starts it again after every outcome</td><td>inactive (dead) between triggers</td></tr>\n<tr><td><code>update-runner@.service</code></td><td>A template, one instance per component &mdash; <code>update-runner@evcc.service</code> and five siblings, plus a <code>-raise</code> instance for each of the three components with a compose pin &mdash; the monitoring pair&rsquo;s tracks and the proxy&rsquo;s exact tag. Nothing enables it; the ladder starts an instance, or you do</td><td>inactive (dead) &mdash; no instance at boot</td></tr>\n<tr><td><code>window-agent.service</code></td><td>The button&rsquo;s door: unprivileged listener on 9101, two routes, two sudoers lines. Refuses the press while a window is running, and refuses to serve at all on a placeholder token</td><td>active (running)</td></tr>\n<tr><td><code>maintenance-window.service</code></td><td>The whole evening window: backup, ladder, guarded reboot queued in one ordered run. No <code>[Install]</code> on the service &mdash; the 22:30 timer fires it nightly, the button starts it on demand, or you do</td><td>inactive (dead) between windows</td></tr>\n<tr><td><code>maintenance-clearlog.service</code></td><td>The Clear-log press: one marker point through the grid-voltage-logger token, and the Tonight view starts afresh &mdash; nothing deleted. No <code>[Install]</code> &mdash; the button starts it, or you do</td><td>inactive (dead) between presses</td></tr><tr><td><code>mnt-influxdb.mount</code></td><td>The USB disk the history is on. systemd generates this unit from the <code>/etc/fstab</code> line &mdash; there is no file for it, and its name is the mount point with the slashes turned into dashes</td><td>active (mounted)</td></tr>\n<tr><td>docker → <code>influxdb</code></td><td>Stores the history</td><td>Up (healthy)</td></tr>\n<tr><td>docker → <code>grafana</code></td><td>Draws the board</td><td>Up</td></tr>\n<tr><td>docker → <code>telegraf</code></td><td>The Pi&rsquo;s own vitals into bucket <code>system</code></td><td>Up</td></tr>\n<tr><td>docker → <code>tesla-ble-http-proxy</code></td><td>Commands to the car over Bluetooth</td><td>Up</td></tr>\n</tbody>\n</table>\n</div>", "cmds": []}, {"id": "s55", "title": "Files and paths — and what to back up", "html": "<p data-lvl=\"3\">These fifty-two items rebuild the system on a fresh card. Forty-six are marked <span class=\"tag\">custom</span> &mdash; this release owns them &mdash; and they arrive by two roads that never cross. The deb places the <em>code</em>: the tree under <code>/usr/lib/solar-surplus/</code> and the seventeen units in <code>/usr/lib/systemd/system/</code>. Then <code>install.py</code> renders the <em>configuration</em>, filling this install&rsquo;s answers and freshly minted tokens into templates that ride in that same tree. The package and the configurator never write the same path, and that is the whole reason an upgrade is safe: neither can undo the other&rsquo;s work, and a converge over a live system rewrites configuration without ever touching code. Two of the forty-four arrive by neither road: <code>/etc/solar-surplus/pins</code> and the <code>.env</code> beside the monitoring compose are written by the update runner on the night you raise a major, and the configurator only carries them forward. Nothing is installed to <code>/usr/local/bin</code>, and nothing reaches the Pi by hand. <a href=\"#s13\">Section 13</a> shows the shipped files themselves.</p>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Files, modes and contents &mdash; <code>files/&hellip;</code> is <code>/usr/lib/solar-surplus/files/&hellip;</code>, and the bare unit names are <code>/usr/lib/systemd/system/&hellip;</code></caption>\n<thead><tr><th scope=\"col\" style=\"width:40%\">Path</th><th scope=\"col\" style=\"width:16%\">Mode</th><th scope=\"col\">Contains</th></tr></thead>\n<tbody>\n<tr><td><span class=\"tag\">custom</span> <code>/usr/lib/solar-surplus/install.py</code></td><td>755 root:root</td><td>The configurator: seventeen steps, eight questions, every generated secret. It stays on the Pi, because every converge, every <code>--only</code> repair and every release upgrade starts here</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/usr/lib/solar-surplus/selftest.py</code></td><td>755 root:root</td><td>The release&rsquo;s own 427 checks, read against the files beside it rather than against a description of them. <code>get.py</code> runs it inside a scratch copy of the deb before <code>apt</code> is allowed near the system, and you can run it any time: it starts no unit and makes no network call</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/grid-voltage-logger.sh</code></td><td>755 root:root</td><td>Reads the three phase voltages from the Solar API every <code>INTERVAL</code> seconds and writes them to InfluxDB. Logic only &mdash; every address and the token come from the environment file below</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/version-logger.sh</code></td><td>755 root:root</td><td>Installed against released for evcc, Grafana, InfluxDB, the BLE proxy and the stack itself, plus the OS&rsquo;s pending-upgrade count. Sourced with <code>VERSION_LOGGER_LIB=1</code> it is also the probe library the update runner re-reads versions with, so the two files can never disagree about what is installed</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/update-runner.sh</code></td><td>755 root:root</td><td>Updates ONE component and records the outcome as one of six words. It raises a pin past a minor by itself and waits for you on a major. Logic only, no secrets</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/maintenance-update.sh</code></td><td>755 root:root</td><td>The window&rsquo;s ladder: the six runner instances started in a fixed order and waited on one at a time. It supplies order only &mdash; the serialising lock belongs to the runner, and this script must never touch it</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/maintenance-reboot.sh</code></td><td>755 root:root</td><td>The window&rsquo;s reboot, behind the maintenance lock and the runner&rsquo;s lock, deferring itself if the machine booted minutes ago. Taken or deferred, the outcome is one <code>maintenance,phase=reboot</code> point</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/maintenance-report.sh</code></td><td>755 root:root</td><td>The boot report: waits for evcc, Grafana, InfluxDB and the BLE proxy to answer, writes one <code>maintenance,phase=boot</code> point with what answered and how many seconds it took, then starts the version logger</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/maintenance-window.sh</code></td><td>755 root:root</td><td>The whole window on demand: queues the backup, the ladder and the reboot in one <code>systemctl</code> run and lets the <code>After=</code> edges order them. Holds no lock and adds no guard &mdash; the legs guard themselves</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/maintenance-clearlog.sh</code></td><td>755 root:root</td><td>The Clear-log press&rsquo;s one act: writes the <code>maintenance,phase=clear</code> marker point through the grid-voltage-logger token. Tonight&rsquo;s view starts afresh at the last marker; every earlier row stays in the bucket</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/window-agent.py</code></td><td>644 root:root</td><td>The buttons&rsquo; door: checks the token in constant time; the window route refuses while a window is running and starts <code>maintenance-window.service</code>, the clear route starts <code>maintenance-clearlog.service</code>, each through its own sudoers line. Standard library only, runs as <code>updatesvc</code></td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/maintenance-backup.py</code></td><td>644 root:root</td><td>Backup and restore in one file, three verbs: the nightly run, <code>--fetch</code> and <code>--restore</code>. 644 and not 755 on purpose &mdash; its unit runs <code>python3 &lt;path&gt;</code>, so nothing here needs an execute bit it could be started by accident with</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/pi-throttled.sh</code></td><td>755 root:root</td><td>Reads the firmware&rsquo;s throttle word (sysfs where it still exists, <code>vcgencmd</code> otherwise) and writes <code>pi_throttled</code> to bucket <code>system</code> &mdash; a host service, because the 6.x kernels keep the word behind the firmware mailbox, which no container reaches</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>files/solar-surplus-dashboard.json</code></td><td>644 root:root</td><td>Sixty-eight panels, one board: the Pi&rsquo;s vitals and the maintenance block down the left, every timeframed trace in a right-hand rail, the evcc content full width below. Imported through Grafana&rsquo;s API at a fixed UID with <code>overwrite</code>, so the repo is always the board&rsquo;s authority; written to the login&rsquo;s home directory at 600 only if that import fails</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>bt-unblock.service</code></td><td>644 root:root</td><td>One-shot <code>rfkill unblock bluetooth</code>, ordered before <code>bluetooth.service</code></td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>grid-voltage-logger.service</code></td><td>644 root:root</td><td><code>EnvironmentFile</code>, <code>After=docker.service evcc.service</code>, <code>Restart=always</code>, and the hardening the loggers share. No <code>RestrictAddressFamilies</code>, on purpose: curl&rsquo;s resolver needs <code>AF_NETLINK</code></td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>pi-throttled.service</code></td><td>644 root:root</td><td>The throttle collector, cut from the same cloth &mdash; but with the default device policy left alone, because <code>vcgencmd</code> reaches the firmware through <code>/dev/vchiq</code></td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>version-logger.service</code></td><td>644 root:root</td><td>One-shot, <code>ProtectSystem=full</code>. No <code>[Install]</code> section: the timer beside it carries the schedule, so it is never boot-started</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>version-logger.timer</code></td><td>644 root:root</td><td><code>OnCalendar=*-*-* *:10/15:00</code> &mdash; the quarter-hour version reading, at ten past and every fifteen minutes from it. Not <code>Persistent</code>: a Pi back from a power cut must not fire a missed reading into a stack that is still starting</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>update-runner@.service</code></td><td>644 root:root</td><td>Template, one instance per component. Not enabled &mdash; the ladder starts an instance, or you do. <code>Nice=10</code> and idle I/O keep <code>apt</code> out of the charge loop&rsquo;s way; the two-hour ceiling exists so a slow full-upgrade is never killed mid-dpkg</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>maintenance-backup.service</code></td><td>644 root:root</td><td>The window&rsquo;s first leg. Ninety minutes allowed, because the proven push pays for the history archive twice over the LAN. No <code>ProtectHome</code> &mdash; it stops and starts compose stacks under <code>/home</code></td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>maintenance-window.timer</code></td><td>644 root:root</td><td><code>OnCalendar=*-*-* 22:30:00</code>, <code>Persistent=true</code>, no randomised delay &mdash; the evening&rsquo;s one schedule, and <code>Persistent</code> on it means a Pi that slept through the evening takes its missed window shortly after its next boot, guards and all</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>maintenance-update.service</code></td><td>644 root:root</td><td>The window&rsquo;s ladder, ordered <code>After=maintenance-backup.service</code> &mdash; the edge that holds it behind the backup in every window</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>maintenance-reboot.service</code></td><td>644 root:root</td><td>The window&rsquo;s reboot, ordered after both the backup and the ladder</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>maintenance-report.service</code></td><td>644 root:root</td><td>The only maintenance SERVICE with an <code>[Install]</code> section &mdash; both timers have theirs too, pointed at <code>timers.target</code>, which is how they come to be enabled at all: <code>WantedBy=multi-user.target</code>, so this one runs once on every boot</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>maintenance-window.service</code></td><td>644 root:root</td><td>The window&rsquo;s unit: oneshot, no <code>[Install]</code> of its own &mdash; the timer beside it carries the enablement &mdash; and a ceiling that covers the three legs&rsquo; own</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>maintenance-clearlog.service</code></td><td>644 root:root</td><td>The Clear-log unit: oneshot as root over the logger&rsquo;s env file, so the InfluxDB token never reaches <code>updatesvc</code>. No <code>[Install]</code> &mdash; the button starts it, blocking, and a 200 means the marker landed</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>window-agent.service</code></td><td>644 root:root</td><td>The door&rsquo;s unit: <code>User=updatesvc</code>, the field-proven hardening set with the two carve-outs sudo needs, and exit 78 excluded from restart so a bad token stops once</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/etc/default/grid-voltage-logger</code></td><td>600 root:root</td><td>Addresses, org, bucket, interval and the bucket token &mdash; read by BOTH loggers, so the token is stored once. The reports, the reboot and the update runner take their InfluxDB credentials from here too</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/etc/default/pi-throttled</code></td><td>600 root:root</td><td>The throttle collector&rsquo;s settings, pointed at <code>localhost</code> on purpose. It carries the telegraf write token, which is why it is 600</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/etc/default/update-runner</code></td><td>600 root:root</td><td>Now only <code>MONITORING_DIR</code> and <code>BLE_DIR</code>, the two compose paths &mdash; absolute, because root&rsquo;s <code>~</code> is <code>/root</code> and not yours. The charge guard and <code>EVCC_URL</code> are gone, with the policy that needed them</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/etc/default/maintenance-backup</code></td><td>600 root:root</td><td>The share &mdash; host, share name, account, password and the subdirectory the archives land in &mdash; the two rotation numbers, and <code>STAGING_DIR</code>. The password&rsquo;s one copy outside <code>install.conf</code> and the KeePass file</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/etc/default/window-agent</code></td><td>640 root:updatesvc</td><td>The board buttons&rsquo; token, the origin allow-list and the socket. Group-readable by <code>updatesvc</code> alone; rendered from the template and the answers, so a hand edit here is rewritten by the next converge</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/etc/sudoers.d/window-agent</code></td><td>440 root:root</td><td>TWO grants: <code>updatesvc</code> may run <code>systemctl start --no-block maintenance-window.service</code> and <code>systemctl start maintenance-clearlog.service</code>, and nothing else. Placed by dpkg and NOT a conffile, so removing the package takes the grant with it</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/etc/solar-surplus/install.conf</code></td><td>600 root:root</td><td>Your eight answers and every generated secret, in a directory at mode 700. Read on every re-run; delete a line to be asked that one question again, at a keyboard</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/etc/solar-surplus/pins</code></td><td>644 root:root</td><td>Only after you have raised one: the owner&rsquo;s recorded yes to a major. An <code>update-runner@&lt;component&gt;-raise</code> run writes the track into <code>~/monitoring/.env</code> first, where compose reads it, and mirrors it here second. It rides the answers archive, which is what makes a raise survive a reinstall</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>/etc/solar-surplus/release</code></td><td>644 root:root</td><td>One line: the release that finished CONVERGING, not the one dpkg unpacked. Written near the end of a full run, after the last thing that can fail, and never by an <code>--only</code> repair; read by the version logger for the <code>solar-surplus</code> row &mdash; and deliberately excluded from every archive, because a restored copy would time-travel that row</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>~/monitoring/docker-compose.yml</code></td><td>600 USERNAME</td><td>InfluxDB 2.9 and Grafana 13.2, both pinned to a MAJOR.MINOR track through a variable a raise can move. It holds the admin credentials, which is why it is 600</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>~/monitoring/.env</code></td><td>644 USERNAME</td><td>Where compose interpolates those two pins from. A raise writes here first; <code>install.py</code> merges <code>/etc/solar-surplus/pins</code> into it on every run &mdash; merge, never overwrite: any other line in that file is yours</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>~/telegraf/docker-compose.yml</code></td><td>600 USERNAME</td><td>Telegraf 1.35, a literal tag rather than the movable variable pin its two neighbours carry, on the host network with <code>/</code> and the docker socket mounted read-only. It holds the docker group id, nothing secret; 600 for symmetry with its neighbours</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>~/telegraf/telegraf.conf</code></td><td>640 USERNAME:docker</td><td>What Telegraf collects and where it writes: the Pi&rsquo;s vitals into bucket <code>system</code>, 90 days. It carries the write token; group-read is what lets the container&rsquo;s telegraf user open its own config</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>~/TeslaBleHttpProxy/docker-compose.yml</code></td><td>644 USERNAME</td><td>The BLE proxy, <code>network_mode: host</code>, image pinned to <code>2.3.0</code> exactly &mdash; the only pin written down to the patch, and the reason the runner always refuses to move it for you</td></tr>\n<tr><td><span class=\"tag\">custom</span> <code>~/solar-surplus-secrets-v&lt;release&gt;.xml</code></td><td>600 USERNAME</td><td>Every generated secret as a KeePass 2.x import file &mdash; one entry each with URL and notes, the Samba account among them. <code>scp</code> it off, import it, then delete both copies</td></tr>\n<tr><td><span class=\"tag\">evcc</span> <code>/var/lib/evcc/evcc.db</code></td><td>evcc's own</td><td>The whole evcc configuration, written by the browser. Not installed and not touched by the installer; the nightly backup archives it</td></tr>\n<tr><td><code>~/TeslaBleHttpProxy/key/</code></td><td>755 USERNAME</td><td>The Charging Manager keypair. It cannot be regenerated, and losing it means re-pairing the car with the key card</td></tr>\n<tr><td><code>INFLUX_DIR/data/</code></td><td>755 USERNAME</td><td>The whole history, on the USB disk. Bound into the <code>influxdb-data</code> volume, not copied into it &mdash; this <em>is</em> the database. The largest thing here and the only thing that grows</td></tr>\n<tr><td><code>INFLUX_DIR/config/</code></td><td>755 USERNAME</td><td>InfluxDB&rsquo;s CLI profile, beside the data so that a disk that moves takes both</td></tr>\n<tr><td><code>INFLUX_DIR/backups/</code></td><td>755 root, archives 600 USERNAME</td><td><code>STAGING_DIR</code>: the nightly archives, written and proven here before they are pushed, and kept here as the tier that still works when the NAS is down. On the history disk on purpose &mdash; the next install adopts that disk untouched, which is what makes a reinstall with a surviving disk possible at all</td></tr>\n<tr><td><code>/var/lib/docker/volumes/monitoring_grafana-data</code></td><td>root, docker&rsquo;s own</td><td>The board as Grafana holds it, on the card. It changes when you change a dashboard, not with every point logged, which is why it never needed to move to the disk</td></tr>\n</tbody>\n</table>\n</div>\n\n<div class=\"note blue\" data-lvl=\"2\">\n  <span class=\"h\">What to back up</span>\n  <p>Nothing, by hand. At 22:30 every night the maintenance window opens with <code>maintenance-backup.py</code>, which writes five archives &mdash; the answers, the pairing key, evcc&rsquo;s device database, the history with every token it honours, and the board &mdash; into <code>INFLUX_DIR/backups</code> on the history disk, then pushes each one to your Samba share and proves the copy landed intact. Two tiers, two devices, no discipline required of you. The one thing worth checking is that both tiers are actually filling: the archives on the share should wear tonight&rsquo;s date, and the board&rsquo;s &ldquo;Tonight&rdquo; table says so in a row.</p>\n  <p data-lvl=\"4\">Five families, and the first is the one most home-made backups are missing. <code>answers</code> carries <code>/etc/solar-surplus</code> &mdash; a few kilobytes that <em>are</em> the install&rsquo;s identity, every password and every token. <code>key</code> carries <code>~/TeslaBleHttpProxy/key/</code>, the pairing, and is the one item here that cannot be regenerated from anything at all. <code>evcc-db</code> carries <code>/var/lib/evcc/evcc.db</code>, every device you configured in the browser. <code>influxdb</code> carries the disk at <code>INFLUX_DIR</code> and, riding inside it, <code>/etc/solar-surplus</code>, all four <code>/etc/default</code> files and <code>telegraf.conf</code>. <code>grafana</code> carries the <code>grafana-data</code> volume off the card. The secrets travel <em>with</em> the history rather than beside it because a restore that brings back the data but not its tokens produces a Pi whose loggers write to an InfluxDB that has never heard of them &mdash; and tokens without their history match nothing. They arrive together or neither is any use. The single deliberate omission is <code>/etc/solar-surplus/release</code>, excluded from both archives that would otherwise carry it: that file names what is installed <em>now</em>, and an archive&rsquo;s copy of it is the past.</p>\n  <p data-lvl=\"4\">The history living on its own disk changes what a backup is for. A dead card no longer takes the history with it &mdash; the disk survives, and the installer adopts it back by its label. What the archives still cover is the disk itself dying, a filesystem that will not mount, and the ordinary mistake. Two devices that fail independently is the whole benefit; treating the second one as a backup of the first is how people lose both. That is also why the staging tier sits on the disk and the pushed tier sits on the NAS, and why rotation keeps fourteen of each small family but only four of the history: identity and boards are cheap to keep for a month, and a multi-gigabyte archive is not.</p>\n</div>\n\n<div class=\"cmd\" data-lvl=\"2\">\n<div class=\"lbl\"><span>Backup, out of turn</span><span class=\"path\">ssh, or the terminal in WinSCP</span></div>\n<pre><span class=\"c\"># exactly what 22:30 does, started by hand &#8212; before you change something</span>\nsudo systemctl start maintenance-backup.service\njournalctl -u maintenance-backup.service -n 60 --no-pager</pre>\n</div>\n\n<p data-lvl=\"3\">What that one line does, in the order it does it. It takes <code>/run/lock/maintenance.lock</code> and holds it for the whole run, which is what the ladder and the reboot leg wait on, so nothing else in the window can start underneath it. It adds up what the five components occupy and refuses to begin if the staging directory has less free than that &mdash; gzip will shrink them, but a backup that gambles on the compression ratio is not a backup. It stops evcc, both loggers and both container stacks before reading a byte, because <code>evcc.db</code> and InfluxDB&rsquo;s bolt file are live stores and a copy taken mid-write is a copy of a torn file. Each archive is written to a <code>.partial</code> name, read back whole with <code>tar -tzf</code> so gzip&rsquo;s CRC and tar&rsquo;s structure both have to agree, sha256-hashed with the digest printed, and only then renamed &mdash; a file that failed any of that never gets to wear a backup&rsquo;s name. Everything is started again in a <code>finally</code>, so a failure part-way still leaves you a running system. Then each archive is pushed over <code>smbclient</code> and immediately fetched back to a scratch file and compared by hash: a mismatch stops the run there and rotates nothing, because a push that cannot be proved must not be allowed to retire the copy it was meant to replace. Finally both tiers are rotated to the same numbers, and one <code>maintenance,phase=backup</code> point is written, so the proof you just read in the terminal is also on the board.</p>\n\n<p data-lvl=\"4\">Two design choices in there are worth naming. The share is reached over <code>smbclient</code> and deliberately not mounted: a mount is one more <code>/etc/fstab</code> entry that can hang a boot, and this system rebooting cleanly every night is the whole point of the window. And the share password never rides on a command line &mdash; <code>/proc</code> shows every argv to every local process &mdash; so each run writes a private mode-600 credentials file and hands <code>smbclient</code> its path with <code>-A</code>, then deletes it. The archives exist at all because nothing here can be pulled directly with WinSCP: Grafana&rsquo;s volume lives under <code>/var/lib/docker/volumes/</code>, the state files are root-owned, and the disk belongs to itself rather than to your home directory. An SFTP session logged in as you can see none of them, so the Pi packs what root can read into archives that anything can carry.</p>", "cmds": ["sudo systemctl start maintenance-backup.service", "journalctl -u maintenance-backup.service -n 60 --no-pager"]}, {"id": "s56", "title": "Restore", "html": "<p data-lvl=\"2\">One thing about a restore matters more than everything else in this section: <strong>the answers go back before <code>install.py</code>, and everything else goes back after it.</strong> The answers archive is the install&rsquo;s identity &mdash; every password and every token the running InfluxDB was built with. Put it back first and the installer reads it, generates nothing new, and continues that identity; the surviving database accepts this run&rsquo;s tokens because they <em>are</em> its tokens. Run the installer first and it mints a fresh set, and then the <code>token</code> step meets a database that has never heard of them and stops with a 401 &mdash; correctly, but with a rebuild to unpick. Everything else has the opposite requirement: the installer is what creates the stacks, the units and the directories those archives unpack into, so they can only go back afterwards. That single ordering rule is the whole of the sequence below.</p>\n\n<div class=\"cmd\" data-lvl=\"2\">\n<div class=\"lbl\"><span>Restore, in the one order that works</span><span class=\"path\">ssh, on the fresh card</span></div>\n<pre><span class=\"c\"># 1. the archives off the surviving disk &#8212; read-only, and unmounted again,</span>\n<span class=\"c\">#    because the installer's storage step must find the disk UNmounted</span>\nsudo mkdir -p /mnt/influxdb\nsudo mount -o ro /dev/disk/by-label/influxdb /mnt/influxdb\ncp /mnt/influxdb/backups/*-backup-*.tar.gz /tmp/\nsudo umount /mnt/influxdb\n\n<span class=\"c\"># 2. the identity, BEFORE the installer. The one rung that cannot use the</span>\n<span class=\"c\">#    script, because the deb that carries the script is not on the box yet</span>\nsudo tar -xzf /tmp/answers-backup-&lt;date&gt;.tar.gz -C / <span class=\"c\">\\</span>\n     --exclude etc/solar-surplus/release etc/solar-surplus\n\n<span class=\"c\"># 3. the install &#8212; it reads those answers and continues the identity</span>\ncurl -fsSLO https://github.com/mihai-gafiteanu/solar-surplus-releases/releases/latest/download/get.py\nsudo python3 get.py\nsudo reboot                                <span class=\"c\"># the docker group</span>\n\n<span class=\"c\"># 4. everything else, AFTER the install and its reboot</span>\nsudo python3 /usr/lib/solar-surplus/files/maintenance-backup.py --restore /tmp\nsudo reboot</pre>\n</div>\n\n<p data-lvl=\"3\">Step 2 is a hand-run <code>tar</code> rather than a verb of the script for one plain reason: on a fresh card the script does not exist yet. It arrives with the deb, and the deb arrives with <code>get.py</code>, which runs the installer in the same breath. So the answers rung is the one the restore verb cannot wrap &mdash; and the exclusion on that line is not decoration: a restored <code>/etc/solar-surplus/release</code> would tell the fresh install that this release had already converged, and it would refuse its own converge. Once the tree <em>is</em> on the box, <code>--restore answers</code> does the same thing with the same exclusion. If the disk died too and the archives are only on the NAS, copy them off the share from another machine before step 2; <code>--fetch /tmp</code> can only work after step 3, since the share&rsquo;s settings live in a file the installer renders.</p>\n\n<p data-lvl=\"3\">What step 4 hides: it refuses to run if the compose stacks are missing, because it restores onto a fresh
