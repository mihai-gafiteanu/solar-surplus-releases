 install rather than replacing one; it takes every service and both stacks <em>down</em>, not merely stopped, so the volumes are closed and released; it unpacks the secrets under <code>/etc</code> before anything starts, because every service reads them at start; it unpacks each archive to the root it was written from; it returns ownership of the key and the two disk directories to your login, since <code>tar</code> ran as root; it merges any raised pins back into <code>~/monitoring/.env</code>, so nothing starts a default-pin container over data a raised pin wrote; it brings everything up and waits for InfluxDB, Grafana and the BLE proxy to answer; and it prints the one request that proves the pairing survived. The reboot at the end is not politeness: every unit is still holding what it read at boot, and the restore has just replaced that on disk.</p>\n\n<div class=\"note\" data-lvl=\"3\">\n  <span class=\"h\">A surviving disk needs no restoring &mdash; and the restore knows</span>\n  <p>When the card died and the disk did not, the disk is carrying the history the card lost. The installer&rsquo;s <code>storage</code> step adopts it by its <code>influxdb</code> label &mdash; mounted, recorded in <code>/etc/fstab</code> by UUID, untouched &mdash; which is why step 1 above unmounts it again before the installer runs. <code>--restore</code> then skips the <em>data</em> inside the influxdb archive on its own and says so out loud: the mounted disk&rsquo;s copy is newer than any archive&rsquo;s. The secrets in that same archive are restored either way, which is the point. Only if the disk itself is what died do you want the archive&rsquo;s copy, and then you say so by name &mdash; <code>sudo python3 /usr/lib/solar-surplus/files/maintenance-backup.py --restore influxdb</code>. Even then nothing is erased: what was there is renamed to <code>data.pre-restore-&lt;date&gt;</code> beside it and left for you to delete once the board shows the restored history.</p>\n  <p data-lvl=\"4\">The failure this ordering exists to prevent has a recognisable shape, so learn it once. An adopted disk holds a database built with the <em>old</em> secrets. If the installer ran before the answers came back it minted <em>new</em> ones, and the <code>token</code> step meets a 401: the admin token in <code>install.conf</code> does not match the running instance. At a terminal it will offer, at that point, to erase the history and start fresh. <strong>If you are ever offered that during a restore, stop.</strong> It means step 2 did not take. The road back is to put the answers archive in place and converge once &mdash; <code>sudo python3 /usr/lib/solar-surplus/install.py --force</code> &mdash; after which every generated file re-derives from the restored answers and every token matches the database it is pointed at.</p>\n</div>\n\n<div class=\"note green\" data-lvl=\"4\">\n  <span class=\"h\">Measured, on cards rebuilt from nothing</span>\n  <p>Measured on an early build, when the history was still a Docker volume on the card: fresh Raspberry&nbsp;Pi&nbsp;OS write, the release unpacked, installer run, archive restored, reboot &mdash; under thirty minutes end to end, and the board came back whole: the same history in the same panels, the same session totals, evcc still holding every device it was configured with, and all five components reading as up to date. Nothing was reconfigured and nothing was typed in twice.</p>\n  <p>Measured again on 15&nbsp;August&nbsp;2026, on this release&rsquo;s ancestor: fresh card, installer, reboot, and the pairing key alone put back by hand &mdash; the exact sequence <code>maintenance-backup.py --restore key</code> now runs &mdash; and the car&rsquo;s body controller answered the first request. The pairing survived the reinstall with no ceremony, which was the whole claim.</p>\n</div>\n\n<div class=\"note\" data-lvl=\"3\">\n  <span class=\"h\">The key alone is a complete restore of the pairing</span>\n  <p>Everything else in the archives is convenience &mdash; answers you could retype, dashboards you could rebuild, history you could live without. <code>TeslaBleHttpProxy/key/</code> is different in kind: the car holds the public half, and only the key-card ceremony in <a href=\"#s10\">section 10</a> can enroll a new one. Restoring that directory <em>is</em> the pairing. On a machine where only the key matters, name it and nothing else &mdash; <code>sudo python3 /usr/lib/solar-surplus/files/maintenance-backup.py --restore /tmp key</code> &mdash; and the run restores what you asked for and leaves the rest alone. The proof, with the real VIN: <code>curl -s \"http://127.0.0.1:8080/api/1/vehicles/YOUR_VIN/body_controller_state\"</code> &mdash; a JSON answer means the key that came back is the one the car knows; &ldquo;your public key has not been paired&rdquo; means it is not, and section 10&rsquo;s ceremony is the road back. The restore prints that request for you whenever the key was among the archives it put back.</p>\n  <p data-lvl=\"4\">The installer&rsquo;s <code>ble</code> step recognises a pre-existing <code>key/</code> and says so, which means the order also works the other way around: put the key back <em>before</em> running the installer and the run itself reports the pairing as already done.</p>\n</div>\n\n<div class=\"cmd\" data-lvl=\"4\">\n<div class=\"lbl\"><span>What the script does, spelled out</span><span class=\"path\">the same backup and restore, by hand</span></div>\n<pre><span class=\"c\"># the nightly run, by hand &#8212; five archives, everything stopped first</span>\nsudo systemctl stop evcc grid-voltage-logger.service pi-throttled.service\ndocker compose -f ~/monitoring/docker-compose.yml stop\ndocker compose -f ~/TeslaBleHttpProxy/docker-compose.yml stop\nD=$(date +%F); S=/mnt/influxdb/backups; sudo mkdir -p \"$S\"\nsudo tar -czf \"$S/answers-backup-$D.tar.gz\"  -C / <span class=\"c\">\\</span>\n     --exclude etc/solar-surplus/release etc/solar-surplus\nsudo tar -czf \"$S/key-backup-$D.tar.gz\"      -C \"$HOME\" TeslaBleHttpProxy/key\nsudo tar -czf \"$S/evcc-db-backup-$D.tar.gz\"  -C /       var/lib/evcc/evcc.db\nsudo tar -czf \"$S/influxdb-backup-$D.tar.gz\" <span class=\"c\">\\</span>\n     -C /mnt --exclude etc/solar-surplus/release --exclude influxdb/backups influxdb <span class=\"c\">\\</span>\n     -C /    etc/solar-surplus etc/default/grid-voltage-logger <span class=\"c\">\\</span>\n             etc/default/pi-throttled etc/default/update-runner <span class=\"c\">\\</span>\n             etc/default/maintenance-backup <span class=\"c\">\\</span>\n     -C \"$HOME\" telegraf/telegraf.conf\nsudo tar -czf \"$S/grafana-backup-$D.tar.gz\"  -C /       var/lib/docker/volumes/monitoring_grafana-data\ndocker compose -f ~/TeslaBleHttpProxy/docker-compose.yml start\ndocker compose -f ~/monitoring/docker-compose.yml start\nsudo systemctl start evcc grid-voltage-logger.service pi-throttled.service\n\n<span class=\"c\"># prove each archive is readable end to end, and note its hash</span>\nfor f in \"$S\"/*-backup-$D.tar.gz; do sudo tar -tzf \"$f\" &gt;/dev/null &amp;&amp; sha256sum \"$f\"; done\n\n<span class=\"c\"># the share's settings, exactly as the unit loads them &#8212; SMB_PASSWORD</span>\n<span class=\"c\"># lives in that file, which is why it is 600 root:root</span>\nset -a; . /etc/default/maintenance-backup; set +a\n\n<span class=\"c\"># push one archive and prove the copy &#8212; the password in a file, never on argv</span>\numask 077; printf 'username=%s\\npassword=%s\\n' \"$SMB_USER\" \"$SMB_PASSWORD\" &gt;/tmp/.smb-auth\nsmbclient \"//$SMB_HOST/$SMB_SHARE\" -A /tmp/.smb-auth <span class=\"c\">\\</span>\n  -c \"cd \\\"$SMB_DIR\\\"; put \\\"$S/key-backup-$D.tar.gz\\\" \\\"key-backup-$D.tar.gz\\\"\"\nsmbclient \"//$SMB_HOST/$SMB_SHARE\" -A /tmp/.smb-auth <span class=\"c\">\\</span>\n  -c \"cd \\\"$SMB_DIR\\\"; get \\\"key-backup-$D.tar.gz\\\" \\\"$S/.check\\\"\"\nsha256sum \"$S/key-backup-$D.tar.gz\" \"$S/.check\"   <span class=\"c\"># the two must match</span>\nrm -f \"$S/.check\" /tmp/.smb-auth\n\n<span class=\"c\"># --restore, by hand &#8212; after install.py and its reboot, archives in /tmp</span>\ncd /tmp\nsudo systemctl stop evcc grid-voltage-logger.service pi-throttled.service\ndocker compose -f ~/monitoring/docker-compose.yml down\ndocker compose -f ~/TeslaBleHttpProxy/docker-compose.yml down\nsudo tar -xzf answers-backup-*.tar.gz  -C / --exclude etc/solar-surplus/release etc/solar-surplus\nsudo tar -xzf influxdb-backup-*.tar.gz -C / --exclude etc/solar-surplus/release etc\nsudo tar -xzf influxdb-backup-*.tar.gz -C \"$HOME\" telegraf\nsudo mv /mnt/influxdb/data /mnt/influxdb/data.pre-restore-$(date +%F)  <span class=\"c\"># only if the disk died</span>\nsudo tar -xzf influxdb-backup-*.tar.gz -C /mnt influxdb                <span class=\"c\"># only if the disk died</span>\nsudo tar -xzf evcc-db-backup-*.tar.gz  -C /       var/lib/evcc/evcc.db\nsudo tar -xzf grafana-backup-*.tar.gz  -C /       var\nsudo tar -xzf key-backup-*.tar.gz      -C \"$HOME\" TeslaBleHttpProxy/key\nsudo chown -R \"$USER:$USER\" ~/TeslaBleHttpProxy/key /mnt/influxdb/data /mnt/influxdb/config\ndocker compose -f ~/monitoring/docker-compose.yml up -d\ndocker compose -f ~/TeslaBleHttpProxy/docker-compose.yml up -d\nsudo systemctl start evcc grid-voltage-logger.service pi-throttled.service\nsudo reboot</pre>\n</div>\n\n<p data-lvl=\"4\">Why each line is where it is. The archives are written to <code>/mnt/influxdb/backups</code> and not to your home directory, because that directory is on the disk that survives a card reflash. The influxdb tar changes root three times in one command &mdash; the disk, then <code>/</code> for the secrets, then your home for <code>telegraf.conf</code> &mdash; because the secrets and the database they open must be one archive that cannot be half-restored; the two <code>--exclude</code>s keep the release marker out and stop the archive from swallowing the directory it is being written into. On the way back, the stacks go <em>down</em> rather than <em>stop</em>, because <code>down</code> releases the volumes the archives are about to replace; the secrets under <code>/etc</code> unpack before anything starts because every service reads them at start; the archives are named from <code>/tmp</code> by explicit path because <code>~</code> on a fresh card is a different home than the one they were written from; the <code>chown</code> exists because <code>tar</code> ran as root; and the reboot is what turns &ldquo;the files are back&rdquo; into &ldquo;the system read them&rdquo;. What this by-hand form does <em>not</em> reproduce is the whole reason to let the script do it: on the way out it takes the maintenance lock so the window&rsquo;s ladder cannot start underneath it, it checks there is room before it begins, it rotates both tiers to <code>KEEP_SMALL</code> and <code>KEEP_INFLUX</code>, and it writes the outcome point that puts tonight&rsquo;s backup on the board; on the way back it merges any raised pins into <code>~/monitoring/.env</code> before it starts a container, and waits for InfluxDB, Grafana and the BLE proxy to answer before it calls the restore done.</p>", "cmds": ["sudo mkdir -p /mnt/influxdb", "sudo mount -o ro /dev/disk/by-label/influxdb /mnt/influxdb", "cp /mnt/influxdb/backups/*-backup-*.tar.gz /tmp/", "sudo umount /mnt/influxdb", "sudo tar -xzf /tmp/answers-backup-<date>.tar.gz -C / --exclude etc/solar-surplus/release etc/solar-surplus", "curl -fsSLO https://github.com/mihai-gafiteanu/solar-surplus-releases/releases/latest/download/get.py", "sudo python3 get.py", "sudo reboot # the docker group", "sudo python3 /usr/lib/solar-surplus/files/maintenance-backup.py --restore /tmp", "sudo reboot", "sudo systemctl stop evcc grid-voltage-logger.service pi-throttled.service", "docker compose -f ~/monitoring/docker-compose.yml stop", "docker compose -f ~/TeslaBleHttpProxy/docker-compose.yml stop", "D=$(date +%F); S=/mnt/influxdb/backups; sudo mkdir -p \"$S\"", "sudo tar -czf \"$S/answers-backup-$D.tar.gz\" -C / --exclude etc/solar-surplus/release etc/solar-surplus", "sudo tar -czf \"$S/key-backup-$D.tar.gz\" -C \"$HOME\" TeslaBleHttpProxy/key", "sudo tar -czf \"$S/evcc-db-backup-$D.tar.gz\" -C / var/lib/evcc/evcc.db", "sudo tar -czf \"$S/influxdb-backup-$D.tar.gz\" -C /mnt --exclude etc/solar-surplus/release --exclude influxdb/backups influxdb -C / etc/solar-surplus etc/default/grid-voltage-logger etc/default/pi-throttled etc/default/update-runner etc/default/maintenance-backup -C \"$HOME\" telegraf/telegraf.conf", "sudo tar -czf \"$S/grafana-backup-$D.tar.gz\" -C / var/lib/docker/volumes/monitoring_grafana-data", "docker compose -f ~/TeslaBleHttpProxy/docker-compose.yml start", "docker compose -f ~/monitoring/docker-compose.yml start", "sudo systemctl start evcc grid-voltage-logger.service pi-throttled.service", "for f in \"$S\"/*-backup-$D.tar.gz; do sudo tar -tzf \"$f\" >/dev/null && sha256sum \"$f\"; done", "set -a; . /etc/default/maintenance-backup; set +a", "umask 077; printf 'username=%s\\npassword=%s\\n' \"$SMB_USER\" \"$SMB_PASSWORD\" >/tmp/.smb-auth", "smbclient \"//$SMB_HOST/$SMB_SHARE\" -A /tmp/.smb-auth -c \"cd \\\"$SMB_DIR\\\"; put \\\"$S/key-backup-$D.tar.gz\\\" \\\"key-backup-$D.tar.gz\\\"\"", "smbclient \"//$SMB_HOST/$SMB_SHARE\" -A /tmp/.smb-auth -c \"cd \\\"$SMB_DIR\\\"; get \\\"key-backup-$D.tar.gz\\\" \\\"$S/.check\\\"\"", "sha256sum \"$S/key-backup-$D.tar.gz\" \"$S/.check\" # the two must match", "rm -f \"$S/.check\" /tmp/.smb-auth", "cd /tmp", "sudo systemctl stop evcc grid-voltage-logger.service pi-throttled.service", "docker compose -f ~/monitoring/docker-compose.yml down", "docker compose -f ~/TeslaBleHttpProxy/docker-compose.yml down", "sudo tar -xzf answers-backup-*.tar.gz -C / --exclude etc/solar-surplus/release etc/solar-surplus", "sudo tar -xzf influxdb-backup-*.tar.gz -C / --exclude etc/solar-surplus/release etc", "sudo tar -xzf influxdb-backup-*.tar.gz -C \"$HOME\" telegraf", "sudo mv /mnt/influxdb/data /mnt/influxdb/data.pre-restore-$(date +%F) # only if the disk died", "sudo tar -xzf influxdb-backup-*.tar.gz -C /mnt influxdb # only if the disk died", "sudo tar -xzf evcc-db-backup-*.tar.gz -C / var/lib/evcc/evcc.db", "sudo tar -xzf grafana-backup-*.tar.gz -C / var", "sudo tar -xzf key-backup-*.tar.gz -C \"$HOME\" TeslaBleHttpProxy/key", "sudo chown -R \"$USER:$USER\" ~/TeslaBleHttpProxy/key /mnt/influxdb/data /mnt/influxdb/config", "docker compose -f ~/monitoring/docker-compose.yml up -d", "docker compose -f ~/TeslaBleHttpProxy/docker-compose.yml up -d", "sudo systemctl start evcc grid-voltage-logger.service pi-throttled.service", "sudo reboot"]}, {"id": "s57", "title": "Address worksheet", "html": "<p data-lvl=\"2\">Fill in the right-hand column and this becomes a map of your own system. The installer asks eight questions: the login name, two addresses, where the history disk is mounted, and the four answers that describe the Samba share the nightly backup pushes to. <code>ROUTER_IP</code> and <code>CHARGER_IP</code> are yours to look up &mdash; the installer never asks for them, but evcc and your router do. Everything below the rule is made on the machine and never printed: six secrets generated at the start of the run, three bucket-scoped tokens minted by the steps that need them, and all of them written once into <code>~/solar-surplus-secrets-v&lt;release&gt;.xml</code> for KeePass to import.</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Placeholders and where they appear</caption>\n<thead><tr><th scope=\"col\" style=\"width:30%\">Placeholder</th><th scope=\"col\" style=\"width:22%\">Your value</th><th scope=\"col\">Where it appears</th></tr></thead>\n<tbody>\n<tr><td><code>INVERTER_IP</code></td><td>&nbsp;</td><td>Both evcc meters, the voltage logger, the verification commands. Ports 502 (Modbus TCP) and 80 (Solar API). Asked</td></tr>\n<tr><td><code>PI_IP</code></td><td>&nbsp;</td><td>The loggers&rsquo; InfluxDB URL in <code>/etc/default/grid-voltage-logger</code>, every URL in the KeePass file, and the links the run prints at the end. Ports 7070 evcc &middot; 8080 BLE proxy &middot; 8086 InfluxDB &middot; 3000 Grafana &mdash; the same four the boot report waits on &mdash; and 9101, the window listener. Asked</td></tr>\n<tr><td><code>CHARGER_IP</code></td><td>&nbsp;</td><td>The Wall Connector. Port 80, <code>/api/1/vitals</code> &mdash; typed into evcc in the browser, never into the installer</td></tr>\n<tr><td><code>ROUTER_IP</code></td><td>&nbsp;</td><td>DHCP reservations for the three devices above. Port 8443, admin</td></tr>\n<tr><td><code>USERNAME</code></td><td>&nbsp;</td><td>The SSH login, the docker group, the home the three compose stacks and the secrets file live under, and both paths in <code>/etc/default/update-runner</code>. Asked, defaulting to whoever ran <code>sudo</code></td></tr>\n<tr><td><code>INFLUX_DIR</code></td><td>&nbsp;</td><td>Where the history disk is mounted: the two bind devices in <code>~/monitoring/docker-compose.yml</code>, and <code>INFLUX_DIR/backups</code>, the archives&rsquo; staging tier. Asked, defaulting to <code>/mnt/influxdb</code></td></tr>\n<tr><td><code>SMB_SERVER</code></td><td>&nbsp;</td><td>The server the 22:30 backup pushes to, by name or address &mdash; <code>/etc/default/maintenance-backup</code>. Asked</td></tr>\n<tr><td><code>SMB_SHARE_NAME</code></td><td>&nbsp;</td><td>The share on that server; the archives land in its <code>solar-surplus</code> subdirectory, created on the first push. Asked</td></tr>\n<tr><td><code>SMB_USERNAME</code></td><td>&nbsp;</td><td>The account the push authenticates as. Rotation deletes on the share, so it needs delete rights in its own directory. Asked</td></tr>\n<tr><td>Samba password</td><td>&nbsp;</td><td>The one question typed hidden. It lives in <code>/etc/default/maintenance-backup</code> and <code>install.conf</code>, both 600 root, and never on a command line &mdash; each run writes a private <code>smbclient -A</code> credentials file and deletes it afterwards</td></tr>\n<tr><td>InfluxDB instance admin token</td><td><span class=\"small\">generated</span></td><td>The monitoring compose file, which creates the instance &mdash; and <code>install.py</code> on every run after that, which reads the org, the bucket and the authorisations with it, and mints and prunes the three bucket-scoped tokens below. Treat it like a root password and hand out those instead</td></tr>\n<tr><td>InfluxDB admin password</td><td><span class=\"small\">generated</span></td><td>The same compose file, and the browser login at port 8086</td></tr>\n<tr><td>Grafana admin password</td><td><span class=\"small\">generated</span></td><td>The compose file, and your login at port 3000</td></tr>\n<tr><td>Grafana viewer password</td><td><span class=\"small\">generated</span></td><td>A read-only login for whoever checks the boards without changing them. The installer pins that account back to the Viewer role on every run</td></tr>\n<tr><td>evcc admin password</td><td><span class=\"small\">generated</span></td><td>Generated but not installable: evcc asks you to SET an administrator password on its first visit, and nothing here can type it in. Give it this one, and every credential of the install is in one file rather than one short of complete</td></tr>\n<tr><td>Window-button token</td><td><span class=\"small\">generated</span></td><td>The bearer the board&rsquo;s two buttons present to the window listener on 9101. It also rides, hidden, inside the dashboard, so it guards against stray LAN requests, not against anyone who can open Grafana</td></tr>\n<tr><td>InfluxDB bucket token</td><td><span class=\"small\">minted</span></td><td>Read and write on <code>evcc</code> alone: the shared logger environment file, Grafana&rsquo;s data source, and evcc&rsquo;s own InfluxDB integration &mdash; the one place it still gets typed in by hand</td></tr>\n<tr><td>Telegraf write token</td><td><span class=\"small\">minted</span></td><td>Write on <code>system</code> alone: <code>~/telegraf/telegraf.conf</code> and <code>/etc/default/pi-throttled</code>, the two collectors of the Pi&rsquo;s own vitals</td></tr>\n<tr><td>Grafana system-bucket token</td><td><span class=\"small\">minted</span></td><td>Read on <code>system</code> alone: the <code>influxdb-system</code> data source the board&rsquo;s Pi half reads through</td></tr>\n</tbody>\n</table>\n</div>", "cmds": []}, {"id": "s58", "title": "The stack", "html": "<div data-lvl=\"2\" class=\"kv\">\n  <div><div class=\"k\">Inverter</div><div class=\"v\">Fronius Symo GEN24 Plus<small>+ Fronius Smart Meter</small></div></div>\n  <div><div class=\"k\">Charger</div><div class=\"v\">Tesla Wall Connector Gen 3<small>evcc template <code>twc3</code></small></div></div>\n  <div><div class=\"k\">Vehicle</div><div class=\"v\">Tesla Model 3<small>evcc template <code>tesla-ble</code></small></div></div>\n  <div><div class=\"k\">Controller</div><div class=\"v\">Raspberry Pi 4 B<small>Raspberry Pi OS Lite 64-bit</small></div></div>\n  <div><div class=\"k\">Management</div><div class=\"v\">evcc<small>configured in the browser</small></div></div>\n  <div><div class=\"k\">Bridge</div><div class=\"v\">TeslaBleHttpProxy<small>wimaha, Docker &middot; pinned <code>2.3.0</code> exactly</small></div></div>\n  <div><div class=\"k\">History</div><div class=\"v\">InfluxDB 2.9<small>org <code>home</code> · buckets <code>evcc</code> and <code>system</code></small></div></div>\n  <div><div class=\"k\">Dashboards</div><div class=\"v\">Grafana 13.2<small>+ lehmannch-flow-panel</small></div></div>\n  <div><div class=\"k\">Collector</div><div class=\"v\">Telegraf 1.35<small>the Pi&rsquo;s vitals into <code>system</code>, 90 days</small></div></div>\n  <div><div class=\"k\">Off-box backup</div><div class=\"v\">Samba share<small>on the LAN, reached over <code>smbclient</code></small></div></div>\n  <div><div class=\"k\">Protection</div><div class=\"v\">DigiTOP V-PRO-3F63A<small>cut-off 257 V · ETITEC V T2 · 255/20</small></div></div>\n  <div><div class=\"k\">Router</div><div class=\"v\">ASUS TUF-BE6500<small>one flat subnet · 2.4 GHz IoT SSID</small></div></div>\n  <div><div class=\"k\">Range extender</div><div class=\"v\">ASUS wall-plug repeater<small>2.4 GHz out to the exterior wall</small></div></div>\n  <div><div class=\"k\">History disk</div><div class=\"v\">500&nbsp;GB 2.5&rdquo; USB<small>ext4 on <code>/mnt/influxdb</code></small></div></div>\n</div>\n\n<footer class=\"end\">\n  <p>Charging on solar surplus — build and operations documentation for a Fronius GEN24 · Tesla Wall Connector Gen&nbsp;3 · Raspberry Pi&nbsp;4 installation running evcc.</p>\n  <p>Released as a Debian package, one tagged release at a time: <code>install.py</code>, <code>selftest.py</code> and the files in <code>files/</code> under <code>/usr/lib/solar-surplus/</code>, with the fourteen units beside them. This copy of the document was last revised 2026-08-23, describing release v2.41; the download links below always serve the newest release regardless. <code>get.py</code> fetches it, proves its hash, and runs its self-test before anything is installed.</p>\n  <p>Addresses appear as placeholders throughout. The installer asks for the two it needs once and substitutes them everywhere; nothing published here carries a secret.</p>\n</footer>", "cmds": []}]}]}</script>
<script>
(function(){

var DATA = JSON.parse(document.getElementById('data').textContent);
var SECTIONS = DATA.sections;
var STEPS = [];
SECTIONS.forEach(function(sec){ sec.steps.forEach(function(st){ st.sec = sec; STEPS.push(st); }); });

var KEY = 'ssr-v160-review';
var state = {};        // id -> {v:verdict, note:'', done:{cmdIndex:true}}
var extraNote = '';
var cur = 0, filter = 'all';

/* ------------------------------------------------------------------
   persistence — three tiers, each a fallback for the one before it
     1. a real file in the Pi folder, written on every change (needs the
        File System Access API: Chrome or Edge, page served over http(s)
        or opened from file:// where the browser permits it)
     2. localStorage, so a reload does not lose the session
     3. the Copy review button, which always works
------------------------------------------------------------------ */
var fileHandle = null, saveTimer = null, savedAt = null;

function snapshot(){
  return {
    doc: 'solar-surplus install review', version: '2026-08-23',
    savedAt: new Date().toISOString(),
    reviewed: STEPS.filter(function(s){ return state[s.id] && state[s.id].v; }).length,
    total: STEPS.length,
    state: state, extra: extraNote,
    markdown: build()
  };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({state:state, extra:extraNote})); }catch(e){}
  if(!fileHandle) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeFile, 700);
}
function writeFile(){
  if(!fileHandle) return;
  fileHandle.createWritable().then(function(w){
    return w.write(JSON.stringify(snapshot(), null, 2)).then(function(){ return w.close(); });
  }).then(function(){
    savedAt = new Date();
    status('live', 'saved ' + savedAt.toTimeString().slice(0,5));
  }).catch(function(err){
    status('err', 'save failed — ' + (err && err.name || 'error'));
  });
}
function status(cls, msg){
  var el = document.getElementById('savest');
  el.className = 'savest ' + (cls || '');
  el.textContent = msg || '';
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var o = JSON.parse(raw); state = o.state || {}; extraNote = o.extra || ''; }
  }catch(e){ state = {}; }
}
function rec(id){ if(!state[id]) state[id] = {v:'', note:'', done:{}}; return state[id]; }

/* remember the linked file across reloads (handles survive in IndexedDB) */
function idb(fn){
  try{
    var rq = indexedDB.open('ssr-handle', 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore('h'); };
    rq.onsuccess = function(){ fn(rq.result); };
    rq.onerror = function(){};
  }catch(e){}
}
function rememberHandle(h){
  idb(function(db){
    try{ db.transaction('h','readwrite').objectStore('h').put(h, 'file'); }catch(e){}
  });
}
function recallHandle(){
  if(!window.showSaveFilePicker) return status('', 'autosave unavailable in this browser');
  idb(function(db){
    var g;
    try{ g = db.transaction('h','readonly').objectStore('h').get('file'); }catch(e){ return; }
    g.onsuccess = function(){
      var h = g.result;
      if(!h) return status('', 'not linked — click ⛁ Link file');
      h.queryPermission({mode:'readwrite'}).then(function(p){
        if(p === 'granted'){ adopt(h, true); }
        else status('', 'click ⛁ Link file to resume autosave');
      }).catch(function(){});
    };
  });
}
/* pull anything already in the file so a reopened session continues where it stopped */
function adopt(h, merge){
  fileHandle = h;
  document.getElementById('btnlink').textContent = '⛁ ' + h.name;
  if(!merge){ writeFile(); return; }
  h.getFile().then(function(f){ return f.text(); }).then(function(t){
    if(!t.trim()) return;
    var o = JSON.parse(t);
    var localCount = Object.keys(state).length;
    var fileCount = Object.keys(o.state || {}).length;
    if(fileCount > localCount){ state = o.state || {}; extraNote = o.extra || ''; buildRail(); render(); }
    status('live', 'linked → ' + h.name);
  }).catch(function(){ status('live', 'linked → ' + h.name); });
}

/* --- rail --- */
function buildRail(){
  var rail = document.getElementById('rail');
  rail.innerHTML = '';
  SECTIONS.forEach(function(sec, si){
    var d = document.createElement('div');
    d.className = 'sec'; d.dataset.si = si;
    var pips = sec.steps.map(function(st){
      return '<span class="pip ' + (state[st.id] ? state[st.id].v : '') + '"></span>';
    }).join('');
    d.innerHTML = '<div class="sech"><span class="n">' + sec.num + '</span>' +
                  '<span class="t">' + esc(sec.title) + '</span>' +
                  '<span class="pips">' + pips + '</span></div>' +
                  '<div class="steps"></div>';
    var box = d.querySelector('.steps');
    sec.steps.forEach(function(st){
      var gi = STEPS.indexOf(st);
      var e = document.createElement('div');
      e.className = 'step' + (gi === cur ? ' cur' : '');
      e.dataset.i = gi;
      e.innerHTML = '<span class="dot ' + (state[st.id] ? state[st.id].v : '') + '"></span><span>' + esc(st.title) + '</span>';
      if(!visible(st)) e.style.display = 'none';
      e.onclick = function(){ go(gi); };
      box.appendChild(e);
    });
    d.querySelector('.sech').onclick = function(){ d.classList.toggle('open'); };
    if(sec.steps.indexOf(STEPS[cur]) >= 0) d.classList.add('open');
    rail.appendChild(d);
  });
}
function visible(st){
  var r = state[st.id];
  if(filter === 'all') return true;
  if(filter === 'todo') return !r || !r.v;
  return r && (r.v === 'wrong' || r.v === 'miss' || r.v === 'extra');
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

/* --- panes --- */
function render(){
  var st = STEPS[cur], sec = st.sec, r = rec(st.id);
  var dp = document.getElementById('docpane');
  dp.scrollTop = 0;
  dp.innerHTML = '<div class="stephead"><div class="kicker">Section ' + esc(sec.num) + ' · ' + esc(sec.title) + '</div>' +
                 '<h1>' + esc(st.title) + '</h1></div><div class="doc">' + st.html + '</div>';

  document.querySelectorAll('.vb').forEach(function(b){
    b.classList.toggle('on', b.dataset.v === r.v);
  });

  var nb = document.getElementById('nbody');
  var cmdHtml = '';
  if(st.cmds && st.cmds.length){
    cmdHtml = '<div class="lbl">Commands in this step <span>' +
      st.cmds.filter(function(_,i){ return r.done[i]; }).length + ' / ' + st.cmds.length + ' run</span></div><div class="cmds">' +
      st.cmds.map(function(c,i){
        var id = 'c' + i;
        return '<div class="cmd-row"><input type="checkbox" id="' + id + '" data-ci="' + i + '"' +
               (r.done[i] ? ' checked' : '') + '><label for="' + id + '">' + esc(c) + '</label></div>';
      }).join('') + '</div>';
  }
  nb.innerHTML = cmdHtml +
    '<div class="field"><div class="lbl">What actually happened <span>step ' + (cur+1) + ' of ' + STEPS.length + '</span></div>' +
    '<textarea id="note" rows="9" placeholder="Only fill this in where the doc and the real install disagree.&#10;&#10;e.g. installer also asked for the MQTT broker address — not in the doc&#10;e.g. path is /opt/evcc now, doc says /etc/evcc">' + esc(r.note) + '</textarea></div>' +
    '<div class="field"><div class="lbl">Anything else, anywhere <span>global</span></div>' +
    '<textarea id="extra" class="mono" rows="4" placeholder="Notes that do not belong to one step">' + esc(extraNote) + '</textarea></div>';

  var note = document.getElementById('note');
  note.oninput = function(){ r.note = note.value; save(); };
  var ex = document.getElementById('extra');
  ex.oninput = function(){ extraNote = ex.value; save(); };
  nb.querySelectorAll('.cmd-row input').forEach(function(cb){
    cb.onchange = function(){ r.done[cb.dataset.ci] = cb.checked; save(); render(); };
  });

  document.querySelectorAll('.step').forEach(function(e){
    e.classList.toggle('cur', +e.dataset.i === cur);
  });
  progress();
}
function progress(){
  var done = STEPS.filter(function(s){ return state[s.id] && state[s.id].v; }).length;
  document.getElementById('count').textContent = done + ' / ' + STEPS.length;
  document.getElementById('barfill').style.width = (done / STEPS.length * 100) + '%';
}
function go(i){
  if(i < 0 || i >= STEPS.length) return;
  cur = i; buildRail(); render();
  var el = document.querySelector('.step.cur');
  if(el) el.scrollIntoView({block:'nearest'});
}
function nextVisible(dir){
  var i = cur + dir;
  while(i >= 0 && i < STEPS.length){
    if(visible(STEPS[i])) return i;
    i += dir;
  }
  return cur;
}
function setV(v){
  var r = rec(STEPS[cur].id);
  r.v = (r.v === v ? '' : v);
  save(); buildRail(); render();
}

/* --- export --- */
function build(){
  var L = [];
  L.push('# Install review — Solar Surplus rev. 2026-08-23 (fresh Pi, manual walkthrough)');
  L.push('');
  var touched = STEPS.filter(function(s){
    var r = state[s.id];
    return r && (r.v && r.v !== 'ok' || (r.note || '').trim());
  });
  var okc = STEPS.filter(function(s){ return state[s.id] && state[s.id].v === 'ok'; }).length;
  // "matches" plus a note is an annotation, not a change request.
  var flagged = STEPS.filter(function(s){
    var r = state[s.id]; return r && r.v && r.v !== 'ok';
  }).length;
  var annotated = touched.length - flagged;
  var bits = [okc + ' confirmed correct', flagged + ' need changes'];
  if(annotated > 0){ bits.push(annotated + ' annotated'); }
  L.push('Reviewed ' + STEPS.filter(function(s){ return state[s.id] && state[s.id].v; }).length +
         ' of ' + STEPS.length + ' steps · ' + bits.join(' · '));
  L.push('');
  var lastSec = null;
  var VN = {ok:'MATCHES', wrong:'WRONG', miss:'MISSING', extra:'OBSOLETE', '':'NOTE'};
  touched.forEach(function(s){
    var r = state[s.id];
    if(s.sec !== lastSec){ lastSec = s.sec; L.push('## Section ' + s.sec.num + ' — ' + s.sec.title); L.push(''); }
    L.push('### ' + s.title + '  [' + VN[r.v] + ']');
    if((r.note || '').trim()) L.push(r.note.trim());
    L.push('');
  });
  if(!touched.length){ L.push('_No discrepancies flagged._'); L.push(''); }
  if((extraNote || '').trim()){
    L.push('## Other notes'); L.push(''); L.push(extraNote.trim()); L.push('');
  }
  var ok = STEPS.filter(function(s){ return state[s.id] && state[s.id].v === 'ok'; });
  if(ok.length){
    L.push('## Confirmed correct as written');
    L.push(ok.map(function(s){ return s.sec.num + '·' + s.title; }).join(' · '));
  }
  return L.join('\n');
}
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 1800);
}

/* --- wiring --- */
document.querySelectorAll('.vb').forEach(function(b){
  b.onclick = function(){ setV(b.dataset.v); };
});
document.querySelectorAll('.chip').forEach(function(c){
  c.onclick = function(){
    filter = c.dataset.f;
    document.querySelectorAll('.chip').forEach(function(x){ x.classList.toggle('on', x === c); });
    buildRail();
  };
});
document.getElementById('btnnext').onclick = function(){ go(nextVisible(1)); };
document.getElementById('btncopy').onclick = function(){
  var txt = build();
  document.getElementById('out').textContent = txt;
  document.getElementById('modsub').textContent = txt.length + ' characters';
  document.getElementById('veil').classList.add('on');
};
document.getElementById('btnclose').onclick = function(){ document.getElementById('veil').classList.remove('on'); };
document.getElementById('veil').onclick = function(e){ if(e.target.id === 'veil') this.classList.remove('on'); };
document.getElementById('btnclip').onclick = function(){
  var txt = document.getElementById('out').textContent;
  var done = function(){ toast('Copied — paste it into the chat'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else fallback();
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Select the text and copy manually'); }
    document.body.removeChild(ta);
  }
};
document.getElementById('btnlink').onclick = function(){
  if(!window.showSaveFilePicker){
    alert('This browser has no File System Access API, so the page cannot write into the Pi folder.\n\n' +
          'Use Chrome or Edge, or keep using “Copy review”.');
    return;
  }
  window.showSaveFilePicker({
    suggestedName: 'install-review-notes.json',
    types: [{description:'Review notes', accept:{'application/json':['.json']}}]
  }).then(function(h){
    rememberHandle(h);
    adopt(h, true);
    writeFile();
  }).catch(function(err){
    if(err && err.name === 'AbortError') return;
    status('err', 'could not link — ' + (err && err.name || 'error'));
    alert('The browser refused to open the file picker.\n\n' +
          'Pages opened straight from disk (file://) are often blocked from writing files.\n' +
          'Run  python -m http.server 8765  inside the Pi folder and open\n' +
          'http://localhost:8765/install-review.html  instead — autosave works there.');
  });
};
document.getElementById('btnreset').onclick = function(){
  if(!confirm('Clear every verdict and note?')) return;
  state = {}; extraNote = ''; save(); buildRail(); render();
};
document.addEventListener('keydown', function(e){
  var typing = /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); go(nextVisible(1)); return; }
  if(e.key === 'Escape') document.getElementById('veil').classList.remove('on');
  if(typing) return;
  if(e.key === 'j' || e.key === 'ArrowDown'){ e.preventDefault(); go(nextVisible(1)); }
  if(e.key === 'k' || e.key === 'ArrowUp'){ e.preventDefault(); go(nextVisible(-1)); }
  if(e.key >= '1' && e.key <= '4') setV(['ok','wrong','miss','extra'][+e.key - 1]);
});

/* --- resizable notes pane --- */
(function(){
  var g = document.getElementById('grab'), n = document.querySelector('.notes'), drag = false;
  g.onmousedown = function(e){ drag = true; e.preventDefault(); document.body.style.cursor = 'col-resize'; };
  document.addEventListener('mousemove', function(e){
    if(!drag) return;
    var w = Math.min(Math.max(window.innerWidth - e.clientX, 300), 760);
    n.style.flexBasis = w + 'px';
  });
  document.addEventListener('mouseup', function(){ drag = false; document.body.style.cursor = ''; });
})();

document.getElementById('btndl').onclick = function(){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(snapshot(), null, 2)], {type:'application/json'}));
  a.download = 'install-review-notes.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('Downloaded — move it into the Pi folder');
};
window.addEventListener('beforeunload', function(){ if(fileHandle) writeFile(); });

load(); buildRail(); render(); recallHandle();
})();
</script>
</body>
