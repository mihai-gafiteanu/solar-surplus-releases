<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar Surplus rev. 2026-08-23 — install review desk</title>
<style>
/* ===== shell ===== */
:root{
  --ink:#0f1216; --body:#2c333c; --muted:#69727e; --faint:#98a1ad;
  --rule:#e3e7ec; --soft:#f0f3f6; --bg:#fff; --panel:#f8f9fb;
  --accent:#b45309; --accent-soft:#fdf6ec;
  --ok:#15803d; --ok-soft:#eef8f1;
  --wrong:#b91c1c; --wrong-soft:#fdf2f1;
  --miss:#a16207; --miss-soft:#fdf8ec;
  --extra:#1d4ed8; --extra-soft:#f1f5fd;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--body);background:var(--bg);font-size:15px;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ===== top bar ===== */
.top{display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;flex:0 0 auto;
  border-bottom:1px solid var(--rule);background:var(--bg);z-index:5}
.brand{font-weight:700;color:var(--ink);font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.brand .v{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:4px;background:var(--accent);
  color:#fff;font-size:11px;font-weight:700;vertical-align:1px}
.bar{flex:1;height:5px;border-radius:3px;background:var(--soft);overflow:hidden;max-width:260px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok);width:0;transition:width .25s}
.count{font:600 12px/1 var(--mono);color:var(--muted);white-space:nowrap}
.filters{display:flex;gap:4px;margin-left:auto}
.savest{font:600 11px/1.3 var(--mono);color:var(--faint);white-space:nowrap}
.savest.live{color:var(--ok)}
.savest.err{color:var(--wrong)}
.chip{border:1px solid var(--rule);background:var(--bg);color:var(--muted);border-radius:999px;
  padding:5px 12px;font:600 11.5px/1 var(--sans);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--faint)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:6px;
  padding:7px 13px;font:600 12px/1 var(--sans);cursor:pointer}
.btn:hover{border-color:var(--faint);background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#96450a;border-color:#96450a}

/* ===== columns ===== */
.cols{flex:1;display:flex;min-height:0}
aside{flex:0 0 252px;border-right:1px solid var(--rule);overflow-y:auto;background:var(--panel);padding:10px 0 60px}
.sec{margin:0 0 2px}
.sech{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 13px;cursor:pointer;user-select:none}
.sech:hover{background:var(--soft)}
.sech .n{font:700 10.5px/1 var(--mono);color:var(--faint);min-width:17px}
.sech .t{font:600 12.4px/1.35 var(--sans);color:var(--ink);flex:1}
.sech .pips{display:flex;gap:2px}
.pip{width:5px;height:5px;border-radius:50%;background:#cfd6de}
.pip.ok{background:var(--ok)}.pip.wrong{background:var(--wrong)}
.pip.miss{background:var(--miss)}.pip.extra{background:var(--extra)}
.steps{display:none;padding:0 0 6px}
.sec.open .steps{display:block}
.step{display:flex;align-items:flex-start;gap:8px;padding:5px 12px 5px 32px;cursor:pointer;
  font-size:12.4px;line-height:1.4;color:var(--muted);border-left:2px solid transparent}
.step:hover{color:var(--ink);background:var(--soft)}
.step.cur{background:var(--bg);color:var(--ink);font-weight:600;border-left-color:var(--accent)}
.step .dot{width:6px;height:6px;border-radius:50%;background:#cfd6de;margin-top:5px;flex:0 0 auto}
.step .dot.ok{background:var(--ok)}.step .dot.wrong{background:var(--wrong)}
.step .dot.miss{background:var(--miss)}.step .dot.extra{background:var(--extra)}

/* doc pane */
#docpane{flex:1;min-width:0;overflow-y:auto;padding:26px 34px 120px;background:var(--bg)}
#docpane .stephead{margin:0 0 20px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
#docpane .stephead .kicker{font:700 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:9px}
#docpane .stephead h1{margin:0;font-size:25px;line-height:1.2;letter-spacing:-.015em;color:var(--ink);font-weight:650}
#docpane .doc{max-width:760px}
#docpane .imgstub{margin:14px 0;padding:11px 14px;border:1px dashed var(--rule);border-radius:6px;
  background:var(--panel);font:600 11.5px/1.4 var(--mono);color:var(--faint)}
#docpane figure{margin:16px 0}

/* notes pane */
.notes{flex:0 0 408px;border-left:1px solid var(--rule);display:flex;flex-direction:column;
  background:var(--panel);min-width:0}
.grab{flex:0 0 5px;cursor:col-resize;background:transparent;margin-right:-5px;z-index:3}
.grab:hover{background:var(--accent-soft)}
.nhead{padding:14px 16px 12px;border-bottom:1px solid var(--rule);background:var(--bg)}
.nhead .lbl{font:700 10px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.verdicts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vb{border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:8px 9px;cursor:pointer;
  text-align:left;font:600 12px/1.25 var(--sans);color:var(--body);display:flex;align-items:center;gap:7px}
.vb .mk{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:#cfd6de}
.vb:hover{border-color:var(--faint)}
.vb small{display:block;font-weight:400;font-size:10.5px;color:var(--faint);margin-top:2px}
.vb[data-v=ok] .mk{background:var(--ok)}.vb[data-v=wrong] .mk{background:var(--wrong)}
.vb[data-v=miss] .mk{background:var(--miss)}.vb[data-v=extra] .mk{background:var(--extra)}
.vb.on[data-v=ok]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.vb.on[data-v=wrong]{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong)}
.vb.on[data-v=miss]{background:var(--miss-soft);border-color:var(--miss);color:var(--miss)}
.vb.on[data-v=extra]{background:var(--extra-soft);border-color:var(--extra);color:var(--extra)}
.nbody{flex:1;overflow-y:auto;padding:14px 16px 40px}
.nbody .lbl{font:700 10px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--faint);
  margin:0 0 7px;display:flex;justify-content:space-between;align-items:baseline}
.nbody .lbl span{font:400 10px/1 var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
textarea{width:100%;border:1px solid var(--rule);border-radius:6px;padding:10px 11px;font:13.2px/1.55 var(--sans);
  color:var(--ink);background:var(--bg);resize:vertical;outline:none}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.mono{font:12.4px/1.55 var(--mono)}
.field{margin-bottom:16px}
.cmds{border:1px solid var(--rule);border-radius:6px;background:var(--bg);padding:4px 0;margin-bottom:16px}
.cmd-row{display:flex;gap:8px;align-items:flex-start;padding:5px 11px;font:12px/1.45 var(--mono);color:var(--body)}
.cmd-row:hover{background:var(--panel)}
.cmd-row input{margin:3px 0 0;flex:0 0 auto;accent-color:var(--ok)}
.cmd-row label{flex:1;cursor:pointer;word-break:break-all}
.cmd-row input:checked + label{color:var(--faint);text-decoration:line-through}
.nfoot{flex:0 0 auto;border-top:1px solid var(--rule);background:var(--bg);padding:10px 16px;
  display:flex;gap:8px;align-items:center}
.nfoot .hint{font:11px/1.3 var(--sans);color:var(--faint);flex:1}
kbd{font:600 10.5px/1 var(--mono);background:var(--soft);border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:2px 4px;color:var(--muted)}

/* modal */
.veil{position:fixed;inset:0;background:rgba(15,18,22,.42);display:none;align-items:center;justify-content:center;z-index:20}
.veil.on{display:flex}
.modal{background:var(--bg);border-radius:10px;width:min(760px,92vw);max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(15,18,22,.24)}
.modal h2{margin:0;padding:16px 20px 14px;font-size:15px;color:var(--ink);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px}
.modal h2 .sub{font-weight:400;font-size:12.5px;color:var(--faint)}
.modal .out{flex:1;overflow:auto;margin:0;padding:16px 20px;font:12.2px/1.6 var(--mono);color:var(--body);
  white-space:pre-wrap;background:var(--panel)}
.modal .acts{padding:12px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:7px;font:600 12.5px/1 var(--sans);opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1180px){aside{flex-basis:210px}.notes{flex-basis:340px}}
/* ===== original document css, scoped to #docpane ===== */
:root{
  --ink:#15181c; --body:#2c333c; --muted:#69727e; --faint:#8b95a1;
  --rule:#e2e6ea; --rule-soft:#eef1f4; --bg:#ffffff; --panel:#f7f8fa;
  --accent:#b45309; --accent-soft:#fdf6ec; --accent-line:#e8c99a;
  --green:#15803d; --green-soft:#f0f8f2; --green-line:#bfdfc9;
  --blue:#1d4ed8; --blue-soft:#f2f5fd; --blue-line:#c4d2f4;
  --red:#b91c1c; --red-soft:#fdf3f2; --red-line:#eec7c4;
  --code-bg:#14171c; --code-ink:#dbe1e8; --code-dim:#7f8b99;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
#docpane{-webkit-text-size-adjust:100%}
#docpane{
  margin:0; background:var(--bg); color:var(--body);
  font-family:var(--sans); font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
#docpane a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-line)}
#docpane a:hover{border-bottom-color:var(--accent)}
#docpane .wrap{display:block}
#docpane nav.toc{
  position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
  padding:38px 26px 60px 30px; border-right:1px solid var(--rule); background:var(--bg);
}
#docpane nav.toc .tocmark{font:600 10.5px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-bottom:16px}
#docpane nav.toc ol{list-style:none; margin:0; padding:0}
#docpane nav.toc li{margin:0}
#docpane nav.toc a{
  display:flex; gap:9px; padding:4.5px 0; font-size:13.2px; line-height:1.55;
  color:var(--muted); border:0; border-left:2px solid transparent; padding-left:9px; margin-left:-11px;
}
#docpane nav.toc a .n{color:var(--faint); font:600 11px/1.5 var(--mono); min-width:19px; letter-spacing:-.02em}
#docpane nav.toc a:hover{color:var(--ink)}
#docpane nav.toc a.active{color:var(--ink); font-weight:600; border-left-color:var(--accent)}
#docpane nav.toc a.active .n{color:var(--accent)}
#docpane nav.toc .grp{font:600 10.5px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin:20px 0 8px; padding-left:9px}
#docpane main{padding:0 0 120px; min-width:0}
#docpane .col{max-width:790px; padding:0 56px}
#docpane header.cover{padding:74px 56px 44px; border-bottom:1px solid var(--rule); max-width:790px}
#docpane .eyebrow{font:600 11px/1 var(--sans); letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-bottom:26px}
#docpane .eyebrow .ver{
  display:inline-block; margin-left:12px; padding:4px 12px 4px 11px;
  font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:none;
  color:#fff; background:var(--accent); border:1px solid var(--accent);
  border-radius:5px; vertical-align:-2px;
}
@media (max-width:560px){#docpane header.cover .eyebrow{line-height:1.9}}
#docpane h1.title{
  font-family:var(--serif); font-weight:600; font-size:46px; line-height:1.08;
  letter-spacing:-.018em; color:var(--ink); margin:0 0 20px;
}
#docpane h1.title em{font-style:italic; color:var(--accent)}
#docpane .standfirst{font-size:19px; line-height:1.58; color:var(--muted); max-width:640px; margin:0 0 34px}
#docpane .keyfacts{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:7px; overflow:hidden; max-width:660px}
#docpane .keyfacts div{background:var(--bg); padding:13px 15px}
#docpane .keyfacts dt{font:600 10px/1 var(--sans); letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin-bottom:6px}
#docpane .keyfacts dd{margin:0; font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.35}
#docpane .keyfacts dd small{display:block; font-weight:400; font-size:12.5px; color:var(--muted); margin-top:2px}
#docpane h2{
  font-family:var(--serif); font-weight:600; font-size:30px; line-height:1.16; letter-spacing:-.015em;
  color:var(--ink); margin:74px 0 6px; scroll-margin-top:24px;
}
#docpane h2 .sn{
  display:block; font:600 11px/1 var(--sans); letter-spacing:.19em; text-transform:uppercase;
  color:var(--accent); margin-bottom:11px;
}
#docpane h2 + .lede{font-size:17.5px; color:var(--muted); margin:0 0 26px; line-height:1.55}
#docpane h3{font-size:17px; font-weight:650; color:var(--ink); margin:38px 0 10px; letter-spacing:-.005em; scroll-margin-top:24px}
#docpane h4{font-size:14px; font-weight:650; color:var(--ink); margin:26px 0 8px; letter-spacing:.005em}
#docpane p{margin:0 0 15px}
#docpane ul, #docpane ol{margin:0 0 16px; padding-left:22px}
#docpane li{margin:0 0 7px}
#docpane li::marker{color:var(--faint)}
#docpane hr.sep{border:0; border-top:1px solid var(--rule); margin:56px 0}
#docpane strong{color:var(--ink); font-weight:650}
#docpane .small{font-size:14px; color:var(--muted)}
#docpane .cmd{margin:20px 0; border-radius:8px; overflow:hidden; border:1px solid #23282f}
#docpane .cmd .lbl{
  background:#1b1f26; color:var(--code-dim); font:500 11px/1 var(--mono);
  letter-spacing:.07em; text-transform:uppercase; padding:9px 14px; border-bottom:1px solid #262c34;
  display:flex; justify-content:space-between; align-items:center; gap:12px;
}
#docpane .cmd .lbl .path{text-transform:none; letter-spacing:0; color:#9aa6b4; font-size:11.5px}
#docpane .cmd pre{
  margin:0; background:var(--code-bg); color:var(--code-ink); padding:15px 16px;
  font:400 13px/1.65 var(--mono); overflow-x:auto; white-space:pre;
}
#docpane .cmd pre .c{color:#6f7c8b; font-style:italic}
#docpane .cmd pre .k{color:#e5a45b}
#docpane .cmd pre .s{color:#8fbf7f}
#docpane .cmd pre .v{color:#7fb2e5}
#docpane code{font:400 .875em/1.4 var(--mono); background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:1.5px 5px; color:#3b444f; white-space:nowrap}
#docpane h3 code, #docpane h4 code, #docpane td code{font-size:.87em}
#docpane .pass{
  margin:-12px 0 22px; padding:9px 14px 9px 13px; background:var(--green-soft);
  border:1px solid var(--green-line); border-top:0; border-radius:0 0 8px 8px;
  font-size:14px; color:#1a5e33;
}
#docpane .pass b{color:var(--green); font-weight:650}
#docpane .note{border:1px solid var(--rule); border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 7px 7px 0; padding:15px 18px; margin:24px 0; font-size:14.8px; line-height:1.56}
#docpane .note.blue{border-left-color:var(--blue); background:var(--blue-soft); border-color:var(--blue-line); border-left-width:3px}
#docpane .note.green{border-left-color:var(--green); background:var(--green-soft); border-color:var(--green-line); border-left-width:3px}
#docpane .note.red{border-left-color:var(--red); background:var(--red-soft); border-color:var(--red-line); border-left-width:3px}
#docpane .note .h{display:block; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:5px; letter-spacing:.005em}
#docpane .note p:last-child, #docpane .note ul:last-child{margin-bottom:0}
#docpane .tw{margin:24px 0; overflow-x:auto; border:1px solid var(--rule); border-radius:8px}
#docpane table{width:100%; border-collapse:collapse; font-size:14.2px}
#docpane caption{caption-side:top; text-align:left; font:600 11px/1.4 var(--sans); letter-spacing:.11em; text-transform:uppercase; color:var(--faint); padding:12px 15px 10px; border-bottom:1px solid var(--rule-soft)}
#docpane th{text-align:left; font-weight:650; color:var(--ink); font-size:12.5px; letter-spacing:.02em; padding:10px 15px; background:var(--panel); border-bottom:1px solid var(--rule)}
#docpane td{padding:10px 15px; border-bottom:1px solid var(--rule-soft); vertical-align:top; color:var(--body)}
#docpane tr:last-child td{border-bottom:0}
#docpane td.num, #docpane th.num{text-align:right; font-variant-numeric:tabular-nums}
#docpane td b{color:var(--ink)}
#docpane .tag{display:inline-block; font:600 10.5px/1.5 var(--sans); letter-spacing:.06em; text-transform:uppercase; padding:1px 7px; border-radius:20px; white-space:nowrap}
#docpane .tag.g{background:var(--green-soft); color:var(--green); border:1px solid var(--green-line)}
#docpane .tag.a{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line)}
#docpane .tag.b{background:var(--blue-soft); color:var(--blue); border:1px solid var(--blue-line)}
#docpane .tag.r{background:var(--red-soft); color:var(--red); border:1px solid var(--red-line)}
#docpane .tag.n{background:var(--panel); color:var(--muted); border:1px solid var(--rule)}
#docpane figure{margin:30px 0}
#docpane figure img{display:block; max-width:100%; height:auto; border:1px solid var(--rule); border-radius:7px}
#docpane figcaption{font-size:13.5px; color:var(--muted); margin-top:11px; line-height:1.5}
#docpane figcaption b{color:var(--ink); font-weight:650}
#docpane figure.shot{margin:28px 0; padding:20px 20px 18px; background:var(--panel); border:1px solid var(--rule); border-radius:9px}
#docpane figure.shot img{max-width:min(392px,100%); margin:0 auto; border-radius:5px; box-shadow:0 1px 3px rgba(20,25,32,.09), 0 6px 18px rgba(20,25,32,.06)}
#docpane figure.shot.wide img{max-width:min(392px,100%)}
#docpane .figrow figure.shot{padding:14px 14px 12px}
#docpane .figrow figure.shot figcaption{margin-top:12px}
#docpane figure.shot figcaption{margin-top:16px; text-align:center; max-width:560px; margin-left:auto; margin-right:auto}
#docpane figure.photo img{border:0; box-shadow:0 1px 3px rgba(20,25,32,.12), 0 10px 30px rgba(20,25,32,.10); border-radius:8px}
#docpane .figrow{display:grid; grid-template-columns:1fr 1fr; gap:26px; margin:30px 0; align-items:start}
#docpane .figrow figure{margin:0}
#docpane .gallery{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin:28px 0}
#docpane .gallery figure{margin:0; display:flex; flex-direction:column}
#docpane .gallery img{width:100%; height:auto; background:#fff; border:1px solid var(--rule); border-radius:8px; display:block}
#docpane .gallery figcaption{margin-top:10px; font-size:12.8px; line-height:1.55}
#docpane .gallery figcaption b{display:block; font-size:13.5px; margin-bottom:2px}
#docpane .gallery .role{display:block; font:600 9.5px/1.6 var(--sans); letter-spacing:.13em; text-transform:uppercase; color:var(--accent); margin-bottom:3px}
#docpane .figwide{max-width:790px; padding:0 56px}
#docpane .figwide img{width:100%}
#docpane .cover figure{margin:34px 0 0; max-width:none}
#docpane .steps{counter-reset:st; list-style:none; padding:0; margin:20px 0}
#docpane .steps li{counter-increment:st; position:relative; padding-left:34px; margin-bottom:11px}
#docpane .steps li::before{

<script id="data" type="application/json">{"sections": [{"num": "01", "title": "The problem this system solves", "steps": [{"id": "s1", "title": "Overview", "html": "<p class=\"lede\">On a clear day the whole street exports at once. Voltage at the feed-in point climbs, and above a certain level the installation starts defending itself — by throwing away production, at precisely the hour the array makes the most of it.</p>\n\n<p>Two devices act, and once the voltage is there, neither asks. A third acts at none of these levels, but its rating gives the dashboard a second reference line.</p>\n\n<div class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Devices in the voltage path, and where each one acts</caption>\n<thead><tr><th scope=\"col\" style=\"width:31%\">Device</th><th scope=\"col\" style=\"width:21%\">Threshold or rating</th><th scope=\"col\">Consequence</th></tr></thead>\n<tbody>\n<tr><td><b>Fronius Symo GEN24 Plus</b><br><span class=\"small\">inverter over-voltage response</span></td><td><b>253&nbsp;V</b></td><td>The inverter curtails and stops. The threshold is a technician-level setting — the customer role cannot see or change it.</td></tr>\n<tr><td><b>DigiTOP V-PRO-3F63A</b><br><span class=\"small\">three-phase voltage relay in the board</span></td><td><b>257&nbsp;V</b><br><span class=\"small\">over-voltage cut-off</span></td><td>Physically disconnects the house to protect the equipment behind it. The only device in the installation that can open the circuit, and the only one of the three whose threshold is set on the device itself.</td></tr>\n<tr><td><b>ETITEC V T2 surge arresters</b><br><span class=\"small\">on the incoming busbars, reference only</span></td><td><span class=\"small\">stamped 255/20</span></td><td>Does not act at these levels: 255&nbsp;V is U<sub>c</sub>, the highest voltage it can sit at continuously, and 20&nbsp;kA its nominal discharge current — neither is a trip point. The dashboard draws it as a thin grey dotted line at 255&nbsp;V, just above the red line at the 253&nbsp;V curtailment point, so both are visible on one chart.</td></tr>\n</tbody>\n</table>\n</div>\n\n<p>Three thresholds, four volts apart, and only the top one opens the circuit.</p>\n\n<p>Before this build, the feed-in point regularly passed 253&nbsp;V around 13:00 — the street goes on rising after this inverter has taken itself off it. Every one of those excursions was production lost for good. The DigiTOP was installed together with the Wall Connector and was first set at 253&nbsp;V, then at 255&nbsp;V. The relay opened at least ten times a day and took the house with it. 257&nbsp;V is the current setting, found by trial and error, and the voltage has not passed 255&nbsp;V since.</p>", "cmds": []}, {"id": "s2", "title": "The lever", "html": "<p>Voltage at the feed-in point rises with exported power. Anything consumed on site never reaches the street, so local consumption at midday pulls the voltage back down &mdash; and in a house like this one there is a single load big enough to matter. A battery would be the other way to absorb it; the car is the larger sink, it is on the driveway through the working day, and needs to be charged anyway. Why not for free?</p>\n\n<div class=\"note green\">\n  <span class=\"h\">The design goal, stated plainly</span>\n  <p>Absorb the surplus exactly when the sun is strongest. The car now takes the whole surplus and a little from the grid on top of it, and the feed-in point stays below 250&nbsp;V instead of crossing 253&nbsp;V. Nothing trips, and nothing is curtailed. This is not tuned for the cheapest kilowatt-hour — it is tuned for the highest local consumption during the hours the grid is weakest.</p>\n</div>", "cmds": []}, {"id": "s3", "title": "What the site has done so far", "html": "<p>These are lifetime registers, read from the two Fronius meters.</p>\n\n<div class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Fronius meter registers</caption>\n<thead><tr><th scope=\"col\" style=\"width:30%\">Register</th><th scope=\"col\" style=\"width:40%\">Source</th><th scope=\"col\">Value</th></tr></thead>\n<tbody>\n<tr><td>Lifetime PV yield</td><td>Solar meter — the inverter itself</td><td><b>16,264.9&nbsp;kWh</b></td></tr>\n<tr><td>Lifetime export</td><td>Grid meter — energy (reverse)</td><td><b>12,924.3&nbsp;kWh</b></td></tr>\n<tr><td>Lifetime import</td><td>Grid meter — energy</td><td><b>3,396.5&nbsp;kWh</b></td></tr>\n<tr><td>Export ÷ import</td><td><span class=\"small\">derived</span></td><td><b>3.81×</b></td></tr>\n</tbody>\n</table>\n</div>\n\n<p>Subtracting export from yield puts self-consumption at roughly 3,340&nbsp;kWh — about 20&nbsp;% of everything the array has produced. Both registers have run since the same commissioning date, so the subtraction is sound rather than indicative. Charging the car on surplus is the single lever that moves it.</p>", "cmds": []}]}, {"num": "02", "title": "Architecture", "steps": [{"id": "s4", "title": "Overview", "html": "<p class=\"lede\">Four devices, one local network, nothing external in the command path.</p>\n\n<p>In short: the inverter measures, the Pi decides, the car obeys. The charger just delivers power and reports what it sees; the car is what actually adjusts how much it draws, one amp at a time, over Bluetooth. Everything runs inside the house &mdash; no cloud account is in the loop, and the internet can be down while the car charges.</p>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Data and power. The Pi reads production and grid exchange from the inverter over Modbus, reads socket status from the Wall Connector over HTTP, and commands the car directly over Bluetooth LE.</div>", "cmds": []}, {"id": "s5", "title": "Why the fine control happens on the car", "html": "<p data-lvl=\"3\">A Gen&nbsp;3 Wall Connector cannot be told what current to deliver. It reports — power, per-phase current and voltage, contactor state — but the interface is read-only; the only current it modulates by itself is the share it negotiates inside a power-sharing group. All of the modulation has to be commanded on the vehicle, which is why the Bluetooth bridge is the centrepiece of the build rather than a convenience.</p>\n\n<p data-lvl=\"4\">Commanding the car also gets underneath the 6&nbsp;A floor IEC&nbsp;61851 puts on the pilot signal. At three phases and roughly 720&nbsp;W per amp, 6&nbsp;A means 4.3&nbsp;kW of surplus before charging could begin at all; the car accepts 1&nbsp;A, which drops the threshold to about 720&nbsp;W. Nothing signals 1&nbsp;A &mdash; the pilot still offers at least 6&nbsp;A and the car draws less than it is offered. This belongs to vehicle control in general rather than to Bluetooth: the fleet API reaches the same currents.</p>", "cmds": []}, {"id": "s6", "title": "Bluetooth or the fleet API", "html": "<p data-lvl=\"3\">Both routes command the car. They differ in what they cost, what they depend on, and who else is in the path.</p>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>The two control paths</caption>\n<thead><tr><th scope=\"col\" style=\"width:26%\"></th><th scope=\"col\" style=\"width:37%\">Bluetooth LE <span class=\"small\">this build</span></th><th scope=\"col\">Fleet API</th></tr></thead>\n<tbody>\n<tr><td><b>Runs on</b></td><td>The Pi, over BLE, 5–15&nbsp;m from the car</td><td>Tesla's servers, over the internet</td></tr>\n<tr><td><b>Needs</b></td><td>A paired key on the Pi</td><td>Developer account, app approval, OAuth client, access and refresh tokens</td></tr>\n<tr><td><b>Costs</b></td><td>Nothing</td><td>$10 monthly credit, then metered</td></tr>\n<tr><td><b>Works when the car is away</b></td><td>No</td><td>Yes</td></tr>\n<tr><td><b>Third party in the path</b></td><td>None</td><td>Tesla, plus a command proxy</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"4\" class=\"note green\">\n  <span class=\"h\">Why this build chose Bluetooth</span>\n  <p>The car is on the driveway, the Pi is a few metres away, and the one thing the fleet API offers — control from anywhere — is worth nothing here. Against that it wants an account, tokens, a public command proxy, an internet connection in the command path, and a meter that ticks every time the controller changes its mind. The controller changes its mind all day.</p>\n  <p>There is a second cost worth naming. A Tesla Wall Connector cannot control itself, so an internet-based setup needs a public command proxy to sign commands on the way through — another moving part, and a third party holding credentials to the car. The Bluetooth bridge <em>is</em> that proxy, running on the Pi, reachable by nobody outside the house.</p>\n</div>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Division of labour</caption>\n<thead><tr><th scope=\"col\" style=\"width:34%\">Component</th><th scope=\"col\">Responsibility</th></tr></thead>\n<tbody>\n<tr><td><b>Fronius Symo GEN24 Plus</b></td><td>Produces. Also the solar meter — evcc reads the inverter's own SunSpec unit for PV power.</td></tr>\n<tr><td><b>Fronius Smart Meter</b></td><td>Measures the grid exchange at the feed-in point. SunSpec unit 200, read through the inverter. This is the number Solar mode steers on.</td></tr>\n<tr><td><b>Tesla Wall Connector Gen&nbsp;3</b></td><td>Switches the contactor and meters the charge. Serves as both the charger and the loadpoint's energy meter.</td></tr>\n<tr><td><b>Raspberry Pi&nbsp;4</b></td><td>Runs everything: evcc, the BLE proxy, InfluxDB, Grafana and the custom scripts.</td></tr>\n<tr><td><b>Tesla Model&nbsp;3</b></td><td>Accepts the commanded current. The only device in the chain that can go below 6&nbsp;A.</td></tr>\n</tbody>\n</table>\n</div>", "cmds": []}]}, {"num": "03", "title": "The hardware", "steps": [{"id": "s7", "title": "Overview", "html": "<p class=\"lede\">The inverter, the charger, the board and the car appear elsewhere in this document. These three carry everything else — the control stack and the network it runs on.</p>\n\n<p>Three small purchases carry the whole control stack: a Raspberry Pi, a memory card for its system, and an ordinary USB disk for the measurement history. Everything else in this section is advice on where to put them.</p>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Controller Raspberry Pi 4 B Runs evcc, the BLE proxy, InfluxDB, Grafana and the custom scripts — the whole control and history stack, on 4–7 W. Needs the original USB-C supply, a case and a 16 GB or larger microSD card. Wired to the router; see section 07 .</div>\n<div class=\"imgstub\"><span class=\"k\">figure</span> Router ASUS TUF-BE6500 The single flat LAN everything lives on. The inverter and Wall Connector join its 2.4 GHz IoT SSID, which shares that one flat subnet because the wired Pi has to reach both. Its admin page is where the three DHCP reservations are set.</div>\n<div class=\"imgstub\"><span class=\"k\">figure</span> Range extender ASUS wall-plug repeater Carries 2.4 GHz coverage out to the equipment on the exterior wall.</div>", "cmds": []}, {"id": "s8", "title": "The full list, before touching anything", "html": "<ol data-lvl=\"2\" class=\"steps\">\n<li>A Raspberry Pi&nbsp;4&nbsp;B, its original USB-C power supply, and a microSD card of 16&nbsp;GB or more</li>\n<li>A USB disk for the history &mdash; any size, and an old spinning drive is fine. See the note below before you buy one</li>\n<li>A laptop with Raspberry Pi Imager installed, and WinSCP or any SCP client</li>\n<li>A Fronius GEN24 inverter on the same network, with a Smart Meter at the feed-in point read through it</li>\n<li>A Tesla Wall Connector Gen&nbsp;3 and the QR-code card that shipped with it</li>\n<li>The car's NFC key card — the physical card, not the phone key</li>\n<li>The inverter's Customer password, or owner access to Fronius Solar.web to reset it</li>\n<li>A router with 2.4&nbsp;GHz Wi-Fi and access to its admin page for DHCP reservations</li>\n<li>An Ethernet cable from the Pi to the router — the Pi runs wired; see <a href=\"#s07\">section 07</a></li>\n<li>A Wi-Fi range extender, if the inverter or Wall Connector sits beyond reliable 2.4&nbsp;GHz coverage</li>\n</ol>\n\n<div data-lvl=\"2\" class=\"note\">\n  <span class=\"h\">Distance matters</span>\n  <p>The Pi has to sit within Bluetooth range of the car — realistically 5–15&nbsp;m, through no more than one wall. Next to the router is ideal if the router is already near the car.</p>\n</div>\n\n<div data-lvl=\"4\" class=\"note blue\">\n  <span class=\"h\">Why the history does not live on the card</span>\n  <p>InfluxDB keeps every point for ever &mdash; that is <code>RETENTION=0</code> in <a href=\"#s13\">section 13</a>, and it is deliberate, because the whole argument in <a href=\"#s01\">section 01</a> is about what the voltage did over months rather than this afternoon. The voltage logger writes three points every 15&nbsp;seconds, and InfluxDB rewrites its own files behind that. A microSD card is a device with a finite number of writes and no wear-levelling worth the name, and this is the one workload in the build that will find that limit.</p>\n  <p>So InfluxDB&rsquo;s two volumes go on a USB disk and nothing else does. <b>An old 2.5&rdquo; or 3.5&rdquo; drive you already own is the right answer here</b> &mdash; the database is a few gigabytes a year and it is written in a steady trickle, so neither capacity nor speed is the constraint. Two things about old drives are worth knowing before you plug one in: a 3.5&rdquo; drive needs its own mains power supply and must not be run off the Pi&rsquo;s USB ports, and a bus-powered 2.5&rdquo; drive on a Pi&nbsp;4 is at the edge of what the port can deliver &mdash; if the Pi reboots when the drive spins up, that is why, and a powered hub fixes it.</p>\n  <p>Everything else stays on the card: Docker&rsquo;s images, Grafana&rsquo;s own volume, evcc&rsquo;s database, every file in <a href=\"#s17\">section 17</a>. Grafana writes to its volume when you change a board, not once a second, and moving it would put the dashboard behind a disk that may be asleep for no gain at all.</p>\n  <p><b>Put it in a black port, not a blue one.</b> SuperSpeed USB radiates broadband noise straight across 2.4&nbsp;GHz &mdash; Intel documented it in 2012 and every USB&nbsp;3 enclosure since has done it to some degree. On most machines that is a curiosity. Here it is the band the Pi talks to the car on, and a drive lying on the board with an unshielded cable is close to the worst case for it. The USB&nbsp;2 ports give 480&nbsp;Mbit/s, which is hundreds of times more than two loggers writing a handful of points every 15&nbsp;seconds will ever ask for, so the trade costs you nothing at all. The installer&rsquo;s <code>storage</code> step reads the link speed back and says so if the disk ended up on a blue one. Route the cable away from the board while you are there, and see <a href=\"#s10\">section 10</a> if pairing is already misbehaving.</p>\n  <p><b>Measured, on the disk this build uses.</b> A 500&nbsp;GB USB drive in a Gembird 2.5&rdquo; USB&nbsp;3.0 enclosure &mdash; the kind that has been in a drawer for a decade. The kernel reports it as 465.8&nbsp;GiB, and after one ext4 partition with the root reserve dropped it offers <b>491.1&nbsp;GB usable</b>. Keeping the default 5% reserve would have set aside about 24.6&nbsp;GB for a root filesystem that will never live there. At the rate the two loggers write, capacity is not the number that will ever run out on this disk.</p>\n</div>\n\n<hr data-lvl=\"2\" class=\"sep\">\n\n<div data-lvl=\"2\" style=\"margin:56px 0 10px\">\n  <div class=\"eyebrow\" style=\"margin-bottom:14px\">The build, in order</div>\n  <p class=\"small\" style=\"max-width:620px\">Sections 04 to 11 are the sequence, and it is sorted by what each step needs rather than by where the work ends up. The two devices configured through a browser come first: the inverter is a web form and the Wall Connector a phone app, both done from the Windows laptop you are reading this on, with no Pi in the building and every check answered from that laptop. The board and the addressing follow, because both are settled before anything is plugged in. Then the card and the installer, by which time the two interfaces the installer probes are already answering. Only the car is left after it, because pairing needs a key card and a driver&rsquo;s seat. Each section carries the check that proves it rather than the appearance that suggests it.</p>\n</div>", "cmds": []}]}, {"num": "04", "title": "The inverter", "steps": [{"id": "s9", "title": "Overview", "html": "<p class=\"lede\">Two interfaces to switch on: Modbus for evcc, the Solar API for the voltage readings that feed the dashboard. Both are a web form in the inverter, reached from a browser on the home network, so this is done before the Pi is built rather than after — and the installer, when it runs, finds them already answering.</p>\n\n<p>The inverter has two switches to flip in its own web page &mdash; one lets the Pi read the meters, the other exposes the voltages. Five minutes in a browser, done before the Pi even exists.</p>", "cmds": []}, {"id": "s10", "title": "If you do not have the Customer password", "html": "<p data-lvl=\"2\">No installer is needed. The registered system owner in Solar.web can reset it:</p>\n\n<ol data-lvl=\"2\" class=\"steps\">\n<li>Tap the optical sensor on the front of the inverter once — the right-hand LED flashes blue and the WLAN access point opens</li>\n<li>Open the inverter's web interface in a browser, from the home network, at its usual address</li>\n<li>Click <em>Forgot password?</em> for the Customer role — a PIN is generated</li>\n<li>Go to Fronius Solar.web → Settings → Components → Actions on the inverter → <em>Reset Customer Password</em></li>\n<li>Enter the PIN, take the recovery key, set the new password</li>\n</ol>\n\n<div data-lvl=\"3\" class=\"note\">\n  <span class=\"h\">Owner only</span>\n  <p>The function only appears to the account registered as owner of the system in Solar.web. The Technician password — the role that holds the 253&nbsp;V over-voltage setting — can be reset solely through the installer or Fronius support.</p>\n</div>", "cmds": []}, {"id": "s11", "title": "Modbus TCP — the data source for evcc", "html": "<p data-lvl=\"2\">In the inverter's interface: Communication → Modbus.</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Modbus TCP settings</caption>\n<thead><tr><th scope=\"col\" style=\"width:44%\">Setting</th><th scope=\"col\">Value</th></tr></thead>\n<tbody>\n<tr><td>Slave as Modbus TCP</td><td><b>enabled</b></td></tr>\n<tr><td>Port</td><td><b>502</b></td></tr>\n<tr><td>SunSpec model type</td><td><b>int + SF</b></td></tr>\n<tr><td>Meter address</td><td><b>200</b></td></tr>\n</tbody>\n</table>\n</div>\n\n<p data-lvl=\"2\">Save. The inverter may briefly report a stopped state — it is restarting its communication side and comes back on its own within a minute or two.</p>\n\n<div data-lvl=\"3\" class=\"note blue\">\n  <span class=\"h\">Two SunSpec units on one address</span>\n  <p>The inverter is always unit&nbsp;1; the Smart Meter is unit&nbsp;200. Both are reached at the same IP and port. That distinction is what lets one device serve as both the solar meter and the grid meter in <a href=\"#s11\">section 11</a> — and getting it right is the difference between a measured PV figure and a derived one.</p>\n</div>", "cmds": []}, {"id": "s12", "title": "Solar API — the voltage source for the logger", "html": "<p data-lvl=\"2\">Communication → Solar API → enabled. It coexists with Modbus without issue. Nothing here can be tested yet: both switches are proved from the Pi, which does not exist at this point in the build. <a href=\"#s09\">Section 09</a> runs those two checks as soon as there is a shell to run them from.</p>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Fronius Symo GEN24 Plus , wall-mounted outdoors with the DC rotary disconnector at the left. Power LED green, connectivity LED blue. Modbus TCP on 502, Solar API on 80.</div>", "cmds": []}]}, {"num": "05", "title": "The Wall Connector", "steps": [{"id": "s13", "title": "The Wall Connector", "html": "<p class=\"lede\">All it has to do is join the network; everything else is read locally.</p>\n\n<p>The charger only needs to join the home Wi-Fi, from the Tesla app, standing next to it. After that it is never configured again &mdash; it just reports what it sees.</p>\n\n<p data-lvl=\"2\">From the Tesla app: profile → Add product → Wall Connector, then scan the QR code from the quickstart card or the label on the side of the unit. The app connects over Bluetooth, so stand near the charger, then join it to the 2.4&nbsp;GHz Wi-Fi. Once connected, find it in the router's client list and reserve whatever address it picked up. The installer never asks for it and never records it — the Wall Connector belongs to evcc, and you enter this address once in evcc's browser configuration in <a href=\"#s11\">section 11</a>. Reserve it first so that what you type there stays true.</p>\n\n<div data-lvl=\"2\" class=\"cmd\">\n<div class=\"lbl\"><span>Browser</span></div>\n<pre>http://CHARGER_IP/api/1/vitals</pre>\n</div>\n\n<div data-lvl=\"2\" class=\"pass\"><b>Pass ·</b> JSON beginning <code>\"contactor_closed\":false,\"vehicle_connected\":false</code> — exactly right with nothing plugged in.</div>\n\n<p data-lvl=\"3\">The whole response is worth reading once, because it is the only view of the charger you get without a car attached, and three of its numbers are easy to misread later.</p>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Response</span><span class=\"path\">nothing plugged in</span></div>\n<pre>{\"contactor_closed\":false,\"vehicle_connected\":false,\"session_s\":0,\n \"grid_v\":225.2,\"grid_hz\":49.936,\"vehicle_current_a\":0.3,\n \"currentA_a\":0.3,\"currentB_a\":0.3,\"currentC_a\":0.3,\"currentN_a\":0.5,\n \"voltageA_v\":0.0,\"voltageB_v\":2.8,\"voltageC_v\":3.0,\"relay_coil_v\":12.0,\n \"pcba_temp_c\":37.0,\"handle_temp_c\":44.4,\"mcu_temp_c\":46.8,\n \"uptime_s\":587301,\"input_thermopile_uv\":-329,\"prox_v\":0.0,\n \"pilot_high_v\":12.0,\"pilot_low_v\":12.0,\"session_energy_wh\":702.500,\n \"config_status\":5,\"evse_state\":1,\"current_alerts\":[]}</pre>\n</div>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">Three numbers not to misread</span>\n  <p><b><code>grid_v</code> is not a second opinion on the inverter.</b> This charger reported 225.2&nbsp;V within a minute of the Solar API reporting 240.4&nbsp;V on L1 &mdash; fifteen volts apart, with the contactor open and no current flowing anywhere. Voltage drop needs load, and there was none, so that gap is not the cable: it is two devices measuring to different standards, and the Wall Connector&rsquo;s is the coarser. Nothing reads it. evcc regulates on surplus from the Smart Meter (<a href=\"#s12\">section 12</a>), and the dashboard&rsquo;s voltage panels come from grid-voltage-logger, which reads the Solar API. Treat the 225 as a rounding of &ldquo;mains is present&rdquo; and nothing more.</p>\n  <p><b>The 0.3&nbsp;A on every phase is not current.</b> With <code>contactor_closed:false</code> nothing is connected to the car at all; that is the noise floor of the measurement, and it reads the same whether the charger has been idle for a minute or a week. The near-zero <code>voltageA_v</code>, <code>voltageB_v</code> and <code>voltageC_v</code> are the same story from the other side &mdash; those are measured past the open contactor.</p>\n  <p><b><code>session_energy_wh</code> and <code>uptime_s</code> outlive the Pi.</b> 702.5&nbsp;Wh and 587,301&nbsp;seconds &mdash; just under seven days &mdash; on a charger that has never heard of this build. The Wall Connector keeps its own state and needs nothing from the rebuild, which is exactly why <a href=\"#s09\">section 09</a>&rsquo;s installer never asks for its address.</p>\n</div>\n\n<p data-lvl=\"3\"><code>evse_state</code> of 1 with an empty <code>current_alerts</code> is a charger sitting idle and healthy. That is the state to fetch this from again in <a href=\"#s15\">section 15</a>, after the car is paired, and watch <code>vehicle_connected</code> and <code>contactor_closed</code> turn true in that order.</p>", "cmds": ["http://CHARGER_IP/api/1/vitals"]}]}, {"num": "06", "title": "The distribution board", "steps": [{"id": "s14", "title": "The distribution board", "html": "<p class=\"lede\">An outdoor enclosure on the exterior wall, directly above the Wall Connector. Four rows, with the instruments in the bottom compartment.</p>\n\n<p>The electrician&rsquo;s cabinet: where the grid, the house, the solar and the charger meet, with a protection relay that disconnects the house if the voltage climbs too far. Built by professionals; photographed here so you know what is what.</p>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Board and charger, as mounted. The enclosure on the exterior wall with the Gen 3 Wall Connector directly beneath it, cable coiled. The short run between the two is the AUTO circuit.</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> The board, open. Top row: surge protection and the incoming grid busbars (REȚEA). Second: house (CASĂ) and inverter (INVERTOR). Third: car (AUTO), busbars and main (GENERAL). Bottom: the Fronius Smart Meter that evcc reads as SunSpec unit 200, beside the DigiTOP V-PRO-3F63A displaying L1, L2 and L3.</div>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Board inventory</caption>\n<thead><tr><th scope=\"col\" style=\"width:16%\">Label</th><th scope=\"col\" style=\"width:22%\">Meaning</th><th scope=\"col\">Device</th></tr></thead>\n<tbody>\n<tr><td><b>REȚEA</b></td><td>Grid, incoming</td><td>Busbars L1/L2/L3/N; ETITEC V T2 surge arresters, stamped 255/20</td></tr>\n<tr><td><b>CASĂ</b></td><td>House</td><td>Noark, 4-pole; three single-pole Legrand breakers in the top row</td></tr>\n<tr><td><b>INVERTOR</b></td><td>Inverter</td><td>ETI, 4-pole</td></tr>\n<tr><td><b>AUTO</b></td><td>Car / Wall Connector</td><td>Noark Ex9B C32, 415&nbsp;V~</td></tr>\n<tr><td><b>GENERAL</b></td><td>Main</td><td>Noark Ex9B C40, 415&nbsp;V~</td></tr>\n<tr><td><b>—</b></td><td>Instruments</td><td>Fronius Smart Meter (SunSpec unit 200) · DigiTOP V-PRO-3F63A True RMS</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"4\" class=\"note blue\">\n  <span class=\"h\">The current ceiling is a software choice, not a wiring limit</span>\n  <p>The car circuit is protected at C32 — 32&nbsp;A per phase, which the Wall Connector reckons as 22.1&nbsp;kW across three phases — and the loadpoint title records it. That figure assumes a nominal 230&nbsp;V phase; this board is marked 415&nbsp;V~, which is 240&nbsp;V to neutral, and 240&nbsp;V is the basis for the 720&nbsp;W per amp used elsewhere in this document. The working band evcc is given is narrower — 1–16&nbsp;A (<a href=\"#s12\">section 12</a>). The real physical ceiling is the C40 main, which the whole house shares.</p>\n</div>\n\n<p data-lvl=\"3\">The DigiTOP V-PRO-3F63A relay displays L1, L2 and L3 on its own front panel and opens the house at 257&nbsp;V — the top of the ladder in <a href=\"#s01\">section 01</a>. Its three readings are also the only voltages in the installation that nothing logs: the Fronius feeds InfluxDB through the grid-voltage logger, the Wall Connector reports its own per-phase voltage to evcc, and these three figures exist only on the front of the relay. They are used for cross-checking. The relay is a 63&nbsp;A device behind a C40 main, so it never limits current — only voltage.</p>", "cmds": []}]}, {"num": "07", "title": "Network and addressing", "steps": [{"id": "s15", "title": "Overview", "html": "<p class=\"lede\">A single flat subnet, three static reservations, seven ports — and one decision about radios that the rest of the build depends on.</p>\n\n<p>Everything lives on one home network. Three devices get fixed addresses on the router, the Pi runs on a cable, and the two outdoor devices stay on 2.4&nbsp;GHz Wi-Fi.</p>", "cmds": []}, {"id": "s16", "title": "The Pi runs wired, with its Wi-Fi radio off", "html": "<p data-lvl=\"3\">On a Raspberry Pi&nbsp;4, Wi-Fi and Bluetooth share one antenna. Network traffic on the Wi-Fi radio destabilises the Bluetooth link to the car, which is the one link in this system that carries commands rather than readings. So the Pi never joins Wi-Fi at all — not once, not to get started. It is wired before it is first powered on, it takes its address from a DHCP reservation, and its Wi-Fi radio is switched off for good by the installer. One wired path in and out, one radio doing one job. The installer does this itself, and refuses to do it while <code>eth0</code> is still down — blocking the radio you are connected over is a long walk to the Pi.</p>\n\n<p data-lvl=\"2\">The Wall Connector and the inverter stay on Wi-Fi, on the router's IoT SSID — both refuse 5&nbsp;GHz networks, so it has to be the 2.4&nbsp;GHz band.</p>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">The SSID is separate. The subnet is not.</span>\n  <p>Putting the two outdoor devices on an IoT network is worth doing for tidiness, but it is not isolation. Everything still shares one flat subnet, and it has to: the Pi is wired, the inverter and the Wall Connector are wireless, and every reading in this build crosses between them — Modbus TCP and the Solar API to the inverter, HTTP to the charger.</p>\n  <p>Isolating the IoT SSID behind its own VLAN would cut all three paths at once. It could only work with inter-VLAN routing and firewall rules permitting those specific ports back through, which is a different build from this one. A separate SSID with no VLAN behind it is a naming convention rather than a boundary — worth knowing rather than assuming otherwise.</p>\n</div>", "cmds": []}, {"id": "s17", "title": "Addresses", "html": "<p data-lvl=\"2\">Four addresses appear as placeholders throughout this document; three of them are the reservations the lede counts. Two of the four are the installer&rsquo;s questions. <code>PI_IP</code> it works out for itself and offers as the default &mdash; it opens a UDP socket aimed at an address off the LAN, sends nothing at all, and asks the kernel which of the Pi&rsquo;s own addresses it would have used to get there &mdash; and <code>INVERTER_IP</code> you supply. <code>INVERTER_IP</code> is used twice. Before anything at all is built, <code>site</code> &mdash; the second of the seventeen steps &mdash; makes the two site checks with it: port 502 accepting, and the Solar API returning a phase voltage. Much later, <code>files</code> substitutes both answers into a single rendered file, <code>/etc/default/grid-voltage-logger</code>: <code>PI_IP</code> becomes the InfluxDB URL both loggers write their readings to, and <code>INVERTER_IP</code> the address the voltage logger polls.</p>\n\n<p data-lvl=\"3\">The other two are never typed into the installer at all. <code>CHARGER_IP</code> goes into evcc&rsquo;s own configuration, in the browser (<a href=\"#s11\">section 11</a>): the installer asks only for addresses that something outside evcc needs, and evcc keeps its own devices. <code>ROUTER_IP</code> is not a reservation at all &mdash; it is the router&rsquo;s own address, simply where you go to make those reservations in the first place. The three reserved values live in DHCP reservations on the router, not in the devices, so re-check them after any router change.</p>\n\n<p data-lvl=\"4\">One consequence is worth holding on to. <code>/etc/default/grid-voltage-logger</code> is the only file the installer renders that carries the Pi&rsquo;s own LAN address; everything else on the machine that has its own configuration reaches the machine over loopback. Telegraf and the throttling collector write to <code>localhost:8086</code>, the version logger reads <code>localhost:3000</code> and <code>localhost:8086</code>, and Grafana reaches InfluxDB as <code>influxdb:8086</code> across the container network. The update runner and the boot report do write to the LAN address, but they take it from that same file&rsquo;s <code>INFLUX</code>, which is why it is the one line worth knowing about. Loopback outlives every DHCP lease a LAN address does not, so a Pi that changes address costs you that line and the matching line in <code>/etc/solar-surplus/install.conf</code>, where the installer keeps the answer, rather than a stack that has to be re-pointed everywhere.</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Addresses and ports</caption>\n<thead><tr><th scope=\"col\" style=\"width:26%\">Element</th><th scope=\"col\" style=\"width:20%\">Address</th><th scope=\"col\" style=\"width:16%\">Port</th><th scope=\"col\">Role</th></tr></thead>\n<tbody>\n<tr><td>Fronius Symo GEN24</td><td><code>INVERTER_IP</code></td><td>502 · 80</td><td>Modbus TCP (SunSpec) and Solar API</td></tr>\n<tr><td>Fronius Smart Meter</td><td><span class=\"small\">via the inverter</span></td><td>SunSpec unit 200</td><td>Grid meter at the feed-in point</td></tr>\n<tr><td>Tesla Wall Connector</td><td><code>CHARGER_IP</code></td><td>80</td><td><code>/api/1/vitals</code></td></tr>\n<tr><td>Raspberry Pi</td><td><code>PI_IP</code></td><td>—</td><td>Host for everything below</td></tr>\n<tr><td>evcc UI &amp; API</td><td><code>PI_IP</code></td><td>7070</td><td>Control, configuration and statistics</td></tr>\n<tr><td>Tesla BLE proxy</td><td><code>PI_IP</code></td><td>8080</td><td>Key generation, pairing, commands to the car</td></tr>\n<tr><td>InfluxDB</td><td><code>PI_IP</code></td><td>8086</td><td>Time-series store, org <code>home</code>, buckets <code>evcc</code> and <code>system</code></td></tr>\n<tr><td>Grafana</td><td><code>PI_IP</code></td><td>3000</td><td>Dashboards</td></tr>\n<tr><td>Router admin</td><td><code>ROUTER_IP</code></td><td>8443</td><td>Network settings</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">Four of these ports are checked, not merely opened</span>\n  <p>Four rows above are services running on the Pi itself, and those four are the ones the system watches without being asked: <code>7070</code> evcc, <code>3000</code> Grafana, <code>8086</code> InfluxDB and <code>8080</code> the BLE proxy. Telegraf asks each of them for a health endpoint every thirty seconds &mdash; <code>/api/health</code>, <code>/api/health</code>, <code>/health</code> and <code>/dashboard</code> respectively &mdash; which is what makes &ldquo;the service answers&rdquo; a fact separate from &ldquo;the container is running&rdquo;. The boot report knocks on the same four after every reboot and writes down which of them came up, which did not, and how many seconds the machine took to get there.</p>\n  <p>The distinction matters more than it sounds. A port that accepts a connection is not a service that answers: a cold InfluxDB opens <code>8086</code> long before it can serve a query, so the boot report gates that one on <code>/health</code> returning 200 and takes the other three as answered as soon as the port accepts. It waits up to ten minutes for all four and then records whatever is still silent rather than waiting on for ever &mdash; a report that never lands teaches less than a report that says the stack came up degraded, and names what was missing.</p>\n</div>", "cmds": []}]}, {"num": "08", "title": "Card, image, first contact", "steps": [{"id": "s18", "title": "Card, image, first contact", "html": "<p class=\"lede\">Everything the Pi needs in order to appear on the network is set before first boot — and none of it is a radio. Card, cable, power, one SSH session, and nothing else typed by hand.</p>\n\n<p>Put the operating system on the card with Raspberry Pi&rsquo;s own tool, plug in network and power, and log in once from the laptop. No screen, no keyboard, nothing typed on the Pi itself.</p>\n\n<p data-lvl=\"2\">Start from a genuinely blank card. A card carrying an old partition table is the most common reason a fresh image refuses to boot. Open a Command Prompt as administrator on the laptop — this step assumes Windows.</p>\n\n<div data-lvl=\"2\" class=\"note red\">\n  <span class=\"h\">Read the disk number twice</span>\n  <p><code>clean</code> is not reversible and it does not ask. Point it at the wrong number and it wipes that drive — the laptop's own disk is in the same list. Disk numbers change between machines and between reboots, so identify the card by its size, every time, and never by a number remembered from last time.</p>\n</div>\n\n<div data-lvl=\"2\" class=\"cmd\">\n<div class=\"lbl\"><span>Command Prompt, as administrator</span><span class=\"path\">on the laptop</span></div>\n<pre>diskpart\n\nlist disk          <span class=\"c\">// identify the card by its size, not its number</span>\nselect disk 1      <span class=\"c\">// substitute the number you just read</span>\nclean\nexit</pre>\n</div>\n\n<div data-lvl=\"2\" class=\"pass\"><b>Pass ·</b> <code>DiskPart succeeded in cleaning the disk.</code> Windows will then offer to format the card — dismiss it. Raspberry Pi Imager writes its own filesystem next.</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> The clean, as it actually ran. Three disks in the list, and the card is found by its size — here it was disk 2, not the 1 in the recipe above, which is exactly why the number is read from the list and never typed from memory. Then clean , one line of confirmation, and the card is bare metal for the Imager.</div>\n\n<p data-lvl=\"2\">Then Raspberry Pi Imager, with the customisation wizard:</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Imager settings</caption>\n<thead><tr><th scope=\"col\" style=\"width:28%\">Setting</th><th scope=\"col\">Value</th></tr></thead>\n<tbody>\n<tr><td>Device</td><td>Raspberry Pi 4</td></tr>\n<tr><td>Operating system</td><td>Raspberry Pi OS Lite (64-bit), under “Raspberry Pi OS (other)”</td></tr>\n<tr><td>Storage</td><td>The SD card — then enter the customisation wizard</td></tr>\n<tr><td>Hostname</td><td><code>evcc</code></td></tr>\n<tr><td>Location</td><td>Your city. It sets the timezone every Grafana timestamp depends on — every point in InfluxDB is UTC, and this is what turns it back into the hour you actually charged</td></tr>\n<tr><td>User account</td><td>Username and password, <b>written down</b> — the installer asks for that username</td></tr>\n<tr><td>Wi-Fi</td><td><b>Leave it blank.</b> The Pi is wired, and the installer blocks this radio anyway — filling it in here only creates a credential to be revoked later and an antenna the Bluetooth link has to share</td></tr>\n<tr><td>SSH</td><td>Enabled, with password authentication — enough on a trusted LAN; keys are the stricter option</td></tr>\n<tr><td>Raspberry Pi Connect</td><td>Not needed — everything happens on the local network</td></tr>\n</tbody>\n</table>\n</div>\n\n<p data-lvl=\"2\">Ethernet cable first, then power — in that order, so the Pi has a link the moment it looks for one and never spends a boot without a network. It appears in the router's client list as <code>evcc</code>; give it a DHCP reservation there and that address is <code>PI_IP</code> for the rest of this document. Then connect to it. Windows already ships an SSH client; nothing to install on the laptop.</p>\n\n<div data-lvl=\"2\" class=\"cmd\">\n<div class=\"lbl\"><span>PowerShell</span><span class=\"path\">on the PC</span></div>\n<pre>ssh USERNAME@PI_IP</pre>\n</div>\n\n<p data-lvl=\"2\">Substitute the username set in the Imager wizard.</p>\n\n<p data-lvl=\"4\">The address rather than <code>evcc.local</code> on purpose. mDNS works until it does not — a router that does not forward it, a client that has it switched off, a second machine that once answered to the same name — and the reservation is a fact about your network that a name resolution is only a guess at. You need that address written down regardless: the installer asks for it, and it ends up in the dashboard and in both environment files.</p>\n\n<p data-lvl=\"3\" class=\"small\">On the very first boot, before the reservation exists, <code>ssh USERNAME@evcc.local</code> will usually get you in — the hostname was set in the wizard. Use it once if you need to, then reserve the address and stop using it.</p>\n\n<p data-lvl=\"3\">The first connection asks a question no later one will. SSH has never seen this host, so it prints the new key&rsquo;s fingerprint and waits: answer <code>yes</code> and it is written to <code>known_hosts</code> and never asked again. On a LAN you control, on a Pi you imaged an hour ago, that prompt is a formality &mdash; but it is worth knowing that it appears exactly once, because the same prompt reappearing later means the host key changed, and on this network that means the card was reimaged rather than anything sinister.</p>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> First contact. The host key accepted, then the banner: Linux 6.18.34+rpt-rpi-v8 , Debian 1:6.18.34-1+rpt1 of 9 June 2026, aarch64 — the 64-bit image, which is what the three container stacks need. The prompt is the username from the Imager wizard and the hostname set beside it, and it is the last thing that has to be true before section 09 . Three fields are blanked: the Pi’s address, the local account name in the key path, and the address the session came from. They are PI_IP and your own two, and the worksheet in section 17 is where they belong.</div>\n\n<div data-lvl=\"2\" class=\"pass\"><b>Pass ·</b> a shell prompt on the Pi, and <code>ip -4 -br addr</code> shows the reserved address on <code>eth0</code> and nothing on <code>wlan0</code>. That is the whole of the Pi's network setup: one interface, one address, no credential stored anywhere on the card.</div>", "cmds": ["diskpart", "list disk // identify the card by its size, not its number", "select disk 1 // substitute the number you just read", "clean", "exit", "ssh USERNAME@PI_IP"]}]}, {"num": "09", "title": "Install", "steps": [{"id": "s19", "title": "Overview", "html": "<p class=\"lede\">Two commands, one run &mdash; the disk included. Everything it needs from the network is already switched on: fetch <code>get.py</code> from the public releases repo, run it, answer eight questions, and everything between a bare Raspberry Pi OS and a working dashboard is done for you.</p>\n\n<p>One small script fetches the release, proves it, and builds the whole thing. The installer asks eight questions, sets up every service, and checks its own work as it goes; the history goes onto a USB disk, which it finds, adopts or prepares for you &mdash; asking before it touches anything, and stopping rather than quietly filling the card. Ten minutes, most of it downloads.</p>\n\n<div data-lvl=\"2\" class=\"note green\">\n  <span class=\"h\">Two of the three devices are already done</span>\n  <p>Nothing in the seventeen steps <em>needs</em> the inverter, the Wall Connector or the car — the script installs packages, builds three container stacks, mints its own credentials, writes its own files and imports its own dashboard, all of it on the Pi over the one SSH session you already have. But its <code>site</code> step probes the inverter, and taking the two browser-configured devices first means that probe passes on the first run instead of printing a warning you already knew about. Only the car is left outstanding at the end.</p>\n</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> What is on the desk before the first command. The disk in its enclosure, the Pi wired to the router, and nothing else attached. Which USB port the disk goes in is the one thing on this page to get right and the easiest to get wrong: on a Pi 4 B the pair nearest the Ethernet jack is USB 3.0 and the far pair is USB 2.0, and it is the far pair you want — section 03 has why, and section 10 has what it costs when pairing starts failing. As photographed here it is in the near pair, which is the wrong one; this build’s disk was moved to the far pair afterwards.</div>\n\n<p data-lvl=\"2\">Nothing is copied to the Pi by hand. <code>get.py</code> is published as an asset on every release, so the Pi fetches the fetcher itself, over the SSH session from <a href=\"#s08\">section 08</a>:</p>\n\n<div class=\"cmd\" data-lvl=\"2\">\n<div class=\"lbl\"><span>Shell</span><span class=\"path\">on the Raspberry Pi</span></div>\n<pre>curl -fsSLO https://github.com/mihai-gafiteanu/solar-surplus-releases/releases/latest/download/get.py\nsudo python3 get.py</pre>\n</div>\n\n<p data-lvl=\"3\">What those two lines set in motion: <code>get.py</code> downloads the release&rsquo;s Debian package and its sha256, verifies the hash &mdash; a mismatch is the end, not a retry &mdash; extracts the deb to a scratch tree and runs <code>selftest.py</code> inside it, so a release that fails its own checks never touches the system. Only then does it hand the verified deb to <code>apt-get</code>, which places the tree at <code>/usr/lib/solar-surplus/</code> and the units beside it, and it ends by running <code>install.py</code> from there &mdash; which is everything below. One release in particular is <code>sudo python3 get.py --tag vX.Y</code>, naming any released tag.</p>\n\n<div class=\"note\" data-lvl=\"2\">\n  <span class=\"h\">The disk is the installer's business now</span>\n  <p>There is no separate disk command and no disk flag. The <code>storage</code> step resolves the history disk inside the same run, in this order: a disk already carrying the <code>influxdb</code> label &mdash; a previous life of this system &mdash; is <b>adopted</b> exactly as it stands, with nothing written to it; a blank, unused USB disk is <b>offered</b>, and preparing it happens only after you type its device path in full; no disk at all, or Enter at the offer, and the run <b>stops</b>. The card is not a fallback: InfluxDB keeps every point for ever and the two loggers add three of them every 15 seconds, and a card answers that workload with a wear-out rather than an error.</p>\n</div>\n\n<div class=\"note red\" data-lvl=\"3\">\n  <span class=\"h\">The one destructive moment, and its locks</span>\n  <p>Preparing a blank disk erases it, so it is the one act in this build behind a typed confirmation: the installer lists only disks nothing is using, and still asks you to type the device path in full &mdash; a pipe cannot answer, and Enter ends the run rather than falling back to the card. Read the listing before you type. The card this Pi runs from is <code>mmcblk0</code> and is never in the list, because everything mounted is excluded; the disk you mean is the one whose size you recognise, with no filesystem and nothing mounted.</p>\n  <p data-lvl=\"4\">Everything that could stop it runs before the first byte is written. It refuses a partition where a whole disk is meant, any disk with something mounted from it, a disk carrying swap, and a disk with an array or volume group on top &mdash; the first two of those rule out the card twice over, without depending on you reading a name correctly. What it leaves behind: one GPT partition, ext4, labelled <code>influxdb</code> with no reserved blocks, and an <code>/etc/fstab</code> line naming it by <b>UUID</b> with the options <code>defaults,noatime,nofail,x-systemd.device-timeout=30,x-systemd.before=docker.service</code>. The label is what a later reinstall adopts the disk by; the UUID is because an old drive on a different port comes back with a different name; <code>nofail</code> is because a Pi that stops at a maintenance shell over a sleepy disk is a Pi with no network and nothing charging.</p>\n</div>\n\n<p data-lvl=\"3\">That is the whole of it. The script is standard-library Python &mdash; Raspberry Pi OS Lite already has <code>python3</code>, and an installer that needs <code>pip</code> before it can install anything is an installer that fails on the one machine where nothing is installed yet. <code>maintenance-backup.py</code> beside it &mdash; the one backup-and-restore tool, the retired <code>backup.py</code> and <code>restore.py</code> folded into it &mdash; holds to the same rule, for the same reason.</p>\n\n<div class=\"cmd\" data-lvl=\"3\">\n<div class=\"lbl\"><span>Response</span><span class=\"path\">the storage step meeting a blank disk, once</span></div>\n<pre>&#9472;&#9472; The disk the history lives on &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;\n\n  No disk is mounted at /mnt/influxdb, but this Pi has a USB disk nothing is using:\n\n      [1]  /dev/sda       465.8G Generic\n\n  Preparing a disk ERASES everything on it &#8212; you will be asked to confirm first.\n  Type 1 to prepare it, or Enter to stop without a disk: 1\n\n&#9472;&#9472; Prepare /dev/sda for InfluxDB &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;\n  /dev/sda &#8212; 500.1 GB Generic\n    NAME   SIZE TYPE FSTYPE LABEL MOUNTPOINTS\n    sda  465.8G disk\n\n  warn    EVERYTHING ON /dev/sda WILL BE DESTROYED.\n  Type the device path to confirm, or anything else to stop: /dev/sda\n  ok      old signatures wiped\n  ok      one GPT partition, /dev/sda1\n  ok      ext4, label influxdb, no reserved blocks\n  ok      UUID 63ea7203-5039-40c5-ba06-f36d695088d0\n  ok      /etc/fstab written\n          UUID=63ea7203-5039-40c5-ba06-f36d695088d0  /mnt/influxdb  ext4  <span class=\"c\">\\</span>\n          defaults,noatime,nofail,x-systemd.device-timeout=30,<span class=\"c\">\\</span>\n          x-systemd.before=docker.service  0  2\n  ok      mounted at /mnt/influxdb (ext4)\n  ok      491.1 GB usable</pre>\n</div>\n\n<p data-lvl=\"4\">On a reinstall the same step never reaches that prompt: the disk carries the <code>influxdb</code> label from its first life, so the step adopts it &mdash; an <code>/etc/fstab</code> line by UUID, a mount, not one byte written &mdash; and the history is simply back. The three outcomes are ranked exactly so that the destructive one comes last, cannot touch a disk in use, and cannot happen at all without a human typing at a terminal. The prompt&rsquo;s own wording still offers the card; the step no longer does. Press Enter and nothing is erased and nothing is mounted, so the run stops there &mdash; naming any USB disk it left alone, and why it left it alone, because &ldquo;but it is right there&rdquo; is otherwise an hour of your evening &mdash; and printing the six commands that move a history already on the card onto a disk without losing it. That recipe exists because the new filesystem mounts <em>over</em> the mount point: everything underneath becomes invisible at that moment, still on the card, still taking up the space.</p>\n\n<p data-lvl=\"4\">The manufacturer&rsquo;s 500&nbsp;GB is the kernel&rsquo;s 465.8&nbsp;GiB is 491.1&nbsp;GB usable once ext4 has taken its own overhead and given back the root reserve &mdash; three numbers for one disk, all of them correct, which is worth knowing before you go looking for the missing ten gigabytes. Write the UUID down or do not: it is in <code>/etc/fstab</code> from here on, and <code>blkid</code> will tell you again.</p>", "cmds": ["curl -fsSLO https://github.com/mihai-gafiteanu/solar-surplus-releases/releases/latest/download/get.py", "sudo python3 get.py"]}, {"id": "s20", "title": "What it asks", "html": "<p data-lvl=\"2\">Eight questions, once. Answers are written to <code>/etc/solar-surplus/install.conf</code> at mode 600 and reused on every later run, so a second run asks nothing. Delete a line from that file to be asked that question again &mdash; at a keyboard: an unattended converge never reads stdin, and recovers what it can from the live files instead.</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>The questions, and where each answer ends up</caption>\n<thead><tr><th scope=\"col\" style=\"width:30%\">Question</th><th scope=\"col\" style=\"width:20%\">Default</th><th scope=\"col\">Where it lands</th></tr></thead>\n<tbody>\n<tr><td>Login name</td><td><span class=\"small\">the user running <code>sudo</code></span></td><td>The docker group, and the two compose paths in <code>/etc/default/update-runner</code></td></tr>\n<tr><td>This Pi's address</td><td><span class=\"small\">detected</span></td><td>The loggers' InfluxDB URL in <code>/etc/default/grid-voltage-logger</code></td></tr>\n<tr><td>Inverter address</td><td>—</td><td><code>/etc/default/grid-voltage-logger</code>, and the <code>site</code> check</td></tr>\n<tr><td>Where the USB disk is mounted</td><td><code>/mnt/influxdb</code></td><td>The two bind devices in <code>~/monitoring/docker-compose.yml</code>, and where the <code>storage</code> step mounts, adopts or prepares the disk</td></tr>\n<tr><td>Samba server, share, account and password</td><td>—</td><td><code>/etc/default/maintenance-backup</code> &mdash; four answers naming where the nightly backup pushes its archives. Characters the credentials file cannot carry are refused here, at the keyboard, not discovered at 22:30</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"3\" class=\"note\">\n  <span class=\"h\">A changed answer does not rewrite what the old one produced</span>\n  <p>Answers are kept in <code>/etc/solar-surplus/install.conf</code> at mode 600. Delete a line and the next run asks that question again — but it does <em>not</em> rewrite what the old answer already produced, because the installer refuses to replace a file that differs from what it would write. Changing an address therefore means re-running with <code>--force</code>, or editing the file by hand. The inverter’s and the Pi’s addresses land in one file, <code>/etc/default/grid-voltage-logger</code>. The Samba answers land in <code>/etc/default/maintenance-backup</code>. The login name lands in <code>/etc/default/update-runner</code>, and decides where the compose files are written.</p>\n</div>\n\n<p data-lvl=\"2\">The script generates the InfluxDB admin password and admin token, the Grafana admin and viewer passwords, the evcc admin password and the board buttons&rsquo; token, uses them, and prints none of them: the run ends by writing them all &mdash; the three bucket tokens and the Samba account you typed included &mdash; into one KeePass import file in the login's home directory.</p>", "cmds": []}, {"id": "s21", "title": "What it does", "html": "<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>The seventeen steps, in order</caption>\n<thead><tr><th scope=\"col\" style=\"width:22%\">Step</th><th scope=\"col\">What happens</th></tr></thead>\n<tbody>\n<tr><td><code>preflight</code></td><td>Root, a Debian-family system with systemd, the release payload complete beside <code>install.py</code> &mdash; it names the scripts and the dashboard model it refuses to run without &mdash; free space on <code>/</code>, and a route to the internet</td></tr>\n<tr><td><code>site</code></td><td>Modbus on 502 and the Solar API returning a phase voltage &mdash; both switched on back in section 04, so both should answer. Neither is fatal &mdash; a failure becomes a line in the closing list rather than stopping the run</td></tr>\n<tr><td><code>storage</code></td><td>Third in the run, not eighth, because it holds the one question that cannot be asked unattended: which disk to erase. It adopts a disk already labelled <code>influxdb</code> untouched, offers to prepare a blank one behind a typed confirmation, or stops the run &mdash; the card is not a fallback. Then it checks what it has: a real filesystem, not the card, not one a database cannot live on, recorded in <code>/etc/fstab</code> with <code>nofail</code> and an ordering before Docker so it comes back after a reboot. It warns if the disk sits on one of the blue USB&nbsp;3 ports, because SuperSpeed signalling puts noise across the 2.4&nbsp;GHz band the car is reached on, then creates <code>data/</code> and <code>config/</code> and reports the free space</td></tr>\n<tr><td><code>packages</code></td><td><code>jq</code>, <code>netcat-openbsd</code>, <code>curl</code>, <code>ca-certificates</code>, <code>rfkill</code>, <code>python3</code>. On the June&nbsp;2026 Lite image only <code>jq</code> was actually missing; the other five ship with it</td></tr>\n<tr><td><code>docker</code></td><td>Docker if it is missing, and your login added to the <code>docker</code> group. The group is real from the next login on: until you log out and back in, every <code>docker</code> command in the installing session fails with <code>permission denied ... /var/run/docker.sock</code> &mdash; a stale group list, not a broken daemon. <code>id</code> shows the session; <code>id USERNAME</code> shows the truth</td></tr>\n<tr><td><code>evcc</code></td><td>The evcc apt repository and the package</td></tr>\n<tr><td><code>radios</code></td><td>Bluetooth unblocked, Wi-Fi blocked once <code>eth0</code> is up, and <code>bt-unblock.service</code> enabled so the radio survives a reboot. With <code>eth0</code> down it says so and leaves Wi-Fi alone, because blocking it would end the session you are typing in</td></tr>\n<tr><td><code>ble</code></td><td><code>~/TeslaBleHttpProxy</code>, its compose file and the <code>key/</code> directory; the container started. The Bluetooth controller is counted <em>before</em> that container starts, because afterwards there is nothing to count &mdash; the proxy drives <code>hci0</code> over a raw socket and every host-side tool then reports no controller at all. A <code>key/</code> restored from backup is detected here and named as already paired &mdash; the ceremony in <a href=\"#s10\">section 10</a> belongs only to a key the car has never seen</td></tr>\n<tr><td><code>monitoring</code></td><td><code>~/monitoring</code>, the InfluxDB + Grafana compose file with all three generated credentials and the disk&rsquo;s path substituted, any pin the owner has raised merged back into the <code>.env</code> beside it, both containers started and both waited for until healthy &mdash; five minutes each. It also reports which device InfluxDB&rsquo;s data volume is really bound to, because a volume keeps the driver options it was created with: no re-run and no edit to the compose file moves it once it exists</td></tr>\n<tr><td><code>token</code></td><td>A bucket-scoped InfluxDB token with read and write on <code>evcc</code> and nothing else. A token already in hand is proved by a real write and kept rather than replaced &mdash; minting a fresh one while the services keep running on the old is exactly the drift this guards against &mdash; and every candidate, held, found or freshly minted, has to answer HTTP&nbsp;204 before it goes anywhere near a service file. Spare twins of it are then pruned from InfluxDB, but only the ones the instance lists with their values: a spare that cannot be told from the keeper is left alone and said out loud</td></tr>\n<tr><td><code>files</code></td><td>Environment files, and only those: the two <code>/etc/default</code> templates &mdash; <code>grid-voltage-logger</code> and <code>update-runner</code>, both mode 600 &mdash; rendered from the payload with this install&rsquo;s answers and minted tokens. dpkg placed the code and the units; the configurator renders the configuration that code reads, and the package and the configurator never write the same path, so neither can undo the other&rsquo;s work. A rewritten <code>grid-voltage-logger</code> env file marks its reader for a restart
