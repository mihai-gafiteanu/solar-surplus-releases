in the next step, because that logger takes its file in only at start; <code>update-runner</code> is read fresh by every run and marks nothing</td></tr>\n<tr><td><code>services</code></td><td>evcc and the voltage logger enabled and started. One that is already running but whose environment file this run rewrote is restarted rather than left on the old values, and one that is active but not enabled is enabled &mdash; and restarted as well if this run rewrote its file, because active-but-disabled is a real state and <code>enable --now</code> does not restart what is already up</td></tr>\n<tr><td><code>maintenance</code></td><td>The evening window. It renders <code>/etc/default/maintenance-backup</code> from the Samba answers, then enables the window&rsquo;s one 22:30 timer and the boot report &mdash; the timer starts the same unit the board&rsquo;s button starts, backup, ordered updates and guarded reboot as one queued run &mdash; with <code>enable</code> and never <code>enable --now</code>, because nothing in that window may fire in the middle of an install. It enables <code>version-logger.timer</code> with them: the version reading fires every quarter hour at ten past, on top of the boot report's first reading and the repaint every update outcome already does. The reading&rsquo;s service itself stays boot-inert by construction &mdash; the deb ships no <code>[Install]</code> on it, so scheduled is never boot-started, and no reading races the containers into an <code>unknown</code> row</td></tr>\n<tr><td><code>evcc-note</code></td><td>Writes nothing. It prints where evcc is configured and the one thing the browser configuration cannot do &mdash; the InfluxDB export &mdash; so that the omission is stated rather than discovered</td></tr>\n<tr><td><code>grafana</code></td><td>The <code>influxdb-evcc</code> data source, Flux against the <code>evcc</code> bucket, and a read-only account called <code>viewer</code> for whoever checks the boards without being able to change them &mdash; created if missing, and pinned back to the Viewer role on every run, so an account that drifted to Editor drifts back. The board itself is not imported here: it reads a second data source that does not exist until the <code>pihealth</code> step mints its read token, and importing it now would import a board with a dead half</td></tr>\n<tr><td><code>pihealth</code></td><td>The Pi&rsquo;s own patient file. A <code>system</code> bucket kept 90 days &mdash; health data earns no more &mdash; a write token for Telegraf, proved by a real write before it is kept, and a read token for Grafana; <code>~/telegraf</code> and its container, watched for fifteen seconds after it starts, because a container that cannot read its config starts, dies and is restarted, and a single poll lands on the running moment often enough to call it healthy. Then <code>/etc/default/pi-throttled</code> and the host service that decodes the firmware&rsquo;s throttle word, which no container can reach; then the <code>influxdb-system</code> data source; then the one combined board imported over whatever Grafana is holding</td></tr>\n<tr><td><code>os-update</code></td><td>The run ends with the OS current: package lists refreshed, the pending upgrades counted with a simulated run first so the number can be printed, then <code>full-upgrade</code> &mdash; the same verb the nightly window applies to the OS later, and the same one the version logger counts with. If a package asks for a reboot it says so and leaves the choice to you, because a reboot in the middle of a charge is not the installer&rsquo;s to take</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"3\" class=\"note green\">\n  <span class=\"h\">The three rules it follows</span>\n  <p><b>It never overwrites.</b> Every file it would write is compared against what is already there. Identical is a silent pass; different is a refusal that names the path and carries on. Nothing you edited by hand is destroyed by a re-run — <code>--force</code> is the one flag that changes that, for the whole run.</p>\n  <p><b>It is re-runnable.</b> Every step asks whether its work is already done before doing it, so an interrupted run is fixed by running it again rather than by unpicking what it managed.</p>\n\n  <div class=\"note red\"><b>If a container never becomes healthy.</b> The installer waits five minutes for InfluxDB and Grafana, then stops. That message means the probe never passed &mdash; not necessarily that the container is broken, so read the state before changing anything:\n  <pre><code>docker ps -a --format 'table {{.Names}}\\t{{.Status}}'\n\ndocker inspect influxdb \\\n  --format 'state={{.State.Status}} restarts={{.RestartCount}}'\n\ndocker inspect influxdb --format 'oom={{.State.OOMKilled}}'\n\ndocker logs influxdb --tail 20</code></pre>\n  <code>Restarting</code> with a climbing restart count is a crash loop, and the last log lines name the cause. <code>Up</code> with the probe still failing is the opposite problem &mdash; the service is fine and something between the probe and the port is not. <code>oom=true</code> is memory, which on a 2&nbsp;GB Pi running evcc, both container stacks and Grafana is a real possibility rather than a theoretical one.</div>\n  <p><b>It says what it did, without saying the secrets.</b> No secret is printed to the terminal &mdash; a password echoed to a screen lives on in the scrollback. Every credential of the install is written instead to <code>~/solar-surplus-secrets-v&lt;release&gt;.xml</code>, mode 600, owned by the login: a KeePass import file named for the release, one entry per credential with the URL it belongs to, because a password that exists but never reached the password manager is the same as a broken install. On a complete run that is ten entries &mdash; the six credentials it holds for this install, the three bucket tokens (read and write on <code>evcc</code>, Telegraf&rsquo;s write on <code>system</code>, Grafana&rsquo;s read on it) and the Samba account you typed, recorded like the rest so that nothing belonging to this install lives anywhere else. Import it, then delete both copies; <code>/etc/solar-surplus/install.conf</code> keeps the same values for re-runs.</p>\n</div>", "cmds": ["docker ps -a --format 'table {{.Names}}\\t{{.Status}}'", "docker inspect influxdb --format 'state={{.State.Status}} restarts={{.RestartCount}}'", "docker inspect influxdb --format 'oom={{.State.OOMKilled}}'", "docker logs influxdb --tail 20"]}, {"id": "s22", "title": "The inverter's two interfaces, checked from the Pi", "html": "<p data-lvl=\"3\">Modbus TCP and the Solar API were switched on in <a href=\"#s04\">section 04</a>, from a browser, before this Pi existed. These are the two checks that prove them, and they are exactly what the installer's <code>site</code> step performs — run them yourself once, so that a warning from the installer can be read as a fact about the inverter rather than a doubt about the script.</p>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Shell</span><span class=\"path\">on the Raspberry Pi</span></div>\n<pre>nc -zv INVERTER_IP 502\n\ncurl -s \"http://INVERTER_IP/solar_api/v1/GetMeterRealtimeData.cgi?Scope=Device&amp;DeviceId=0\" \\\n  | jq '.Body.Data.Voltage_AC_Phase_1'</pre>\n</div>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Response</span><span class=\"path\">run from the Pi, after the installer</span></div>\n<pre>Connection to INVERTER_IP 502 port [tcp/*] succeeded!\n240.40000000000001</pre>\n</div>\n\n<div data-lvl=\"3\" class=\"pass\"><b>Pass ·</b> <code>succeeded</code> from <code>nc</code>, and a number in the 230–250 band from <code>curl</code> — this site sits in the 240s. The trailing digits are <code>jq</code> printing a float exactly rather than the meter claiming precision it does not have; 240.4 is the reading. <code>Connection refused</code> means Modbus is off or the address belongs to another device; <code>null</code> means the Solar API is off. Either one sends you back to <a href=\"#s04\">section 04</a> with a web form to re-open.</div>\n\n<p data-lvl=\"4\">Running these yourself after the installer has already reported them is not duplication. The installer&rsquo;s <code>site</code> step probes both and prints a warning it cannot make you read; running them by hand turns that into a number you have seen. It is also the pair to run first whenever the power panels go quiet later, because they separate &ldquo;the inverter stopped answering&rdquo; from every other explanation in one line each.</p>", "cmds": ["nc -zv INVERTER_IP 502", "curl -s \"http://INVERTER_IP/solar_api/v1/GetMeterRealtimeData.cgi?Scope=Device&DeviceId=0\" | jq '.Body.Data.Voltage_AC_Phase_1'"]}, {"id": "s23", "title": "What it will not do", "html": "<p data-lvl=\"2\">Three things cannot be done from the Pi, and the script does not pretend otherwise. It checks the first and the third and prints whichever is still outstanding as a numbered list at the end of the run — which, in the order this document takes, is the third of them alone:</p>\n\n<ol data-lvl=\"2\" class=\"steps\">\n<li>Switch on Modbus TCP and the Solar API in the inverter — a web form on the inverter (<a href=\"#s04\">section 04</a>) <span class=\"small\">done already</span></li>\n<li>Join the Wall Connector to Wi-Fi — the Tesla app, standing next to the charger (<a href=\"#s05\">section 05</a>) <span class=\"small\">done already, and not checked here</span></li>\n<li>Generate the BLE key and pair the car — you, in the car, with the key card (<a href=\"#s10\">section 10</a>) <span class=\"small\">still outstanding</span></li>\n</ol>\n\n<div class=\"tw\" tabindex=\"0\" data-lvl=\"3\">\n<table>\n<caption>Flags &mdash; both of them</caption>\n<thead><tr><th scope=\"col\" style=\"width:30%\">Flag</th><th scope=\"col\">Effect</th></tr></thead>\n<tbody>\n<tr><td><code>--force</code></td><td>Replace files that exist and differ. Read what it refused first</td></tr>\n<tr><td><code>--only STEP</code></td><td>Run only the named step. Repeatable &mdash; <code>--only files --only services</code> runs those two. For picking up after a failure, once you know which step failed</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Response</span><span class=\"path\">the three steps the disk touches, gathered from one first run</span></div>\n<pre>── The disk the history lives on ─────────────────────────────────────\n  ok      /mnt/influxdb is ext4, mounted from /dev/sda1\n  ok      /etc/fstab mounts it at boot\n  ok      /mnt/influxdb/data and /mnt/influxdb/config ready\n  ok      491.1 GB free of 491.1 GB at /mnt/influxdb\n\n── InfluxDB and Grafana ──────────────────────────────────────────────\n  ok      /home/USERNAME/monitoring/docker-compose.yml written\n  ok      influxdb and grafana started\n  ok      InfluxDB is up\n  wait    Grafana, up to 300s\n  ok      Grafana is up\n\n── InfluxDB bucket token ─────────────────────────────────────────────\n  ok      org home and bucket evcc found\n  ok      bucket-scoped token created — read and write on evcc, nothing else\n  ok      test write accepted (HTTP 204)</pre>\n</div>\n\n<p data-lvl=\"4\">Those four lines under the first heading are the whole of the disk story, checked rather than assumed: mounted, <em>and</em> recorded in <code>fstab</code> so it comes back, <em>and</em> carrying the two directories the compose file binds to. Nothing binds a volume to them until the <code>monitoring</code> step, six steps later &mdash; and Docker refuses to start a container whose bind-backed volume has no device to mount, which is what keeps a failed mount from quietly filling the card. The <code>wait</code> against Grafana is normal and is the one part of a first run that takes minutes rather than seconds &mdash; it is pulling the Solar Flow panel from Grafana&rsquo;s catalogue, once, into a volume that keeps it.</p>\n\n<div data-lvl=\"2\" class=\"pass\"><b>Pass ·</b> the run ends with five URLs &mdash; evcc on 7070, Grafana on 3000, InfluxDB on 8086, the BLE proxy&rsquo;s dashboard on 8080 and the window listener&rsquo;s health door on 9101 &mdash; then the path the history lives at and the one board it feeds, then the KeePass file it wrote, how many credentials are in it and the <code>scp</code> line for fetching it, and finally either a numbered outstanding list naming the manual steps above or the sentence saying there is nothing outstanding. The line naming <code>/mnt/influxdb/data</code> is the one worth reading twice on a first install. Two checks confirm the rest from the shell &mdash; <code>systemctl is-active evcc grid-voltage-logger pi-throttled</code> answers <code>active</code> three times, and <code>systemctl list-timers</code> shows the maintenance window waiting at 22:30 beside the quarter-hour reading &mdash; and one from the browser: Grafana holds one board, Pi health above and evcc below, with both of its data sources already selected. One thing listens on a port of its own: the window listener on 9101, whose only instruction is the board&rsquo;s run-the-window press &mdash; the installer knocks on its health door before calling the run done. The machine still takes its updates in its own evening window; the button only asks for that window early.</div>\n\n<div class=\"note green\" data-lvl=\"3\">\n  <span class=\"h\">Measured, on a bare card &mdash; twice</span>\n  <p>The first time, on an earlier release: fresh 64-bit Lite image, the release payload on the Pi, the installer run once, on a Raspberry&nbsp;Pi&nbsp;4&nbsp;B. Everything happened in one session with no failures and nothing typed twice: Docker installed from scratch, evcc <b>0.313.3</b> from its own repository, every container stack that release built pulled and started, the bucket token minted and proved with a real write, and the dashboard imported through Grafana&rsquo;s API rather than the file fallback. The closing list held only what it should &mdash; a fresh login for the <code>docker</code> group, and the car.</p>\n  <p>And measured again on 15&nbsp;August&nbsp;2026, as a reinstall: the same fresh card and one run, then the pairing key restored from its archive &mdash; the sequence <code>maintenance-backup.py --restore</code> now automates, run by hand and confirmed step by step &mdash; and the car answered the very first request. No ceremony, no key card, no driver&rsquo;s seat. That night is what this release&rsquo;s backup and restore verbs are built from, and it is also where evcc <b>0.314</b> was found to export no connected or charging flag at all &mdash; which is why the board derives the charging state from power, offered current and the green share rather than reading a boolean that is not there.</p>\n</div>", "cmds": []}]}, {"num": "10", "title": "Pair the car", "steps": [{"id": "s24", "title": "Overview", "html": "<p class=\"lede\">A key that can charge, and nothing else. The one step in this build that no script can take, because it ends with a physical card held against a centre console.</p>\n\n<p>The one step no script can do: teaching the car to trust the Pi. You send a key from your phone, hold the key card against the console, and confirm on the car&rsquo;s screen. Then you back the key up &mdash; it is the one file that can never be recreated.</p>\n\n<p data-lvl=\"2\">The BLE proxy is already running — the installer started it. Open <code>http://PI_IP:8080/dashboard</code> and click <b>Generate</b> for the <b>Charging Manager</b> role. That role can read data and wake the car, start and stop charging, and set the amperage; it cannot unlock or drive. If the Pi were ever stolen, the key opens nothing.</p>", "cmds": []}, {"id": "s25", "title": "Pairing, in exactly this order", "html": "<ol data-lvl=\"2\" class=\"steps\">\n<li>Sit in the car and keep the screen on, so it cannot fall asleep mid-procedure</li>\n<li>From your phone, in the bridge dashboard under <em>Setup Vehicle</em>, enter the 17-character VIN and send the request</li>\n<li>Wait for the green message confirming the request was sent</li>\n<li>Within 30 seconds, hold the key card flat against the centre console, on the wireless charging area, for 2–3 seconds</li>\n<li>The car's screen asks whether to add a new key — confirm it</li>\n<li>Verify under Controls → Locks: a new key appears in the list</li>\n</ol>\n\n<div data-lvl=\"2\" class=\"note red\">\n  <span class=\"h\">Tapping the card is not enough</span>\n  <p>The on-screen confirmation is the step that completes pairing. Nothing appears on screen until the card is tapped — do not wait for a prompt beforehand.</p>\n</div>", "cmds": []}, {"id": "s26", "title": "When it will not pair", "html": "<div data-lvl=\"3\" class=\"note red\">\n  <span class=\"h\">The Pi has no Bluetooth, and that is normal</span>\n  <p>The first instinct when pairing fails is to check the radio from the Pi, and the first thing the Pi says is:</p>\n  <div class=\"cmd\">\n  <div class=\"lbl\"><span>Response</span><span class=\"path\">with the proxy running</span></div>\n  <pre>$ bluetoothctl list\nNo default controller available</pre>\n  </div>\n  <p><b>Nothing is wrong.</b> The proxy drives <code>hci0</code> over a raw HCI socket rather than through BlueZ &mdash; that is what the <code>privileged</code> in <a href=\"#s13\">section 13</a> buys &mdash; and taking the adapter that way removes it from BlueZ entirely. Every host-side Bluetooth tool goes blind the moment that container starts, and stays blind until it stops. Read that message as <em>the proxy has the radio</em>, which is the state you want.</p>\n  <p>It is also why the installer looks for the adapter in its <code>ble</code> step and nowhere else: that is the last moment in the whole run when the question can still be answered. If it reported <code>no bluetooth controller on this Pi</code> there, the radio really is missing &mdash; on a Pi&nbsp;4 it hangs off a UART and is attached by a service of its own, so <code>systemctl status hciuart bluetooth</code> is where that starts, followed by <code>rfkill list</code> and a <code>dtoverlay=disable-bt</code> line in the boot configuration.</p>\n</div>\n\n<p data-lvl=\"3\">To ask whether the car is in range at all, take the radio back for a minute. Nothing reaches the car while the proxy is stopped, so this is a deliberate borrow rather than something to leave running.</p>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Shell</span><span class=\"path\">on the Raspberry Pi</span></div>\n<pre>docker stop tesla-ble-http-proxy\nbluetoothctl list          <span class=\"c\"># the controller comes back</span>\n\nsudo btmgmt find           <span class=\"c\"># every advertiser, with signal strength</span>\n\ndocker start tesla-ble-http-proxy</pre>\n</div>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">Two tool traps, both measured on 14&nbsp;August&nbsp;2026</span>\n  <p><code>btmgmt</code> and not <code>bluetoothctl scan on</code>, deliberately: piped or run under <code>timeout</code>, bluetoothctl prints <code>SetDiscoveryFilter success</code> and never starts discovery at all &mdash; thirty seconds of silence that reads as an empty band and is nothing of the kind. An hour of this build&rsquo;s diagnosis went to that. And when you do scan, read the <code>name</code> lines printed under each <code>dev_found</code> rather than grepping the <code>dev_found</code> lines alone &mdash; the name is what identifies the car, and it prints on its own line. A second hour went to that.</p>\n  <p>One more line that is not what it looks like: <code>can&rsquo;t accept: listner timed out</code> in the proxy&rsquo;s <code>docker logs</code> is the accept loop&rsquo;s idle timer, present in perfectly healthy runs &mdash; it is not a failed pairing. The line that <em>is</em> a failed scan reads <code>Vehicle is not in range</code>.</p>\n</div>\n\n<p data-lvl=\"3\">The car will not appear under a readable name. Tesla advertises the first sixteen hex characters of the VIN's SHA-1, wrapped in an <code>S</code> and a <code>C</code>, so work out what to look for rather than scanning the list by eye:</p>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Shell</span><span class=\"path\">on the Raspberry Pi</span></div>\n<pre>python3 -c \"import hashlib,sys; print('S'+hashlib.sha1(sys.argv[1].encode()).hexdigest()[:16]+'C')\" YOUR_VIN</pre>\n</div>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>What the scan tells you</caption>\n<thead><tr><th scope=\"col\" style=\"width:34%\">What you see</th><th scope=\"col\">What it means, and what to do</th></tr></thead>\n<tbody>\n<tr><td>One or two devices in a whole minute, where a phone beside the Pi sees dozens</td><td>A desensitised receiver rather than an empty band. On this build that was the history disk on a SuperSpeed port &mdash; <a href=\"#s03\">section 03</a> &mdash; drowning the beacon out; the count doubled the moment the disk moved to a black port. Whatever else is radiating on 2.4&nbsp;GHz, remove it and scan again</td></tr>\n<tr><td>Nothing at all, for a minute</td><td>The radio is receiving nothing whatever, which is not a range problem with one car but a problem with the adapter or its antenna. Back to <code>rfkill list</code> and <code>hciuart</code></td></tr>\n<tr><td>Plenty of devices, no car</td><td>The radio is fine. Wake the car — the app, or open a door — and scan again. A car left alone for hours advertises sparsely, and it has to be awake for the pairing request in any case</td></tr>\n<tr><td>The car, at &minus;90&nbsp;dBm or weaker</td><td>Range. Move the Pi closer, or take a wall out of the path. <a href=\"#s03\">Section 03</a> puts the working distance at 5&ndash;15&nbsp;m through no more than one wall</td></tr>\n<tr><td>The car, at a healthy signal</td><td>Not the radio. The failure is in the pairing sequence itself: the car asleep, the 30-second window missed, the card not flat on the console, or the on-screen confirmation never accepted</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">Before you blame the radio, check what else is on 2.4&nbsp;GHz</span>\n  <p>Two things in this build sit on that band by design. The Pi's Wi-Fi shares one antenna with Bluetooth, which is why <a href=\"#s07\">section 07</a> blocks that radio and the installer does it for you &mdash; confirm with <code>rfkill list</code> that Wi-Fi is blocked and Bluetooth is not. And the USB disk from <a href=\"#s03\">section 03</a> is a 2.4&nbsp;GHz noise source if it is on a SuperSpeed port; the <code>storage</code> step says so during the run, and moving it to a USB&nbsp;2 port costs nothing.</p>\n</div>\n\n<div data-lvl=\"2\" class=\"cmd\">\n<div class=\"lbl\"><span>Browser</span><span class=\"path\">the whole chain, with the real VIN</span></div>\n<pre>http://PI_IP:8080/api/1/vehicles/YOUR_VIN/vehicle_data?endpoints=charge_state&amp;wakeup=true</pre>\n</div>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Response</span><span class=\"path\">abridged</span></div>\n<pre>{\n  \"response\": {\n    \"result\": true,\n    \"reason\": \"The request was successfully processed.\",\n    \"command\": \"vehicle_data\",\n    \"response\": {\n      \"charge_state\": {\n        \"charging_state\":        \"Stopped\",\n        \"charge_limit_soc\":       95,\n        \"battery_level\":          10,\n        \"charger_pilot_current\":  16,\n        \"charge_current_request\": 1,\n        \"charge_amps\":            1,\n        \"charge_port_latch\":      \"Engaged\",\n        \"conn_charge_cable\":      \"IEC\"\n      }\n    }\n  }\n}</pre>\n</div>\n\n<div data-lvl=\"2\" class=\"pass\"><b>Pass ·</b> JSON carrying the battery state means the bridge both reads and commands the car. The first request takes a few seconds while the Bluetooth connection is established. Back up <code>~/TeslaBleHttpProxy/key/</code> now &mdash; the release&rsquo;s backup (<code>maintenance-backup.py</code>) writes it as an archive of its own, it is the one thing in this build that cannot be regenerated from the release, and <a href=\"#s17\">section 17</a> is where restoring it makes a future reinstall skip this whole section.</div>\n\n<p data-lvl=\"3\">The same request is also the diagnostic for this whole section, because its two failures name their own causes. <code>\"Vehicle is not in range: ble: failed to scan for &lt;VIN&gt;: context deadline exceeded\"</code> means the beacon was never heard in the five-second scan — the radio side, so back up to the table above. <code>\"your public key has not been paired with the vehicle\"</code> is the opposite: the scan found the car, the connection opened, and the car turned the key away — the radio path is <em>proven</em>, and what is missing is the ceremony above, or the restored key from <a href=\"#s17\">section 17</a> that makes the ceremony unnecessary.</p>", "cmds": ["docker stop tesla-ble-http-proxy", "bluetoothctl list", "sudo btmgmt find", "docker start tesla-ble-http-proxy", "python3 -c \"import hashlib,sys; print('S'+hashlib.sha1(sys.argv[1].encode()).hexdigest()[:16]+'C')\" YOUR_VIN", "http://PI_IP:8080/api/1/vehicles/YOUR_VIN/vehicle_data?endpoints=charge_state&wakeup=true"]}]}, {"num": "11", "title": "The evcc configuration", "steps": [{"id": "s27", "title": "Overview", "html": "<p class=\"lede\">Two meters, one charger, one vehicle, one loadpoint. You build all four in evcc's own web interface at <code>http://PI_IP:7070</code>, and evcc keeps them in <code>/var/lib/evcc/evcc.db</code>. The installer writes no evcc configuration at all. This section is what each setting means and what a correct result looks like — the screenshots are the dialogs you will be filling in.</p>\n\n<p>evcc is told about the four devices in its own web page &mdash; the two meters, the charger and the car. Screenshots of every dialog, filled in, are below.</p>\n\n<div data-lvl=\"3\" class=\"note blue\">\n  <span class=\"h\">The browser is the only configuration here</span>\n  <p>evcc takes its devices either from the browser, which stores them in <code>/var/lib/evcc/evcc.db</code>, or from <code>/etc/evcc.yaml</code>. The two are exclusive: a file that defines devices wins and the configuration screens go read-only. This build ships no <code>evcc.yaml</code>, so everything below is something you type in.</p>\n</div>", "cmds": []}, {"id": "s28", "title": "The two meters", "html": "<p data-lvl=\"2\">Both are the same inverter on the same port; only the SunSpec unit differs. Unit 1, implicit, is the inverter itself and is the <b>solar meter</b>. Unit 200 is the Fronius Smart Meter at the feed-in point and is the <b>grid meter</b> — the number Solar mode actually steers on. Maximum AC power is the Symo's 6000&nbsp;W rating.</p>\n\n<div data-lvl=\"3\" class=\"note red\">\n  <span class=\"h\">The solar meter is not optional</span>\n  <p>Without a PV meter, evcc has no measured PV figure and derives one from the other two, which forces derived house load to zero — not roughly, but algebraically: substitute the derived figure into evcc's house-load sum and every term cancels. Solar mode itself keeps steering on the measured grid meter, so the control loop survives; what does not is every number the dashboard shows.</p>\n</div>\n\n<div data-lvl=\"2\" class=\"note blue\">\n  <span class=\"h\">Energy Cost Assistant must stay off</span>\n  <p>Both Fronius dialogs carry the same warning: for active charge control to work, ECA must not be activated in Fronius Solar.web — Settings → Operating Mode → Self-Consumption. It has no bearing here in practice, since there is no battery for the inverter to manage.</p>\n</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Solar meter. Same inverter, same port, no unit ID. Validation successful — 16,264.9 kWh lifetime yield, 6.0 kW live.</div>\n\n<div data-lvl=\"3\" class=\"note green\">\n  <span class=\"h\">The check that matters</span>\n  <p>A grid meter that validates but returns only a total is not proof. Per-phase registers are: they show the meter is being read as a meter rather than inferred. Everything Solar mode does depends on this number's <em>sign</em> being right.</p>\n</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Grid meter. Validation returns per-phase current, power and voltage. Total −0.2 kW against per-phase powers of 0.3 / −0.4 / −0.1 kW: internally consistent, and negative, meaning export.</div>", "cmds": []}, {"id": "s29", "title": "The charger", "html": "<p data-lvl=\"2\">evcc's own note in the charger dialog states the constraint the whole architecture follows from: the Wall Connector cannot be controlled directly — control is via the vehicle, and the vehicle must be selected at the loadpoint. The Gen&nbsp;3 also meters itself over <code>/api/1/vitals</code>, which is why the loadpoint has no separate energy meter.</p>\n\n<div data-lvl=\"3\" class=\"note red\">\n  <span class=\"h\">The loadpoint has no energy meter, and that is deliberate</span>\n  <p>The field exists for chargers that cannot measure themselves. Assigning the Fronius Smart Meter to it instead hands evcc the whole-house grid exchange as though it were charge power. Solar mode works out the available surplus from the grid reading and the charge reading together, so when both arrive from the same meter the calculation folds in on itself and the loadpoint is offered less current than the roof is producing. No errors and nothing turns red — the system simply charges slower than it should and exports the difference. I learned this the hard way, cross-checking.</p>\n</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Charger. Validation successful — connected, per-phase current and voltage reported. The Wall Connector doubles as the loadpoint's energy meter, so no dedicated meter is needed.</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Charging current. Three phase, 0.72 kW to 11.5 kW. Maximum 16 A, minimum 1 A.</div>", "cmds": []}, {"id": "s30", "title": "The loadpoint", "html": "<p data-lvl=\"2\">This is where the behaviour is decided. Default mode Solar, with custom thresholds rather than “maximum solar”:</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Loadpoint — as configured</caption>\n<thead><tr><th scope=\"col\" style=\"width:26%\">Setting</th><th scope=\"col\" style=\"width:22%\">Value</th><th scope=\"col\">Why</th></tr></thead>\n<tbody>\n<tr><td>Title</td><td><span class=\"small\">Tesla Wall Connector Gen 3, 22kW, Wi-Fi, Type 2, 32A</span></td><td>Records the hardware and the circuit rating, which the current range no longer does</td></tr>\n<tr><td>Energy meter</td><td><b>none</b></td><td>The Gen&nbsp;3 meters itself</td></tr>\n<tr><td>Default mode</td><td><b>Solar</b></td><td>The mode a vehicle falls into when it connects</td></tr>\n<tr><td>Enable threshold / delay</td><td>0&nbsp;W / 1&nbsp;min</td><td>Start as soon as the minimum can be met for a minute</td></tr>\n<tr><td>Disable threshold / delay</td><td>0&nbsp;W / 10&nbsp;min</td><td>Long enough that a passing cloud does not end the session</td></tr>\n<tr><td>Phases</td><td>3-phase</td><td>As wired</td></tr>\n<tr><td>Default vehicle</td><td>Tesla Model 3</td><td>Always assume this car; auto-detection off</td></tr>\n</tbody>\n</table>\n</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Charging point. Solar mode with custom thresholds, charger type “other” at 1–16 A, three phases, default vehicle assigned with auto-detection off.</div>", "cmds": []}, {"id": "s31", "title": "The vehicle", "html": "<p data-lvl=\"2\">Type <code>tesla-ble</code>, pointed at the BLE proxy on the same Pi. This profile carries the working current band, but it does not overrule the other two: evcc takes the tightest of the loadpoint, charger and vehicle limits — the highest minimum and the lowest maximum. All three are 1–16&nbsp;A here so that the intersection is the band that was intended, rather than one nobody chose.</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Vehicle — as configured</caption>\n<thead><tr><th scope=\"col\" style=\"width:30%\">Setting</th><th scope=\"col\" style=\"width:18%\">Value</th><th scope=\"col\">Effect</th></tr></thead>\n<tbody>\n<tr><td>URI</td><td><code>http://127.0.0.1:8080</code></td><td>The BLE proxy on the same Pi</td></tr>\n<tr><td>Battery capacity</td><td>60&nbsp;kWh</td><td>Plan duration and SoC arithmetic</td></tr>\n<tr><td>Maximum number of phases</td><td>3</td><td>Determines the minimum surplus evcc looks for</td></tr>\n<tr><td>Minimum current</td><td><b>1&nbsp;A</b></td><td>≈720&nbsp;W — the floor Solar mode modulates down to</td></tr>\n<tr><td>Maximum current</td><td><b>16&nbsp;A</b></td><td>≈11.5&nbsp;kW — headroom; the array cannot present this much</td></tr>\n</tbody>\n</table>\n</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> Vehicle. tesla-ble against the local BLE proxy. Advanced settings expanded: three phases, 1–16 A, 6000 W hint. Validation successful — 60.0 kWh, charging, 304 km.</div>", "cmds": []}, {"id": "s32", "title": "Checking that evcc agrees", "html": "<p data-lvl=\"2\">Once the four devices are saved, evcc should report live figures rather than nulls. Nothing in the installer checks this, because nothing in the installer configured it — this one is yours to run:</p>\n\n<div data-lvl=\"2\" class=\"cmd\">\n<div class=\"lbl\"><span>Shell</span><span class=\"path\">on the Raspberry Pi</span></div>\n<pre>curl -s localhost:7070/api/state \\\n  | jq -c '{pv:.pvPower, grid:.grid.power, home:.homePower, lp:[.loadpoints[].chargePower]}'</pre>\n</div>\n\n<div data-lvl=\"2\" class=\"pass\"><b>Pass ·</b> four numbers rather than nulls, and a <code>pv</code> figure that tracks the inverter.</div>\n\n<div class=\"imgstub\"><span class=\"k\">figure</span> evcc, live. 5.4 kW consumed on site against 0.2 kW exported — the whole point of the build, in one bar. The Wall Charger is in Solar mode at 1.6 kW with 2.6 kWh into the session; the car reads 37 % and is charging toward its 100 % limit, 28 h 55 m away at this rate. That figure is not a fault: a surplus-only ceiling on a busy afternoon is slow by design. The empty middle of the page, where a second loadpoint would appear, is cropped out.</div>", "cmds": ["curl -s localhost:7070/api/state | jq -c '{pv:.pvPower, grid:.grid.power, home:.homePower, lp:[.loadpoints[].chargePower]}'"]}]}, {"num": "12", "title": "The charging policy", "steps": [{"id": "s33", "title": "Overview", "html": "<p class=\"lede\">No scheduler, no external controller. The behaviour that keeps the feed-in voltage down comes from four numbers, and every one of them is typed into evcc in the browser — the loadpoint's two delays and the vehicle's two current limits, all four from section 11. The installer asks for none of them.</p>\n\n<p>Four numbers decide everything: start charging at one amp of spare sun, never draw more than sixteen, wait a minute before starting and ten before stopping. The result, measured: over 98&nbsp;% of the roof&rsquo;s output used at home.</p>\n\n<div data-lvl=\"2\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>The four that decide behaviour</caption>\n<thead><tr><th scope=\"col\" style=\"width:30%\">Setting</th><th scope=\"col\" style=\"width:16%\">Value</th><th scope=\"col\">What it buys</th></tr></thead>\n<tbody>\n<tr><td>Vehicle minimum current</td><td><b>1&nbsp;A</b></td><td>How little surplus is worth starting for</td></tr>\n<tr><td>Vehicle maximum current</td><td><b>16&nbsp;A</b></td><td>Enough that evcc is never clipped below the surplus on offer</td></tr>\n<tr><td>Enable delay</td><td><b>60&nbsp;s</b></td><td>Start the moment the minimum is genuinely available</td></tr>\n<tr><td>Disable delay</td><td><b>600&nbsp;s</b></td><td>How long a cloud is tolerated before the session ends</td></tr>\n</tbody>\n</table>\n</div>\n\n<p data-lvl=\"3\">In Solar mode evcc does not hold a current. It tracks the grid exchange and modulates between the minimum and the maximum, so these are not a current — they are a floor, a ceiling and two delays.</p>", "cmds": []}, {"id": "s34", "title": "Why a single amp is worth arguing about", "html": "<p data-lvl=\"3\">Three phases at roughly 240&nbsp;V is 720&nbsp;W per amp. Over a nine-hour window each amp is worth 6.48&nbsp;kWh at the charger.</p>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Current, power, and what a nine-hour window delivers</caption>\n<thead><tr><th scope=\"col\" style=\"width:20%\">Current</th><th scope=\"col\">Power</th><th scope=\"col\">At the charger 10:00–19:00</th><th scope=\"col\">Efficiency</th><th scope=\"col\">SoC added <span class=\"small\">60&nbsp;kWh</span></th></tr></thead>\n<tbody>\n<tr><td><b>1&nbsp;A</b> <span class=\"small\">the floor</span></td><td>0.72&nbsp;kW</td><td>6.5&nbsp;kWh</td><td>~58&nbsp;%</td><td>~6&nbsp;%</td></tr>\n<tr><td>2&nbsp;A</td><td>1.44&nbsp;kW</td><td>13.0&nbsp;kWh</td><td>~75&nbsp;%</td><td>~16&nbsp;%</td></tr>\n<tr><td>3&nbsp;A</td><td>2.16&nbsp;kW</td><td>19.4&nbsp;kWh</td><td>~81&nbsp;%</td><td>~26&nbsp;%</td></tr>\n<tr><td>4&nbsp;A</td><td>2.88&nbsp;kW</td><td>25.9&nbsp;kWh</td><td>~84&nbsp;%</td><td>~36&nbsp;%</td></tr>\n<tr><td>6&nbsp;A</td><td>4.32&nbsp;kW</td><td>38.9&nbsp;kWh</td><td>~87&nbsp;%</td><td>~56&nbsp;%</td></tr>\n<tr><td>8&nbsp;A <span class=\"small\">≈ peak surplus</span></td><td>5.76&nbsp;kW</td><td>51.8&nbsp;kWh</td><td>~89&nbsp;%</td><td>~77&nbsp;%</td></tr>\n</tbody>\n</table>\n</div>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">Why the efficiency column is not a constant</span>\n  <p>Two things are lost. Conversion in the onboard charger costs about 7&nbsp;% of whatever passes through it. The car&rsquo;s housekeeping &mdash; BMS, contactors, thermal loop, 12&nbsp;V DC-DC &mdash; draws on the order of 250&ndash;300&nbsp;W whenever the car is awake, at 1&nbsp;A or at 8&nbsp;A alike. The second term is fixed, so its share grows as the current falls:</p>\n  <p style=\"text-align:center\"><code>η(I) ≈ (720·I − 275) × 0.93 ÷ (720·I)</code></p>\n  <p>That fixed draw is 4.8&nbsp;% of the input at 8&nbsp;A, 19&nbsp;% at 2&nbsp;A and 38&nbsp;% at the 1&nbsp;A floor. The 275&nbsp;W is an estimate rather than a measurement on this car.</p>\n</div>", "cmds": []}, {"id": "s35", "title": "The floor: 1 A", "html": "<p data-lvl=\"3\">About 720&nbsp;W of surplus before a session starts, and the least the car will accept. Reaching it is why the Bluetooth bridge exists rather than settling for the 6&nbsp;A pilot floor, which would demand 4.3&nbsp;kW before anything happened.</p>\n\n<p data-lvl=\"4\">The floor does no voltage work. The voltage problem happens at solar noon on a clear day, and at solar noon the loadpoint is nowhere near its minimum. The floor engages on marginal days and in the shoulder hours — when the feed-in point is nowhere near curtailment. Moving it cannot cost the installation any voltage margin.</p>\n\n<p data-lvl=\"4\">The gain is front-loaded. Amortising a fixed 275&nbsp;W across a doubling of input is worth +18 points from 1 to 2&nbsp;A, +6 from 2 to 3&nbsp;A and +3 from 3 to 4&nbsp;A. Above 3&nbsp;A the setting stops mattering.</p>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">1&nbsp;A is capture-optimal; 2&nbsp;A is efficiency-optimal</span>\n  <p>The choice is what to do with a weak day: take the energy at a poor conversion rate, or export it and take nothing. <b>This installation takes the energy.</b> Setting 2&nbsp;A instead would also be defensible.</p></div>", "cmds": []}, {"id": "s36", "title": "Why the two delays are not symmetrical", "html": "<p data-lvl=\"3\">One minute to start, ten to stop. A sink whose job is to be available should start eagerly and stop reluctantly.</p>\n\n<p data-lvl=\"4\">They cost different things. A long disable delay costs import: riding out a cloud at the 1&nbsp;A floor draws 720&nbsp;W for the duration — 0.12&nbsp;kWh across the full ten minutes. A long enable delay costs availability, which is worse: sun breaks are often shorter than five minutes, so a five-minute enable delay would leave the loadpoint idle through precisely the events it exists to absorb.</p>\n\n<p data-lvl=\"4\">The low floor is what makes the long disable delay affordable. <b>Import is money; export is voltage.</b> This installation is tuned for <b>voltage</b>, so the delays sit at 1 and 10.</p>", "cmds": []}, {"id": "s37", "title": "The ceiling: 16 A", "html": "<p data-lvl=\"3\">The ceiling exists so evcc is never clipped below the surplus on offer. It is not a target and it is never reached: the inverter caps at 6&nbsp;kW AC, so the largest surplus this array can present is about 8.3&nbsp;A — and that assumes a house drawing nothing. In practice the loadpoint spends the middle of the day between 3 and 6&nbsp;A.</p>\n\n<p data-lvl=\"4\">Anything above 8.3&nbsp;A behaves identically, so 16&nbsp;A is headroom rather than a control. A ceiling set below peak surplus would not be: at 6&nbsp;A the loadpoint would be held back on the best hours of the best days, and the remainder would go to the street.</p>\n\n<div data-lvl=\"2\" class=\"note green\">\n  <span class=\"h\">What the arrangement achieves</span>\n  <p>A representative afternoon: 6.05&nbsp;kW off the roof, 3.70&nbsp;kW to the house, 2.25&nbsp;kW to the car, 97&nbsp;W exported — better than 98&nbsp;% consumed on site.</p>\n  <p><b>Phase voltage does not go above 250&nbsp;V. The inverter never reaches its 253&nbsp;V threshold, so no production is thrown away — and the feed-in point is not being pushed up into the neighbours' equipment either. Voltage rise on a shared feeder is a shared problem; energy consumed on site never travels far enough to become one.</b></p></div>", "cmds": []}, {"id": "s38", "title": "The window, without a scheduler", "html": "<p data-lvl=\"3\">evcc has no “do not start before” setting and this build does not add one. Solar mode's own arithmetic lands the session close to the intended window: charging begins when surplus exceeds the minimum and ends when it does not. In high summer sessions have started just before eight in the morning and tapered out through the evening.</p>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>How to shift the behaviour</caption>\n<thead><tr><th scope=\"col\" style=\"width:32%\">You want…</th><th scope=\"col\">Change</th></tr></thead>\n<tbody>\n<tr><td>More voltage headroom at midday</td><td>Raise the vehicle maximum current. Each amp is 720&nbsp;W taken off the export.</td></tr>\n<tr><td>Fewer start/stop cycles on a broken day</td><td>Raise the disable delay further, or raise the minimum current. Do not shorten its counterpart — see the asymmetry above.</td></tr>\n<tr><td>A better conversion rate on weak days</td><td>Raise the minimum to 2&nbsp;A. The floor moves from ~58&nbsp;% to ~75&nbsp;% efficient, at the cost of not charging at all when surplus stays under 1.44&nbsp;kW.</td></tr>\n<tr><td>A guaranteed daily amount</td><td>Set the vehicle's SoC limit and let the long tail of the day fill it.</td></tr>\n<tr><td>Never import while charging</td><td>Lower the maximum current, and set the enable threshold below 0&nbsp;W — a negative value is export, so −200&nbsp;W means 200&nbsp;W of genuine surplus must be there before a session starts. Raising it above 0&nbsp;W does the opposite: it permits that much import. The disable threshold takes positive values only.</td></tr>\n</tbody>\n</table>\n</div>", "cmds": []}]}, {"num": "13", "title": "The custom files", "steps": [{"id": "s39", "title": "Overview", "html": "<p class=\"lede\">Thirty-nine files in one directory: eleven scripts, the seventeen units that run them, five environment templates, three compose stacks, Telegraf&rsquo;s configuration, the dashboard and the two-line sudoers file the board&rsquo;s buttons cross. The package places all thirty-nine under <code>/usr/lib/solar-surplus/files/</code>, with <code>install.py</code> and <code>selftest.py</code> one level above them; the installer that follows renders only configuration &mdash; never a line of code &mdash; which is why the two can never undo each other&rsquo;s work. <a href=\"#s17\">Section 17</a> lists where every one of them lands. Each file below is quoted with its long header comments trimmed and the installer&rsquo;s substitutions left as placeholders.</p>\n\n<p>Thirty small files do the housekeeping &mdash; the loggers, the evening window that backs up, updates and reboots the machine, and the three container recipes. The package places the code, the installer writes the configuration, and none of the code contains a secret.</p>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">Every file is published unredacted, and that is a design decision</span>\n  <p>No script in this build contains a secret, which is what lets them be world-readable on the Pi and printed in full here. The shell scripts ship inside the package at mode 755 root:root, and the one Python file beside them at 644 because its unit invokes <code>python3</code> by path rather than running the file &mdash; anyone may read them, only root may change them &mdash; and the secrets live in three of the four environment files under <code>/etc/default</code>, at mode 600, written by the installer and by nothing else. Keeping the two apart is what makes the rule enforceable rather than merely intended: a secret written into a script would be a secret in the deb, published on the releases repository, and identical on every machine that ever installed it.</p>\n</div>", "cmds": []}, {"id": "s40", "title": "13.1 · The loggers", "html": "<p data-lvl=\"3\"><b>/usr/lib/solar-surplus/files/grid-voltage-logger.sh</b> <span class=\"small\">mode 755</span> reads the Smart Meter&rsquo;s three phase voltages from the Solar API every 15 seconds and writes them to InfluxDB. evcc does not publish them, and they are the entire voltage half of the dashboard. It refuses to start on a missing or malformed setting, writes only when all three phases parsed and each falls between 150 and 300&nbsp;V, and logs an unreachable inverter or a failed write once per streak rather than once per attempt. Two of its guards exist because neither failure looks like one: a carriage return surviving from a file edited on Windows, and <code>curl</code> quietly filling in <code>http://</code> and port 80 for an address written without them. It is also the one long-running reader of the environment file below, so it takes a rewritten copy in only at a restart &mdash; which is why the installer restarts it on any run that rewrote that file, and only on such a run.</p>\n\n<p data-lvl=\"3\"><b>/usr/lib/solar-surplus/files/pi-throttled.sh</b> <span class=\"small\">mode 755</span> is cut from the same cloth and writes the firmware&rsquo;s throttle word &mdash; under-voltage, frequency capped, throttled and soft temperature limit, each both now and since boot &mdash; into the <code>system</code> bucket every 30 seconds. It lives on the host rather than inside Telegraf because the 6.x kernels removed the sysfs node the container used to read: the word now answers only at the firmware mailbox, and the mailbox does not reach into a container. It still prefers a <code>get_throttled</code> node where one exists and falls back to <code>vcgencmd</code> where one does not, and a word it cannot read or cannot parse writes no point at all &mdash; no point is better than a wrong point. Its settings sit in <code>/etc/default/pi-throttled</code> at mode 600, one of the three files that carry a secret: the Telegraf write token, good on the <code>system</code> bucket and nowhere else.</p>\n\n<p data-lvl=\"3\"><b>/usr/lib/solar-surplus/files/version-logger.sh</b> <span class=\"small\">mode 755</span> records what is installed against what is released &mdash; evcc, Grafana, InfluxDB, the BLE proxy and the stack itself &mdash; plus the count of pending OS package upgrades. Installed versions are read locally: <code>dpkg-query</code> for evcc, the two services&rsquo; own health endpoints, the running container&rsquo;s image tag for the BLE proxy, and <code>/etc/solar-surplus/release</code> for the stack. Released versions come from five unauthenticated GitHub calls per run, against a limit of sixty an hour. One point per component, into measurement <code>versions</code>.</p>\n\n<p data-lvl=\"3\">It is scheduled and triggered both. <code>version-logger.timer</code> fires it every quarter hour at ten past &mdash; the owner&rsquo;s ruling, up from hourly, its release-lookup cache shortened to fifteen minutes with it so the GitHub spend stays near a third of the unauthenticated budget &mdash; so that a row on the board can never leave you wondering whether it is wrong or merely unread, and a same-evening release reaches the <i>Latest</i> column in minutes. The boot report starts it as its last act, once the booted stack can actually answer, and that is still the reading that matters most: taken any earlier, a probe races containers still warming up, reads <code>unknown</code>, and the table then lies until something repaints it. <code>update-runner.sh</code> runs the file again after every outcome that ends a run, so a stale row can never outlive the refusal it caused. The service itself carries no <code>[Install]</code> section &mdash; the timer beside it does. Scheduled is not the same as boot-started, and it is boot-started that costs the grey row.</p>\n\n<p data-lvl=\"4\">The file is also a library. Sourced with <code>VERSION_LOGGER_LIB=1</code> it returns before doing any work and leaves <code>parse()</code>, <code>state_for()</code>, <code>slug_for()</code>, <code>probe()</code>, <code>os_pending()</code> and <code>RELEASES_REPO</code> defined. That is how the update runner answers &ldquo;is this component actually behind?&rdquo; with the same code that painted the table, how a component name typed one way reaches the same case arm as the same name typed another, and how the runner knows which repository to fetch the next release from &mdash; the name of that repository is written on the Pi in this one file.</p>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Environment file</span><span class=\"path\">/etc/default/grid-voltage-logger &middot; mode 600</span></div>\n<pre><span class=\"c\"># ---- shared ---------------------------------------------------------</span>\nTOKEN=REPLACE_WITH_YOUR_INFLUXDB_TOKEN\nINFLUX=http://PI_IP:8086\nORG=home\nBUCKET=evcc\n\n<span class=\"c\"># ---- grid-voltage-logger only ---------------------------------------</span>\nINVERTER=INVERTER_IP\nINTERVAL=15\n\n<span class=\"c\"># ---- version-logger only --------------------------------------------</span>\n<span class=\"c\"># Version endpoints: unauthenticated, loopback &mdash; keep as localhost.</span>\nGRAFANA=http://localhost:3000\nINFLUXDB_URL=http://localhost:8086</pre>\n</div>\n\n<p data-lvl=\"3\">One file, one copy of the InfluxDB token &mdash; and six units read it, not two. Both loggers take their settings here, and <code>update-runner@.service</code>, <code>maintenance-backup.service</code>, <code>maintenance-reboot.service</code> and <code>maintenance-report.service</code> all name it as an <code>EnvironmentFile</code> as well, because every one of them writes an outcome point and not one of them may carry a token of its own. It is the bucket-scoped token the installer minted, not the instance admin token, so the worst anything holding it can do is write to the <code>evcc</code> bucket. <code>GRAFANA</code> and <code>INFLUXDB_URL</code> stay on loopback because the version logger asks those two services about themselves from the same machine, and <code>localhost</code> outlives every DHCP lease a LAN address does not.</p>", "cmds": ["TOKEN=REPLACE_WITH_YOUR_INFLUXDB_TOKEN", "INFLUX=http://PI_IP:8086", "ORG=home", "BUCKET=evcc", "INVERTER=INVERTER_IP", "INTERVAL=15", "GRAFANA=http://localhost:3000", "INFLUXDB_URL=http://localhost:8086"]}, {"id": "s41", "title": "13.2 · The update path", "html": "<p data-lvl=\"3\">There is one door, and it is narrow on purpose. <code>window-agent</code> listens on port 9101 with two routes that do one thing each &mdash; one starts the whole evening window, backup, ladder and guarded reboot, as one ordered run of <code>maintenance-window.service</code>; the other starts <code>maintenance-clearlog.service</code>, the single marker point that begins the Tonight view afresh without deleting a row &mdash; and it can start nothing else: the two sudoers lines behind it grant exactly those commands. The updates themselves are still systemd talking to itself. Three timers open a window every evening, one orchestrator decides the order, one runner does the work behind its gates, and every outcome is a point in InfluxDB before the owner sleeps. From a shell the same path is one command &mdash; <code>sudo systemctl start update-runner@evcc.service</code> &mdash; and that is the form worth reaching for the first few times, because the journal shows each gate as it is passed.</p>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>The evening window, four acts</caption>\n<thead><tr><th scope=\"col\" style=\"width:16%\">When</th><th scope=\"col\" style=\"width:30%\">What starts</th><th scope=\"col\">And what it does</th></tr></thead>\n<tbody>\n<tr><td>22:30</td><td>maintenance-window.timer</td><td>The whole window as ONE ordered run &mdash; the same <code>maintenance-window.service</code> the board&rsquo;s Do&nbsp;the&nbsp;needful button starts, so a timed night and a pressed one are one routine to the byte. It queues the three legs below; the <code>After=</code> edges hold each behind the one before it</td></tr>\n<tr><td>first leg</td><td>maintenance-backup.service</td><td>One archive per component to the Samba share, every push proved by fetching the copy back and comparing sha256. The state a bad night rolls back to is the state before any update touched anything, so the backup goes first</td></tr>\n<tr><td>second leg</td><td>maintenance-update.service</td><td><code>maintenance-update.sh</code>, the ladder: six runner instances started in a fixed order, each waited on to the end</td></tr>\n<tr><td>last leg</td><td>maintenance-reboot.service</td><td><code>maintenance-reboot.sh</code>, the guarded reboot &mdash; the cold-boot path rehearsed on purpose every day, rather than discovered unrehearsed after a power cut</td></tr>\n<tr><td>on boot</td><td>maintenance-report.service</td><td>Waits up to ten minutes for evcc, Grafana, InfluxDB and the BLE proxy on 7070, 3000, 8086 and 8080, writes what answered and what did not, then takes the day's first version reading</td></tr>\n</tbody>\n</table>\n</div>\n\n<p data-lvl=\"3\">The times are not arbitrary. 22:30 is after civil twilight even on the year&rsquo;s latest sunset, so the window can never compete with surplus charging on any day of the year; and the whole of it clears the 03:00 to 04:00 hour where the daylight-saving changes do their arithmetic. InfluxDB is gated on <code>/health</code> answering 200 rather than on port 8086 merely accepting, because a cold database opens its port long before it can answer, and a version probe that races that gap writes <code>unknown</code> into a row nothing repaints until the next trigger.</p>\n\n<p data-lvl=\"3\"><b>/usr/lib/solar-surplus/files/maintenance-update.sh</b> <span class=\"small\">mode 755</span> supplies order and nothing else. It starts <code>update-runner@solar-surplus</code>, then <code>evcc</code>, <code>grafana</code>, <code>influxdb</code>, then <code>raspberry-pi-os</code>, waiting for each &mdash; <code>systemctl start</code> on a one-shot blocks until it exits. The stack goes first, so a new release&rsquo;s pins and payloads govern the rest of the night; the OS goes last, because it is the one that can want a reboot and the window ends in one anyway. A failed instance is logged and the ladder carries on: each runner writes its own outcome point, and one component&rsquo;s bad night must not cost the other four theirs. The BLE proxy is deliberately not in the ladder at all &mdash; the pins note at the end of 13.4 says why.</p>\n\n<p data-lvl=\"3\"><b>/usr/lib/solar-surplus/files/update-runner.sh</b> <span class=\"small\">mode 755</span> updates one component and records what happened. It runs as root, because apt and docker do. Six component names are valid &mdash; <code>evcc</code>, <code>grafana</code>, <code>influxdb</code>, <code>tesla-ble-proxy</code>, <code>raspberry-pi-os</code>, and <code>solar-surplus</code>, the stack updating itself &mdash; and anything else exits without writing a point at all, because a mistyped unit name is a mistake, not an outcome.</p>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Six words, one point each, into measurement <code>updates</code></caption>\n<thead><tr><th scope=\"col\" style=\"width:22%\">Outcome</th><th scope=\"col\">What it means</th></tr></thead>\n<tbody>\n<tr><td><code>started</code></td><td>Written once every gate has passed and before the first byte is fetched, so a run that hung or rebooted stops visibly here. A run that gets this far writes two points: this one, then the word it ends on</td></tr>\n<tr><td><code>ok</code></td><td>The work was done, and the message names the version now installed</td></tr>\n<tr><td><code>current</code></td><td>Already up to date, or nothing pending. The healthy no-op, not a refusal</td></tr>\n<tr><td><code>approval</code></td><td>A MAJOR update is waiting for the owner&rsquo;s yes, and the message names the command that gives it</td></tr>\n<tr><td><code>refused</code></td><td>A gate held: another update already running, a version that cannot be read, or a pin only a person may move</td></tr>\n<tr><td><code>failed</code></td><td>Something the runner attempted did not work, and the message names the step it died on</td></tr>\n</tbody>\n</table>\n</div>\n\n<p data-lvl=\"4\"><code>current</code> exists because <code>refused</code> used to cover both &ldquo;nothing to do&rdquo; and &ldquo;I will not do it&rdquo;, and the board could not tell the healthy row from the guarded one: a perfectly quiet night read as a refusal. Splitting the two was the whole of that change, and it is why a quiet night now reads green. The four outcomes that end a run cleanly &mdash; <code>ok</code>, <code>current</code>, <code>approval</code> and <code>refused</code> &mdash; repaint the versions table before the run exits, the runner executing <code>version-logger.sh</code> directly rather than waiting for anything, because a refusal caused by a stale row has to cure the row that caused it, or the board and the runner disagree for ever. <code>failed</code> is the exception, and deliberately so: a run that died stops where it died and repaints nothing, so the row keeps whatever it said until the next trigger.</p>\n\n<p data-lvl=\"3\">Four gates run in order, and every one of them runs before <code>started</code> is written, so nothing that never began writes one:</p>\n\n<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>What a run has to get past</caption>\n<thead><tr><th scope=\"col\" style=\"width:26%\">Gate</th><th scope=\"col\">What it does</th></tr></thead>\n<tbody>\n<tr><td>The runner&rsquo;s lock</td><td><code>flock -n</code> on <code>/run/lock/update-runner.lock</code>. One update at a time, and the second one refuses at once rather than queueing behind the first</td></tr>\n<tr><td>The name</td><td>One of the six, after the same <code>slug_for()</code> the versions table used, so &ldquo;Raspberry Pi OS&rdquo; and the unit name reach the same arm</td></tr>\n<tr><td>The re-probe</td><td>The version question is asked again, with the library the table was painted from. <code>current</code> records that and stops; a version that cannot be read is refused rather than upgraded blind. The OS row is exempt, because it counts pending packages instead of comparing versions and the count is only known after <code>apt-get update</code></td></tr>\n<tr><td>The pin</td><td>For the compose-backed components: whether the released version is inside the pinned track, a minor or patch past it, or a MAJOR beyond it</td></tr>\n</tbody>\n</table>\n</div>\n\n<p data-lvl=\"3\">That last gate is the permission boundary, and it is the owner&rsquo;s rule written down: update by default, ask for a major, defer nothing. A minor or a patch past the pinned track is simply taken and the pin raised to the new track in the same run &mdash; that is the standing yes. A MAJOR is the one change that can alter behaviour somebody would have to relearn, so it is the single question this stack is allowed to put to its owner: the run records <code>approval</code>, names the command in its own message, and stops. The answer is a unit, not a click.</p>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>By hand</span><span class=\"path\">systemctl, and nothing else</span></div>\n<pre>sudo systemctl start update-runner@evcc.service\njournalctl -u update-runner@evcc.service -f     <span class=\"c\"># every gate, as it is passed</span>\n\nsudo systemctl start update-runner@grafana-raise.service\n<span class=\"c\">…the recorded yes to a major: raise the pin and take it, in one run…</span></pre>\n</div>\n\n<p data-lvl=\"4\"><code>-raise</code> is the only instruction suffix left in the system: <code>-force</code> retired along with the charge guard it existed to skip, and with it went the guard&rsquo;s HTTP probe into evcc&rsquo;s API and the setting that turned it on. The suffix is a word about the pin, not about the gates &mdash; it raises the pin to the released version&rsquo;s MAJOR.MINOR track and updates in the same run, and on a component with no compose pin it is simply the plain run. It is stripped from the name before anything else looks at it, so the rest of the run sees an ordinary component. Where the raised pin is written, and why in two places, is the last note of 13.4.</p>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Environment file</span><span class=\"path\">/etc/default/update-runner &middot; mode 600</span></div>\n<pre>MONITORING_DIR=/home/USERNAME/monitoring\nBLE_DIR=/home/USERNAME/TeslaBleHttpProxy</pre>\n</div>\n\n<p data-lvl=\"4\">Two lines, and both absolute on purpose: the unit runs as root, whose <code>~</code> is <code>/root</code> and not yours. What used to sit under them has gone with the charge guard, on the owner&rsquo;s arithmetic &mdash; five minutes of interrupted charging against days spent debugging a stack that had quietly skipped its updates every sunny evening. The InfluxDB token is not here either: the unit names <code>/etc/default/grid-voltage-logger</code> as a second <code>EnvironmentFile</code>, so the token stays in exactly one place on the machine. The runner then re-sources both files itself with <code>set -a</code>, which is what makes a run started by hand behave identically to one started by the ladder, and what lets the version logger it starts as a child inherit the same settings.</p>\n\n<p data-lvl=\"4\">The <code>solar-surplus</code> arm is the stack updating itself, and it climbs the ladder a person climbs on a fresh Pi. It downloads the <code>get.py</code> that shipped <em>with</em> the release being installed, so ladder and payload always agree; that script verifies the sha256 &mdash; a mismatch is the end, not a retry &mdash; runs the release&rsquo;s own <code>selftest.py</code> inside the extracted tree before anything touches the system, hands the verified deb to <code>apt-get</code>, and runs <code>install.py --force</code> in the foreground where the runner&rsquo;s journal can watch it. There is no second code path: the idempotent installer <em>is</em> the updater. <code>dpkg</code> replaces the running <code>update-runner.sh</code> in the middle of all this, which is safe because <code>dpkg</code> unpacks beside the file and renames over it, and this shell goes on reading the inode it already opened.</p>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">Two locks, and they are not the same lock</span>\n  <p><code>/run/lock/update-runner.lock</code> is the runner&rsquo;s own, taken with <code>flock -n</code>: an instance that cannot have it refuses immediately. <code>/run/lock/maintenance.lock</code> belongs to the window &mdash; the backup holds it while it works, the ladder waits up to thirty minutes to take it and then keeps it for the whole climb, and hands it on. The orchestrator must never touch the runner&rsquo;s lock, because every instance it starts takes that one for itself and would be refused by its own parent.</p>\n  <p>The reboot leg refuses first, before it waits on anything at all, to reboot a machine that booted less than a quarter of an hour ago &mdash; a catch-up firing moments after a boot rehearses nothing, and could cut down a backup the same catch-up had just started; there is no reason to spend an hour on the locks to refuse for a reason already known. Only then does it wait on both, up to thirty minutes each, and if either never frees it defers with a recorded reason rather than acting: a reboot in the middle of a <code>dpkg</code> run is how systems die. Both locks live in <code>/run/lock</code> rather than <code>/tmp</code>, because every unit that touches them runs with <code>PrivateTmp=yes</code> and would otherwise be locking a private directory of its own, which is no lock at all.</p>\n</div>", "cmds": ["sudo systemctl start update-runner@evcc.service", "journalctl -u update-runner@evcc.service -f # every gate, as it is passed", "sudo systemctl start update-runner@grafana-raise.service", "…the recorded yes to a major: raise the pin and take it, in one run…", "MONITORING_DIR=/home/USERNAME/monitoring", "BLE_DIR=/home/USERNAME/TeslaBleHttpProxy"]}, {"id": "s42", "title": "13.3 · The units", "html": "<div data-lvl=\"3\" class=\"tw\" tabindex=\"0\">\n<table>\n<caption>Seventeen units, and what each one is for</caption>\n<thead><tr><th scope=\"col\" style=\"width:40%\">Unit</th><th scope=\"col\">Shape</th></tr></thead>\n<tbody>\n<tr><td>grid-voltage-logger.service</td><td>Long-running. <code>Restart=always</code> with a 30-second gap; <code>After=</code> names docker and evcc so the logger does not start writing before the stack it writes into exists. Hardened, and <code>PrivateTmp=yes</code> is required rather than decorative &mdash; the script writes <code>curl</code> scratch files to fixed <code>/tmp</code> paths as root</td></tr>\n<tr><td>pi-throttled.service</td><td>The same shape for the firmware&rsquo;s throttle word, which no container can reach: the 6.x kernels keep it behind the firmware mailbox. Writes to the <code>system</code> bucket</td></tr>\n<tr><td>version-logger.service</td><td>One-shot, <code>ProtectSystem=full</code>, <code>ProtectHome=yes</code> &mdash; it only reads. No <code>[Install]</code> of its own: <code>version-logger.timer</code> carries it and fires every quarter hour at ten past, so the service is scheduled without ever being boot-started</td></tr>\n<tr><td>update-runner@.service</td><td>A template, one instance per component. No <code>[Install]</code> &mdash; started by the ladder or by hand. <code>TimeoutStartSec=7200</code>, because a <code>full-upgrade</code> must never be killed mid-<code>dpkg</code>; <code>Nice=10</code> and <code>IOSchedulingClass=idle</code> keep apt out of the charge loop&rsquo;s way; and deliberately no <code>ProtectSystem</code> or <code>ProtectHome</code>, since apt writes to <code>/usr</code> and <code>/etc</code> and both compose files live under <code>/home</code></td></tr>\n<tr><td>maintenance-window.timer</td><td>22:30 daily, <code>Persistent=true</code>, no randomised delay &mdash; the evening&rsquo;s ONE schedule since v2.38, and what it starts is the same window unit the board&rsquo;s button starts</td></tr>\n<tr><td>maintenance-backup.service</td><td>One-shot, <code>python3 maintenance-backup.py</code>. Ninety minutes allowed, because the history archive crosses the LAN twice &mdash; once to push it, once to fetch it back and prove it</td></tr>\n<tr><td>maintenance-update.service</td><td>One-shot, the ladder. <code>After=maintenance-backup.service</code>; five hours allowed, which is the thirty-minute lock wait plus six sequential worst cases with headroom &mdash; selftest derives the count from the ladder&rsquo;s own loop, so the arithmetic can no longer age past its components</td></tr>\n<tr><td>maintenance-reboot.service</td><td>One-shot, the guarded reboot. <code>After=</code> names both the backup and the ladder; 75 minutes allowed, which is two lock waits of half an hour each plus the uptime check and the outcome point</td></tr>\n<tr><td>maintenance-report.service</td><td>One-shot, and the only part of the window that is boot-started rather than timed: <code>WantedBy=multi-user.target</code>. Ten minutes on the four ports, one point, one triggered start</td></tr>\n<tr><td>bt-unblock.service</td><td>One-shot <code>rfkill unblock bluetooth</code>, ordered <code>Before=bluetooth.service</code></td></tr>\n<tr><td>maintenance-window.service</td><td>One-shot: the whole evening window &mdash; its script queues the backup, the ladder and the reboot in one <code>systemctl</code> run and the <code>After=</code> edges order them, the same machinery a Persistent catch-up exercises. No <code>[Install]</code> on the service &mdash; the timer beside it carries the enablement, and the board&rsquo;s button starts the same unit through window-agent, or you do</td></tr>\n<tr><td>maintenance-clearlog.service</td><td>One-shot: the Clear-log press &mdash; writes the single marker point that starts the Tonight view afresh through the grid-voltage-logger token, deleting nothing. No <code>[Install]</code> and no timer: the board&rsquo;s button starts it through window-agent, or you do</td></tr>\n<tr><td>window-agent.service</td><td>Long-running, the button&rsquo;s door: an unprivileged listener on 9101 whose only root paths are the two sudoers lines naming <code>systemctl start --no-block maintenance-window.service</code> and <code>systemctl start maintenance-clearlog.service</code>. <code>Restart=on-failure</code>, except exit 78 &mdash; a bad token or origin list stops once instead of restart-looping</td></tr></tbody>\n</table>\n</div>\n\n<p data-lvl=\"4\">The window&rsquo;s one timer carries no <code>RandomizedDelaySec</code>, and the absence is the design: one Pi, one owner, one fixed half-past-ten. It carries <code>Persistent=true</code>, which replays a fire the machine slept through at its next boot &mdash; the whole window, elapsed as one. The ordering is written down exactly once, as <code>After=</code> dependencies: every window &mdash; timed, pressed or replayed &mdash; queues the three legs together, <code>maintenance-update.service</code> is ordered after the backup, and <code>maintenance-reboot.service</code> after both, so it always runs in the only order that is safe; the two locks then hold whatever the ordering does not.</p>\n\n<p data-lvl=\"4\"><code>Persistent=true</code> on a <em>reboot</em> timer has a consequence worth saying out loud: a Pi that was off through the evening will take its missed reboot shortly after its next boot, daylight included. The script&rsquo;s guards apply to the replay exactly as they apply to the evening, and one of them exists for this case alone &mdash; within the first quarter hour of a boot the only right reboot is none, because a machine that booted minutes ago has just rehearsed the very thing the reboot exists to rehearse. A long replay can still end in a guarded reboot in daylight; that is the catch-up doing its job, late.</p>", "cmds": []}, {"id": "s43", "title": "13.4 · The three container stacks", "html": "<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Compose file</span><span class=\"path\">~/TeslaBleHttpProxy/docker-compose.yml</span></div>\n<pre>services:\n  tesla-ble-http-proxy:\n    image: wimaha/tesla-ble-http-proxy:2.3.0\n    container_name: tesla-ble-http-proxy\n    volumes:\n      - /home/USERNAME/TeslaBleHttpProxy/key:/key    <span class=\"c\">…written in by the installer…</span>\n      - /var/run/dbus:/var/run/dbus\n    restart: always\n    privileged: true\n    network_mode: host\n    cap_add:\n      - NET_ADMIN\n      - SYS_ADMIN</pre>\n</div>\n\n<p data-lvl=\"3\">The command path to the car. <code>network_mode: host</code> and the dbus mount give the container the Pi&rsquo;s own Bluetooth adapter; <code>privileged</code> is what the project requires. It is the most privileged container on the machine. The two <code>cap_add</code> lines add nothing at runtime &mdash; <code>privileged</code> already grants every capability &mdash; and are written out only so this file matches the upstream README line for line, which is what makes a future divergence visible. The <code>key/</code> directory beside it holds the pairing and cannot be recreated from the release.</p>\n\n<p data-lvl=\"4\">&ldquo;Give the container the adapter&rdquo; is literal, and it has a consequence worth knowing before you need it. The proxy drives <code>hci0</code> over a raw HCI socket rather than through BlueZ, which takes the adapter out of BlueZ&rsquo;s hands entirely &mdash; so while this container runs, <code>bluetoothctl</code> on the Pi reports no controller at all. That is the normal state, it is what the installer prints as it starts the container, and <a href=\"#s10\">section 10</a> has the borrow-it-back sequence for the one case where you do need to look at the radio yourself.</p>\n\n<div data-lvl=\"4\" class=\"note red\">\n  <span class=\"h\">The key mount is an absolute path, and has to be</span>\n  <p>Compose expands a <code>~</code> against the <code>HOME</code> of whoever runs <code>docker compose</code> &mdash; and the installer runs it as root. A <code>~</code> here would put the pairing key under root&rsquo;s home: outside the login user&rsquo;s home, outside the archive that <a href=\"#s17\">section 17</a> makes, and gone with the card. So the installer writes the real path in at install time, and <code>selftest.py</code> refuses any compose file that mounts a host path through a <code>~</code>.</p>\n  <p>The mount Docker resolved is readable at any time, and worth reading once before trusting a backup: <code>docker inspect tesla-ble-http-proxy --format '{{range .Mounts}}{{.Source}}{{\"\\n\"}}{{end}}'</code>. The source has to be under your own home, because that is the only place the backup looks.</p>\n</div>\n\n<div data-lvl=\"3\" class=\"cmd\">\n<div class=\"lbl\"><span>Compose file</span><span class=\"path\">~/monitoring/docker-compose.yml</span></div>\n<pre>services:\n  influxdb:\n    image: influxdb:${INFLUXDB_PIN:-2.9}\n    container_name: influxdb\n    restart: unless-stopped\n    ports:\n      - \"8086:8086\"\n    volumes:\n      - influxdb-data:/var/lib/influxdb2\n      - influxdb-config:/etc/influxdb2\n    environment:\n      - DOCKER_INFLUXDB_INIT_MODE=setup\n      - DOCKER_INFLUXDB_INIT_USERNAME=admin\n      - DOCKER_INFLUXDB_INIT_PASSWORD=<span class=\"c\">…generated…</span>\n      - DOCKER_INFLUXDB_INIT_ORG=home\n      - DOCKER_INFLUXDB_INIT_BUCKET=evcc\n      - DOCKER_INFLUXDB_INIT_RETENTION=0\n      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=<span class=\"c\">…generated…</span>\n    healthcheck:\n      test: [\"CMD\", \"influx\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 12\n      start_period: 30s\n\n  grafana:\n    image: grafana/grafana:${GRAFANA_PIN:-13.2}\n    container_name: grafana\n    restart: unless-stopped\n    ports:\n      - \"3000:3000\"\n    environment:\n      - GF_INSTALL_PLUGINS=lehmannch-flow-panel\n      - GF_SECURITY_ADMIN_PASSWORD=<span class=\"c\">…generated…</span>\n    volumes:\n      - grafana-data:/var/lib/grafana\n    depends_on:\n      influxdb:\n        condition: service_healthy\n\nvolumes:\n  influxdb-data:\n    driver: local\n    driver_opts:\n      type: none\n      o: bind\n      device: /mnt/influxdb/data      <span class=\"c\">…written in by the installer…</span>\n  influxdb-config:\n    driver: local\n    driver_opts:\n      type: none\n      o: bind\n      device: /mnt/influxdb/config\n  grafana-data:</pre>\n</div>\n\n<p data-lvl=\"3\">InfluxDB self-initialises on first start only &mdash; organisation, bucket, admin user and admin token &mdash; so changing these afterwards has no effect on data that already exists. <code>RETENTION=0</code> keeps every point forever, which is what puts these two volumes on the USB disk from <a href=\"#s03\">section 03</a> and leaves <code>grafana-data</code> on the card. <code>GF_INSTALL_PLUGINS</code> pulls the Solar Flow panel from Grafana&rsquo;s catalogue on first start and writes it into the <code>grafana-data</code> volume; the Pi needs to reach <code>grafana.com</code> that once, and <code>docker logs grafana</code> names the reason if it cannot.</p>\n\n<div data-lvl=\"4\" class=\"note red\">\n  <span class=\"h\">Why a named volume with a bind device, and not a plain bind mount</span>\n  <p>The obvious way to put InfluxDB on the disk is <code>- /mnt/influxdb/data:/var/lib/influxdb2</code> in the service. It works, and it fails in the worst available way. <b>Docker creates a missing host directory for a plain bind mount</b>, silently, without asking. So a disk that did not mount &mdash; a cable knocked out, a drive that did not spin up in time, an fstab line someone edited &mdash; gets a fresh empty <code>/mnt/influxdb/data</code> created on the card underneath the empty mount point, InfluxDB self-initialises into it, and everything looks fine. You find out months later, when the card is full and the history you thought you had is two databases, neither of them complete.</p>\n  <p>A named volume with a bind device underneath behaves the other way round: <b>Docker will not start a container whose bind device is missing</b> &mdash; the volume is registered, but the mount that backs it fails and the container is never created. Nothing is written anywhere, and the error names the path. And the installer creates <code>data/</code> and <code>config/</code> only once something really is mounted &mdash; never on the bare mount point. Between them, &ldquo;the disk is not mounted&rdquo; and &ldquo;InfluxDB will not start&rdquo; become the same event, which is the only version of this you can notice on the day it happens.</p>\n  <p>What it costs: <code>driver_opts</code> are read when the volume is created and never again. Changing the path in this file afterwards changes nothing at all. To move the disk, the volumes have to go and be made again &mdash; with the data copied across first, or InfluxDB self-initialises into an empty one:</p>\n  <pre><code>docker compose -f ~/monitoring/docker-compose.yml down\nsudo cp -a /mnt/influxdb/. /mnt/newdisk/\ndocker volume rm monitoring_influxdb-data monitoring_influxdb-config\n<span class=\"c\"># edit the two device: lines, then</span>\ndocker compose -f ~/monitoring/docker-compose.yml up -d</code></pre>\n  <p>The installer says this too rather than leaving it to be discovered: if the answer in <code>/etc/solar-surplus/install.conf</code> and the device the volume actually carries disagree, the <code>monitoring</code> step prints both and tells you a re-run will not reconcile them.</p>\n</div>\n\n<div data-lvl=\"4\" class=\"note\">\n  <span class=\"h\">Two smaller things the bind depends on</span>\n  <p><b>Ownership.</b> The installer creates <code>data/</code> and <code>config/</code> owned by your login, which is readable and is what a backup wants. The container does not rely on that:
